        `你是一位超级有趣、富有想象力的小学英语老师。请给小学生设计一个非常生动、搞笑或奇妙的助记法（比如拆字联想、编小故事、谐音梗等，一定要符合儿童心理）来记住英文单词 "${word.english_word}" (中文意思: ${word.chinese_meaning})。然后再给出一个非常简单、小学生能看懂的英文例句及中文翻译。字数控制在150字以内。`;

      const fetchAIHintFromServer = async (prompt) => {
        const res = await fetch('/api/ai-hint', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ prompt }),
        });
        if (!res.ok) return null;
        const data = await res.json();
        return data.text?.trim() || null;
      };

      const fetchAIHintFromReaderConfig = async (prompt) => {
        const apiKey = readerAiKey.trim();
        const baseUrl = String(readerAiPreferences?.cloudBaseUrl || '').trim().replace(/\/+$/, '');
        const model = String(readerAiPreferences?.cloudModel || '').trim();
        if (!apiKey || !baseUrl || !model) return null;
        const response = await fetch(`${baseUrl}/chat/completions`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${apiKey}`
          },
          body: JSON.stringify({
            model,
            temperature: 0.7,
            max_tokens: 500,
            // DeepSeek V4 enables thinking by default. Mnemonics need the
            // final answer directly, not an empty/non-display reasoning turn.
            thinking: { type: 'disabled' },
            messages: [
              { role: 'system', content: '你是一位耐心、有趣的小学英语老师。用简体中文回答。' },
              { role: 'user', content: prompt }
            ]
          })
        });
        if (!response.ok) {
          const detail = (await response.text()).slice(0, 300);
          throw new Error(`AI 服务请求失败（HTTP ${response.status}）${detail ? `：${detail}` : ''}`);
        }
        const data = await response.json();
        const content = data?.choices?.[0]?.message?.content?.trim();
        if (!content) throw new Error('AI 服务返回了空内容');
        return content;
      };

      const generateHint = async (word) => {
        const prompt = buildHintPrompt(word);
        let readerAiError = '';
        const hasReaderAiSettings = Boolean(readerAiPreferences?.cloudBaseUrl && readerAiPreferences?.cloudModel);
        if (hasReaderAiSettings && !readerAiKey.trim()) {
          return {
            text: buildLocalHint(word),
            source: 'local',
            aiError: '阅读器 AI Key 当前未解锁。刷新页面或关闭网页后，需要重新点击右上角“阅读器账号”并输入同步加密口令。'
          };
        }
        if (readerAiKey && hasReaderAiSettings) {
          try {
            const aiText = await fetchAIHintFromReaderConfig(prompt);
            if (aiText) return { text: aiText, source: 'ai' };
          } catch (error) {
            readerAiError = error.message || '请求没有返回内容';
            setReaderAiStatus(`阅读器 AI 助记暂不可用：${readerAiError}`);
          }
        }
        if (serverAvailableRef.current) {
          try {
            const aiText = await fetchAIHintFromServer(prompt);
            if (aiText) return { text: aiText, source: 'ai' };
          } catch {
            // fall through to local
          }
        }
        return { text: buildLocalHint(word), source: 'local', aiError: readerAiError };
      };

      const handleAIHint = async () => {
        const currentWord = studyList[currentIndex];

        if (!showHint && feedback !== 'correct') {
          setShowHint(true);
          updateGlobalWordStats(currentWord.id, false);
          setSessionStats(prev => ({ ...prev, incorrect: prev.incorrect + 1 }));
        }

        setIsAILoading(true);
        setAiHintText('');
        setAiHintSource('');
        setAiHintError('');
        try {
          const { text, source, aiError } = await generateHint(currentWord);
          setAiHintText(text);
          setAiHintSource(source);
          setAiHintError(aiError || '');
        } catch {
          setAiHintText(buildLocalHint(currentWord));
          setAiHintSource('local');
        } finally {
          setIsAILoading(false);
        }
      };
      // --- End AI Hint Logic ---

      // 1. Parser Logic for Markdown and CSV File
      const handleFileUpload = (e) => {
        setErrorMsg('');
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = (event) => {
          const text = event.target.result;
          const parsed = parseData(text);

          if (parsed.length > 0) {
            const merged = mergeWordStats(parsed, words);
            applyWordsToState(merged, file.name, selectedSections);
          } else {
            setErrorMsg('未能解析出有效的单词数据。请确保文件包含标准的 Markdown 表格或 CSV 格式，且列为: id, section, english_word, chinese_meaning, learning_requirement, pos（pos 可选）。');
          }
        };
        reader.readAsText(file);
        e.target.value = '';
      };

      // Handle JSON Learning Record Upload
      const handleJsonUpload = (e) => {
        setErrorMsg('');
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = (event) => {
          try {
            const parsed = JSON.parse(event.target.result);
            if (Array.isArray(parsed.entries)) {
              localStorage.setItem(READING_VOCAB_INBOX_KEY, JSON.stringify(parsed));
              setReadingInboxEntries(parsed.entries);
              setErrorMsg('已载入阅读生词本收件箱，请点击“导入阅读生词本”。');
              return;
            }
            if (Array.isArray(parsed) && parsed.length > 0 && parsed[0].hasOwnProperty('english_word') && parsed[0].hasOwnProperty('correctCount')) {
              applyWordsToState(parsed, file.name, selectedSections);
            } else {
              setErrorMsg('导入的 JSON 格式不符合要求，请确保是本软件导出的学习记录文件。');
            }
          } catch (err) {
            setErrorMsg('解析 JSON 文件失败，请检查文件是否损坏。');
          }
        };
        reader.readAsText(file);
        e.target.value = '';
      };

      // 2. Selection Logic
      const updateUserSelectionMeta = (patch) => {
        if (!currentUserId) return;
        setUsers(prev => ({
          ...prev,
          [currentUserId]: {
            ...prev[currentUserId],
            ...patch,
            updatedAt: new Date().toISOString(),
          },
        }));
      };

      const selectGrade = (grade) => {
        setSelectedGrade(grade);
        setErrorMsg('');
        updateUserSelectionMeta({ selectedGrade: grade });
      };

      const backToGradeList = () => {
        setSelectedGrade(null);
        setErrorMsg('');
        updateUserSelectionMeta({ selectedGrade: null });
      };

      const toggleSection = (section) => {
        const next = selectedSections.includes(section)
          ? selectedSections.filter(s => s !== section)
          : [...selectedSections, section];
        setSelectedSections(next);
        updateUserSelectionMeta({ selectedSections: next });
      };

      const updateReadingFilter = (field, value) => {
        const next = { ...readingFilters, [field]: readingFilters[field] === value ? '' : value };
        setReadingFilters(next);
        updateUserSelectionMeta({ readingFilters: next });
      };

      const selectReadingGroup = (groupId) => {
        // 组切换不继承上一组的“生词/难词/已掌握”筛选，避免出现选中一组却是 0 词的假象。
        const next = {
          ...readingFilters,
          group: readingFilters.group === groupId ? '' : groupId,
          article: '',
          date: '',
          level: '',
        };
        setReadingFilters(next);
        updateUserSelectionMeta({ readingFilters: next });
      };

      const unlockReadingManager = async (event) => {
        event.preventDefault();
        setReadingManagerError('');
        if (!readerCloudUser?.email) {
          setReadingManagerError('请先登录阅读器账号。');
          return;
        }
        const { error } = await readerSupabase.auth.signInWithPassword({
          email: readerCloudUser.email,
          password: readingManagerPassword,
        });
        if (error) {
          setReadingManagerError('管理密码不正确，请重试。');
          return;
        }
        setReadingManagerPassword('');
        setReadingManagerUnlocked(true);
      };

      const deleteSelectedReadingWords = () => {
        if (!readingManagerUnlocked || readingDeleteIds.length === 0 || !currentUserId) return;
        if (!window.confirm(`确定从阅读生词学习列表删除 ${readingDeleteIds.length} 个词吗？`)) return;
        const deleted = new Set(readingDeleteIds);
        const ignored = Array.from(new Set([...(currentUser?.ignoredReadingWordIds || []), ...deleted]));
        setWords(previous => previous.filter(word => !deleted.has(word.id)));
        const nextUsers = {
          ...usersRef.current,
          [currentUserId]: { ...usersRef.current[currentUserId], ignoredReadingWordIds: ignored, updatedAt: new Date().toISOString() },
        };
        usersRef.current = nextUsers;
        setUsers(nextUsers);
        setReadingDeleteIds([]);
        setShowReadingManager(false);
        setReadingManagerUnlocked(false);
        setErrorMsg('已删除所选阅读生词；它们不会在下次导入时重新加入学习列表。');
      };

      const getFilteredReadingWords = () => {
        const readingWords = words.filter(word => word.source === 'reading');
        const selectedGroup = readingFilters.group
          ? getReadingStudyGroups(readingWords).find(group => group.id === readingFilters.group)
          : null;
        return readingWords
          // 分组规则升级后，旧的筛选 key 自动退回到全词库，不会把词“筛没”。
          .filter(word => !selectedGroup || selectedGroup.words.some(item => item.id === word.id))
          .filter(word => !readingFilters.article || getReadingArticle(word) === readingFilters.article)
          .filter(word => !readingFilters.date || getReadingDate(word) === readingFilters.date)
          .filter(word => !readingFilters.level || getReadingLevel(word).key === readingFilters.level);
      };

      const hasSelectedReadingGroup = () => (
        Boolean(readingFilters.group) && getReadingStudyGroups(words.filter(word => word.source === 'reading'))
          .some(group => group.id === readingFilters.group)
      );

      // Helper function to get the combined list of words selected
      const getWordsToStudy = () => {
        let filteredWords = [];
        const normalSections = selectedSections.filter(s => !isMistakeBookKey(s) && s !== READING_VOCAB_SECTION);

        if (normalSections.length > 0) {
          filteredWords = words.filter(w => normalSections.includes(w.section));
        }

        if (selectedSections.includes(READING_VOCAB_SECTION) || appState === 'reading') {
          filteredWords.push(...getFilteredReadingWords());
        }

        const existingIds = new Set(filteredWords.map(w => w.id));
        selectedSections.filter(isMistakeBookKey).forEach(key => {
          const grade = getMistakeBookGradeFromKey(key);
          getMistakeWords(words, grade).forEach(m => {
            if (!existingIds.has(m.id)) {
              filteredWords.push(m);
              existingIds.add(m.id);
            }
          });
        });
        return filteredWords.filter((word, index, list) => list.findIndex(item => item.id === word.id) === index);
      };

      const startStudy = () => {
        if (appState === 'reading' && !hasSelectedReadingGroup()) {
          setErrorMsg(`请先选择一个不超过 ${READING_GROUP_SIZE} 词的学习组`);
          return;
        }
        const filteredWords = getWordsToStudy();
        if (filteredWords.length === 0) {
          setErrorMsg('请至少选择一个 Unit、错题本，或调整阅读生词本筛选条件');
          return;
        }
        setErrorMsg('');

        // Optional: Shuffle the array for randomness
        const shuffled = [...filteredWords].sort(() => Math.random() - 0.5);
        setStudyList(shuffled);
        setCurrentIndex(0);
        setSessionStats({ correct: 0, incorrect: 0, mistakeWordIds: [] });
        setUserInput('');
        setFeedback(null);
        setShowHint(false);
        setSelectedChoiceKey(null);
        setRecognitionChoices([]);
        setCurrentPhonetic('');
        setCurrentAudioUrl('');
        setAppState('study');
        
        // Fetch and Auto-play first word pronunciation
        if (shuffled.length > 0) {
          fetchWordDataAndPlay(shuffled[0].english_word, true);
        }
      };

      const startReadingMistakeStudy = () => {
        const mistakeWords = words.filter(word => word.source === 'reading' && isInMistakeBook(word));
        if (!mistakeWords.length) {
          setErrorMsg('阅读错题本暂时没有待复习的单词');
          return;
        }
        const shuffled = [...mistakeWords].sort(() => Math.random() - 0.5);
        setErrorMsg('');
        setStudyList(shuffled);
        setCurrentIndex(0);
        setSessionStats({ correct: 0, incorrect: 0, mistakeWordIds: [] });
        setUserInput('');
        setFeedback(null);
        setShowHint(false);
        setSelectedChoiceKey(null);
        setRecognitionChoices([]);
        setCurrentPhonetic('');
        setCurrentAudioUrl('');
        setAppState('study');
        fetchWordDataAndPlay(shuffled[0].english_word, true);
      };

      const startPrintPreview = () => {
        if (appState === 'reading' && !hasSelectedReadingGroup()) {
          setErrorMsg(`请先选择一个不超过 ${READING_GROUP_SIZE} 词的学习组`);
          return;
        }
        const filteredWords = getWordsToStudy();
        if (filteredWords.length === 0) {
          setErrorMsg('没有可打印的单词，请调整选择条件');
          return;
        }
        setErrorMsg('');
        setPrintList(filteredWords);
        setAppState('print');
      };

      const startFlashcards = () => {
        if (appState === 'reading' && !hasSelectedReadingGroup()) {
          setErrorMsg(`请先选择一个不超过 ${READING_GROUP_SIZE} 词的学习组`);
          return;
        }
        const cards = [...getWordsToStudy()].sort(() => Math.random() - 0.5);
        if (!cards.length) {
          setErrorMsg('所选词库暂时没有单词');
          return;
        }
        setErrorMsg('');
        setFlashcardList(cards);
        setFlashcardIndex(0);
        setFlashcardFlipped(false);
        setFlashcardKnownIds(cards.filter(card => card.flashcardKnown).map(card => card.id));
        setAppState('flashcards');
      };

      const moveFlashcard = (direction) => {
        setFlashcardIndex(prev => Math.max(0, Math.min(flashcardList.length - 1, prev + direction)));
        setFlashcardFlipped(false);
      };

      const toggleFlashcardKnown = () => {
        const card = flashcardList[flashcardIndex];
        if (!card) return;
        const nextKnown = !flashcardKnownIds.includes(card.id);
        setFlashcardKnownIds(prev => nextKnown ? [...prev, card.id] : prev.filter(id => id !== card.id));
        setWords(prevWords => prevWords.map(word => word.id === card.id
          ? { ...word, flashcardKnown: nextKnown, vocabMasterProgressUpdatedAt: new Date().toISOString() }
          : word));
      };

      const exitStudy = () => {
        if ('speechSynthesis' in window) {
          window.speechSynthesis.cancel();
        }
        setFeedback(null);
        setUserInput('');
        setShowHint(false);
        setAiHintText('');
        setAiHintSource('');
        setCurrentPhonetic('');
        setCurrentAudioUrl('');
        setAppState('select');
      };

      // 3. Study Logic
      const recordStudyEvent = (wordId, isCorrect) => {
        const word = wordsRef.current.find(item => item.id === wordId);
        if (!word) return;
        const at = new Date().toISOString();
        const id = typeof crypto !== 'undefined' && typeof crypto.randomUUID === 'function'
          ? crypto.randomUUID()
          : `${at}-${wordId}-${Math.random().toString(36).slice(2, 8)}`;
        const nextEvents = normalizeStudyEvents([...studyEvents, {
          id,
          at,
          wordId,
          englishWord: word.english_word,
          chineseMeaning: word.chinese_meaning,
          section: word.section,
          result: isCorrect ? 'correct' : 'incorrect',
        }]);
        setStudyEvents(nextEvents);

        // localStorage 是 iPad 上最可靠的立即落盘点。完整档案仍会由
        // 下方的自动保存同步到服务器，但不能让答题事件只依赖 400ms 防抖。
        const activeUser = usersRef.current[currentUserId];
        if (activeUser) {
          const nextUsers = {
            ...usersRef.current,
            [currentUserId]: {
              ...activeUser,
              studyEvents: nextEvents,
              updatedAt: at,
            },
          };
          usersRef.current = nextUsers;
          setUsers(nextUsers);
          saveToBrowser(buildPayload(currentUserId, nextUsers));
        }
      };

      const updateGlobalWordStats = (wordId, isCorrect) => {
        recordStudyEvent(wordId, isCorrect);
        setWords(prevWords =>
          prevWords.map(w => {
            if (w.id !== wordId) return w;

            if (isCorrect) {
              const consecutiveCorrect = (w.consecutiveCorrect || 0) + 1;
              const hadMistakes = (w.incorrectCount || 0) > 0;
              const mistakeCleared = hadMistakes && !w.mistakeCleared && consecutiveCorrect >= MISTAKE_EXIT_STREAK
                ? true
                : (w.mistakeCleared || false);

              return {
                ...w,
                correctCount: (w.correctCount || 0) + 1,
                consecutiveCorrect,
                mistakeCleared,
                vocabMasterProgressUpdatedAt: new Date().toISOString(),
              };
            }

            return {
              ...w,
              incorrectCount: (w.incorrectCount || 0) + 1,
              consecutiveCorrect: 0,
              mistakeCleared: false,
              vocabMasterProgressUpdatedAt: new Date().toISOString(),
            };
          })
        );
      };

      const recordSessionMistake = (wordId) => {
        setSessionStats(prev => {
          if (prev.mistakeWordIds.includes(wordId)) return prev;
          return {
            ...prev,
            incorrect: prev.incorrect + 1,
            mistakeWordIds: [...prev.mistakeWordIds, wordId],
          };
        });
      };

      const handleCheck = (e) => {
        e.preventDefault();
        if (!userInput.trim() || showHint || feedback === 'correct') return;

        const currentWord = studyList[currentIndex];
        const isCorrect = userInput.trim().toLowerCase() === currentWord.english_word.trim().toLowerCase();

        if (isCorrect) {
          setFeedback('correct');
          updateGlobalWordStats(currentWord.id, true);
          setSessionStats(prev => ({ ...prev, correct: prev.correct + 1 }));

          const willGraduate = isInMistakeBook(currentWord)
            && (currentWord.consecutiveCorrect || 0) + 1 >= MISTAKE_EXIT_STREAK;
          const hasExamples = findLessonExamples(currentWord, lessonSentences).length > 0;

          // 有课文例句时留给孩子阅读，不再自动跳题
          if (!hasExamples) {
            setTimeout(() => {
              handleNext(willGraduate);
            }, willGraduate ? 1200 : 800);
          }
        } else if (feedback !== 'incorrect') {
          setFeedback('incorrect');
          updateGlobalWordStats(currentWord.id, false);
          recordSessionMistake(currentWord.id);
          // Let user try again or ask for hint
        }
      };

      const handleChoiceSelect = (choice) => {
        if (showHint || feedback === 'correct') return;
        if (selectedChoiceKey && feedback === 'incorrect') return;

        const currentWord = studyList[currentIndex];
        setSelectedChoiceKey(choice.key);

        if (choice.isCorrect) {
          setFeedback('correct');
          updateGlobalWordStats(currentWord.id, true);
          setSessionStats(prev => ({ ...prev, correct: prev.correct + 1 }));

          const willGraduate = isInMistakeBook(currentWord)
            && (currentWord.consecutiveCorrect || 0) + 1 >= MISTAKE_EXIT_STREAK;
          const hasExamples = findLessonExamples(currentWord, lessonSentences).length > 0;

          if (!hasExamples) {
            setTimeout(() => {
              handleNext(willGraduate);
            }, willGraduate ? 1200 : 900);
          }
        } else {
          setFeedback('incorrect');
          updateGlobalWordStats(currentWord.id, false);
          recordSessionMistake(currentWord.id);
        }
      };

      const handleNext = (graduatedFromMistakeBook = false) => {
        setFeedback(null);
        setUserInput('');
        setShowHint(false);
        setSelectedChoiceKey(null);
        setAiHintText('');
        setAiHintSource('');
        if (graduatedFromMistakeBook) {
          // brief pause already handled in handleCheck timeout
        }
        if (currentIndex < studyList.length - 1) {
          setCurrentIndex(currentIndex + 1);
          fetchWordDataAndPlay(studyList[currentIndex + 1].english_word, true);
        } else {
          setAppState('summary');
        }
      };

      const handleShowHint = () => {
        setShowHint(true);
        const currentWord = studyList[currentIndex];
        // 连续输错后再看提示，仍只记作这张卡的 1 次错词。
        if (feedback !== 'incorrect') {
          updateGlobalWordStats(currentWord.id, false);
          recordSessionMistake(currentWord.id);
        }
      };

      // 4. Export Logic
      const exportJSON = () => {

        const linkElement = document.createElement('a');
        linkElement.setAttribute('href', dataUri);
        linkElement.setAttribute('download', exportFileDefaultName);
        linkElement.click();
      };

      const renderImport = () => (

          <div className={`w-full max-w-lg mb-6 p-4 rounded-xl border text-sm ${

            {serverAvailable ? (

            ) : IS_FILE_PROTOCOL ? (

                <p>请改用同目录下的启动器（效果等同于「一键打开 app」）：</p>
                <p>

                  <span className="text-red-700"> ← 双击这个文件</span>
                </p>
                <p className="text-xs opacity-80">启动后会自动打开浏览器，学习记录写入 {DATA_FILE_NAME}。现在只能暂存于浏览器缓存。</p>
              </div>

              <p>
                当前仅浏览器缓存。请在终端运行

              </p>
            )}
          </div>

          <p className="w-full max-w-lg mb-4 text-xs text-gray-500">
            阅读器云同步：{cloudReadingStatus}
            <a className="ml-2 text-blue-600 hover:underline" href="https://lesong36.github.io/reading/" target="_blank" rel="noreferrer">登录阅读器账号</a>
          </p>

              >
                {currentUserId ? '导入阅读生词本' : '请先连接阅读器账号'}
              </button>
            </div>
          )}

          {!currentUserId ? (
            <div className="w-full max-w-md mb-8 p-6 bg-white rounded-xl border-2 border-blue-100 shadow-sm">
              <p className="text-gray-600">请连接阅读器账号。该账号就是唯一学习档案，词库和学习记录会自动跨设备同步。</p>
            </div>
          ) : (
            <>
              <p className="text-gray-600 mb-2 max-w-md">
                当前学习档案：<span className="font-semibold text-blue-700">{readerCloudUser?.email || currentUser?.name}</span>
                {currentUser?.vocabSource && (
                  <span className="text-gray-400"> · 词库来源：{currentUser.vocabSource}</span>
                )}
              </p>
              <p className="text-gray-600 mb-8 max-w-md">
                请导入词表，或通过 <code className="bg-gray-100 px-1 rounded text-sm">vocab_server.py</code> 启动后自动加载 <code className="bg-gray-100 px-1 rounded text-sm">词库.md</code>。<br/>
                数据需包含至少5列：<br/>
                <code className="bg-gray-100 px-2 py-1 rounded text-sm text-pink-600 mt-2 inline-block">id, section, english_word, chinese_meaning, learning_requirement, pos</code>
              </p>

              {errorMsg}
            </div>
          )}
        </div>
      );

      const renderSelect = () => {

        const todayStudy = getTodayStudySummary(studyEvents);
        const gradeMistakeStats = selectedGrade ? countMistakeByLevel(words, selectedGrade) : null;
        const selectedWordCount = getWordsToStudy().length;
        const grades = getGradesFromSections(sections);
        const gradeSections = selectedGrade ? getSectionsForGrade(sections, selectedGrade) : [];
        const selectedUnitCount = selectedGrade
          ? gradeSections.filter(s => selectedSections.includes(s)).length

        const renderMistakeLevelBadges = (stats) => (
          <div className="flex flex-wrap gap-1 mt-2">

                  <div className="rounded-lg bg-white p-3"><div className="text-xl font-black text-emerald-600">{todayStudy.correct}</div><div className="text-xs text-gray-500">答对次数</div></div>
                  <div className="rounded-lg bg-white p-3"><div className="text-xl font-black text-red-600">{todayStudy.incorrect}</div><div className="text-xs text-gray-500">答错次数</div></div>

            <button

            >

            <button

              className="flex-1 bg-amber-500 hover:bg-amber-600 text-white font-bold py-3 px-6 rounded-lg shadow-md transition-colors flex justify-center items-center gap-2"
            >
              <Layers size={20} />

            </button>
            <button 
              onClick={startPrintPreview}
              className="flex-1 bg-purple-600 hover:bg-purple-700 text-white font-bold py-3 px-6 rounded-lg shadow-md transition-colors flex justify-center items-center gap-2"
            >
              <Printer size={20} />
              打印卡片 ({selectedWordCount} 词)
            </button>
            <button 
              onClick={() => setAppState('import')}
              className="bg-gray-200 hover:bg-gray-300 text-gray-700 font-bold py-3 px-6 rounded-lg transition-colors"
            >

            </button>

          </>

        if (appState === 'reading') {

                <ChevronLeft size={18} /> 返回词库选择
              </button>
              <div className="mb-6">

                  {!readingManagerUnlocked ? (

        const currentWord = studyList[currentIndex];

        const progress = ((currentIndex) / studyList.length) * 100;
        const liveWord = words.find(w => w.id === currentWord.id) || currentWord;
        const mistakeMeta = isInMistakeBook(liveWord) ? getMistakeLevel(liveWord) : null;
        const exitProgress = isInMistakeBook(liveWord)
          ? (liveWord.consecutiveCorrect || 0)
          : 0;
        const justGraduated = feedback === 'correct' && liveWord.mistakeCleared && (liveWord.incorrectCount || 0) > 0;
        const choicesLocked = showHint || feedback === 'correct' || (feedback === 'incorrect' && selectedChoiceKey);
        const activeChoices = recognitionChoices.length > 0
          ? recognitionChoices
          : (recognitionMode ? buildRecognitionChoices(currentWord, words) : []);
        const showAnswered = feedback === 'correct' || feedback === 'incorrect' || showHint;
        const lessonExamples = showAnswered
          ? findLessonExamples(currentWord, lessonSentences)
          : [];

        const getChoiceClassName = (choice) => {
          if (showHint && choice.isCorrect) {
            return 'border-green-500 bg-green-50 text-green-800 ring-2 ring-green-200';
          }
          if (feedback === 'correct' && choice.key === selectedChoiceKey) {
            return 'border-green-500 bg-green-50 text-green-800';
          }
          if (feedback === 'incorrect' && choice.key === selectedChoiceKey) {
            return 'border-red-500 bg-red-50 text-red-800 animate-shake';
          }
          if (feedback === 'incorrect' && choice.isCorrect) {
            return 'border-green-500 bg-green-50 text-green-800';
          }
          if (selectedChoiceKey === choice.key) {
            return 'border-blue-500 bg-blue-50 text-blue-800';
          }
          return 'border-gray-200 bg-white hover:border-blue-300 hover:bg-blue-50 text-gray-800';
        };

              {mistakeMeta && (
                <div className="flex flex-wrap items-center gap-2 mb-2 text-xs">
                  <span className={`px-2 py-0.5 rounded border font-medium ${mistakeMeta.className}`}>
                    错题·{mistakeMeta.label}
                  </span>
                  <span className="text-gray-500">
                    移出进度：连续答对 {exitProgress}/{MISTAKE_EXIT_STREAK}
                  </span>
                </div>
              )}
              <div className="w-full bg-gray-200 rounded-full h-2.5">
                <div className="bg-blue-600 h-2.5 rounded-full transition-all duration-300" style={{ width: `${progress}%` }}></div>
              </div>
            </div>

            {/* Word Card */}
            <div className="bg-white rounded-2xl shadow-xl border border-gray-100 p-8 text-center relative overflow-hidden">
              {/* Requirement Tag */}
              <div className={`absolute top-4 left-4 text-xs font-bold px-2 py-1 rounded ${
                recognitionMode ? 'bg-amber-100 text-amber-800' : 'bg-blue-100 text-blue-800'
              }`}>
                {recognitionMode ? '见英选义 · 四选一' : currentWord.learning_requirement}
              </div>
              
              <button 
                onClick={() => {
                  playWordAudio(currentWord.english_word, currentAudioUrl);
                }}
                className="absolute top-4 right-4 p-2 text-gray-400 hover:text-blue-600 hover:bg-blue-50 rounded-full transition-colors"
                title="播放发音"
              >
                <Volume2 size={24} />
              </button>

              {recognitionMode ? (
                <>
                  <div className="my-8 flex flex-col items-center">
                    <p className="text-sm text-gray-500 mb-3">请选择正确的中文含义</p>
                    <h3 className="text-4xl font-bold text-gray-800 mb-2 font-mono tracking-wide">{currentWord.english_word}</h3>
                    {currentPhonetic && (
                      <div className="text-xl text-gray-500 mb-2 font-mono font-medium tracking-wide">
                        [{currentPhonetic}]
                      </div>
                    )}
                    {showHint && (
                      <p className="text-sm text-green-600 font-medium mt-2 animate-fade-in">正确答案已高亮</p>
                    )}
                  </div>

                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 mt-4">
                    {activeChoices.map(choice => (
                      <button
                        key={choice.key}
                        type="button"
                        onClick={() => handleChoiceSelect(choice)}
                        disabled={choicesLocked}
                        className={`text-left px-4 py-4 rounded-xl border-2 transition-all font-medium leading-snug ${getChoiceClassName(choice)} ${
                          choicesLocked ? 'cursor-default' : 'cursor-pointer'
                        }`}
                      >
                        {choice.text}
                      </button>
                    ))}
                  </div>

                  {feedback === 'incorrect' && !showHint && (
                    <p className="text-sm text-red-600 mt-4">答错了，绿色为正确含义。可点「不会 / 提示」或「下一个」继续。</p>
                  )}
                </>
              ) : (
                <>
                  <div className="my-8 flex flex-col items-center">
                    <h3 className="text-4xl font-bold text-gray-800 mb-2">{currentWord.chinese_meaning}</h3>
                    
                    {/* Display Phonetic */}
                    {currentPhonetic && (
                      <div className="text-xl text-gray-500 mb-4 font-mono font-medium tracking-wide">
                        [{currentPhonetic}]
                      </div>
                    )}
                    
                    {showHint && (
                      <div className="text-2xl font-mono text-green-600 tracking-wider mb-4 animate-fade-in">
                        {currentWord.english_word}
                      </div>
                    )}
                  </div>

                  <form onSubmit={handleCheck} className="mt-8 relative">
                    <input
                      ref={inputRef}
                      type="text"
                      value={userInput}
                      onChange={(e) => setUserInput(e.target.value)}
                      placeholder="请输入英文拼写..."
                      autoCapitalize="none"
                      autoComplete="off"
                      disabled={showHint || feedback === 'correct'}
                      className={`w-full text-center text-2xl py-4 px-6 border-2 rounded-xl focus:outline-none transition-colors ${
                        feedback === 'correct' ? 'border-green-500 bg-green-50 text-green-700' : 
                        feedback === 'incorrect' ? 'border-red-500 bg-red-50 text-red-700 animate-shake' : 
                        'border-gray-300 focus:border-blue-500 bg-gray-50 font-mono'
                      }`}
                    />
                    
                    {/* Feedback Icons inside input */}
                    {feedback === 'correct' && <Check className="absolute right-4 top-1/2 -translate-y-1/2 text-green-500" size={28} />}
                    {feedback === 'incorrect' && <X className="absolute right-4 top-1/2 -translate-y-1/2 text-red-500" size={28} />}
                  </form>
                </>
              )}

              {justGraduated && (
                <p className="text-sm text-green-600 font-medium mt-3">已连续答对 {MISTAKE_EXIT_STREAK} 次，已从错题本移出</p>
              )}

              {/* 课文例句：答对 / 答错 / 看提示后显示 */}
              {showAnswered && lessonExamples.length > 0 && (
                <div className="mt-5 text-left animate-fade-in">
                  <div className="rounded-xl border border-sky-200 bg-sky-50 p-4 shadow-sm">
                    <h4 className="text-sky-800 font-bold mb-3 flex items-center gap-2">
                      <BookOpen size={18} />
                      课文例句
                      {lessonExamples[0]?.source && (
                        <span className="text-xs font-medium px-1.5 py-0.5 rounded bg-sky-200 text-sky-900">
                          {lessonExamples[0].source}
                        </span>
                      )}
                    </h4>
                    <ul className="space-y-3">
                      {lessonExamples.map((ex, idx) => (
                        <li key={`${ex.en}-${idx}`} className="leading-relaxed">
                          <p
                            className="text-gray-800 font-medium"
                            dangerouslySetInnerHTML={{
                              __html: highlightLessonWord(ex.en, currentWord.english_word),
                            }}
                          />
                          {ex.zh && (
                            <p className="text-sm text-gray-500 mt-1">{ex.zh}</p>
                          )}
                        </li>
                      ))}
                    </ul>
                  </div>
                </div>
              )}

              {/* Action Buttons */}
              <div className="mt-6 flex gap-3 justify-center w-full">
                {!recognitionMode && !showHint && feedback !== 'correct' ? (
                  <>
                    <button 
                      onClick={handleCheck}
                      className="flex-1 bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-lg shadow transition-colors"
                    >
                      提交答案 (Enter)
                    </button>
                    <button 
                      onClick={handleShowHint}
                      type="button"
                      className="px-6 bg-gray-100 hover:bg-gray-200 text-gray-700 font-bold py-3 rounded-lg transition-colors"
                    >
                      不会 / 提示
                    </button>
                  </>
                ) : recognitionMode && !showHint && feedback !== 'correct' ? (
                  <>
                    <button
                      onClick={handleNext}
                      type="button"
                      disabled={!feedback && !showHint}
                      className={`flex-1 font-bold py-3 rounded-lg shadow transition-colors ${
                        feedback === 'incorrect'
                          ? 'bg-green-600 hover:bg-green-700 text-white'
                          : 'bg-gray-100 text-gray-400 cursor-not-allowed'
                      }`}
                    >
                      下一个 (Enter) <ArrowRight size={20} className="inline ml-1" />
                    </button>
                    <button 
                      onClick={handleShowHint}
                      type="button"
                      className="px-6 bg-gray-100 hover:bg-gray-200 text-gray-700 font-bold py-3 rounded-lg transition-colors"
                    >
                      不会 / 提示
                    </button>
                  </>
                ) : (
                  <button 
                    onClick={handleNext}
                    type="button"
                    autoFocus
                    className="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-3 rounded-lg shadow transition-colors flex justify-center items-center gap-2"
                  >
                    下一个 (Enter) <ArrowRight size={20} />
                  </button>
                )}
              </div>
              
              {/* AI Hint Section */}
              <div className="mt-6">
                {!aiHintText && !isAILoading ? (
                  <button
                    onClick={handleAIHint}
                    className="w-full py-4 bg-purple-50 text-purple-700 hover:bg-purple-100 rounded-xl border border-purple-200 flex justify-center items-center gap-2 transition-colors font-semibold shadow-sm"
                  >
                    <Sparkles size={20} />
                    对这个词不熟悉？点击获取 AI 专属助记
                  </button>
                ) : (
                  <div className="bg-purple-50 border border-purple-200 rounded-xl p-6 text-left animate-fade-in relative shadow-sm">
                    <Sparkles className="absolute top-4 right-4 text-purple-300" size={24} />
                    <h4 className="text-purple-800 font-bold mb-2 flex items-center gap-2">
                      {isAILoading ? <Loader2 className="animate-spin" size={18}/> : <Sparkles size={18}/>}
                      智能助记
                      {!isAILoading && aiHintSource === 'ai' && (
                        <span className="text-xs font-normal px-1.5 py-0.5 rounded bg-purple-200 text-purple-800">阅读器 AI</span>
                      )}
                      {!isAILoading && aiHintSource === 'local' && (
                        <span className="text-xs font-normal px-1.5 py-0.5 rounded bg-gray-200 text-gray-600">本地备用</span>
                      )}
                    </h4>
                    <p className="text-gray-700 leading-relaxed whitespace-pre-line">
                      {isAILoading ? '正在生成助记内容...' : aiHintText}
                    </p>
                    {!isAILoading && aiHintError && (
                      <p className="mt-4 rounded-lg border border-amber-200 bg-amber-50 px-3 py-2 text-xs leading-5 text-amber-800">
                        阅读器 AI 请求失败，已改用本地备用助记：{aiHintError}。可点击右上角“阅读器账号”检查模型设置与 Key。
                      </p>
                    )}
                  </div>
                )}
              </div>
            </div>
            
            {/* Live Stats */}
            <div className="mt-6 flex justify-center gap-6 text-sm text-gray-500">
              <span className="flex items-center gap-1"><Check size={16} className="text-green-500"/> 本次答对: {sessionStats.correct}</span>
              <span className="flex items-center gap-1"><X size={16} className="text-red-500"/> 本次错词: {sessionStats.incorrect}</span>
            </div>
          </div>
        );
      };

      const renderSummary = () => (
        <div className="max-w-2xl mx-auto text-center animate-fade-in">
          <div className="bg-white rounded-2xl shadow-xl border border-gray-100 p-10">
            <div className="w-20 h-20 bg-green-100 rounded-full flex items-center justify-center mx-auto mb-6">
              <Check size={40} className="text-green-600" />
            </div>
            <h2 className="text-3xl font-bold text-gray-800 mb-2">学习完成！</h2>
            <p className="text-gray-600 mb-8">你已经完成了本次选择的所有单词。学习记录已自动保存{serverAvailable ? `到 ${DATA_FILE_NAME}` : '到浏览器缓存'}。</p>
            
            <div className="grid grid-cols-2 gap-6 mb-10">
              <div className="bg-green-50 rounded-xl p-6 border border-green-100">
                <div className="text-green-800 text-sm font-bold mb-1">答对</div>
                <div className="text-4xl font-black text-green-600">{sessionStats.correct}</div>
              </div>
              <div className="bg-red-50 rounded-xl p-6 border border-red-100">
                <div className="text-red-800 text-sm font-bold mb-1">错词数</div>
                <div className="text-4xl font-black text-red-600">{sessionStats.incorrect}</div>
              </div>
            </div>

            <div className="flex flex-col sm:flex-row gap-4 justify-center">
              <button 
                onClick={() => setAppState('select')}
                className="flex-1 bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-6 rounded-lg shadow transition-colors flex justify-center items-center gap-2"
              >
                <RotateCcw size={20} />
                继续选择 Unit / 年级
              </button>
              <button 
                onClick={exportJSON}
                className="flex-1 bg-gray-800 hover:bg-gray-900 text-white font-bold py-3 px-6 rounded-lg shadow transition-colors flex justify-center items-center gap-2"
              >
                <FileJson size={20} />
                导出学习记录 (JSON)
              </button>
            </div>
          </div>
        </div>
      );

      return (
        <div className="min-h-screen bg-gray-50 text-gray-800 font-sans">
          {showReaderLogin && renderReaderLoginPanel()}

          <header className="bg-white border-b border-gray-200 shadow-sm px-6 py-4 mb-8 no-print">
            <div className="max-w-4xl mx-auto flex items-center justify-between gap-4">
              <h1 className="text-xl font-bold text-blue-700 flex items-center gap-2">
                <BookOpen size={24} />
                VocabMaster 单词达人
              </h1>

              <div className="flex items-center gap-3 flex-wrap justify-end">
                {serverAvailable && (
                  <span className="text-xs text-green-700 bg-green-50 border border-green-200 px-2 py-1 rounded-full">
                    {DATA_FILE_NAME}
                  </span>
                )}
                {saveStatus === 'saving' && (
                  <span className="text-xs text-gray-400 flex items-center gap-1">
                    <Loader2 size={14} className="animate-spin" /> 保存中
                  </span>
                )}
                {saveStatus === 'saved-file' && (
                  <span className="text-xs text-green-600 flex items-center gap-1">
                    <Save size={14} /> 已写入 {DATA_FILE_NAME}
                  </span>
                )}
                {saveStatus === 'saved-browser' && (
                  <span className="text-xs text-amber-600 flex items-center gap-1">
                    <Save size={14} /> 已缓存到浏览器
                  </span>
                )}
                {saveStatus === 'save-failed' && (
                  <span className="text-xs text-red-600 flex items-center gap-1">
                    <X size={14} /> 浏览器不允许保存；请关闭无痕浏览或允许此网站的数据存储
                  </span>
                )}

                <button
                  onClick={() => window.open('https://lesong36.github.io/reading/', '_blank', 'noopener')}
                  className="text-sm flex items-center gap-1.5 px-3 py-1.5 rounded-lg border border-indigo-300 bg-indigo-50 text-indigo-700 hover:bg-indigo-100 transition-colors"
                  title="打开 Readmaster 闹闹爱阅读"
                >
                  <BookOpen size={16} /> 打开 Readmaster
                </button>

                <button
                  onClick={() => setShowReaderLogin(true)}
                  className={`text-sm flex items-center gap-1.5 px-3 py-1.5 rounded-lg border transition-colors ${readerCloudUser ? 'border-emerald-300 bg-emerald-50 text-emerald-700' : 'border-blue-300 bg-blue-50 text-blue-700 hover:bg-blue-100'}`}
                  title={readerCloudUser ? `${cloudReadingStatus} ${readerAiStatus}` : '登录阅读器账号以同步阅读生词和 AI 设置'}
                >
                  <BookOpen size={16} />
                  {readerCloudUser ? `阅读器：${readerCloudUser.email}` : '连接阅读器账号'}
                </button>

                {readerCloudUser && (
                  <button
                    onClick={forceReaderCloudSync}
                    disabled={isForcingCloudSync}
                    className="text-sm flex items-center gap-1.5 px-3 py-1.5 rounded-lg border border-violet-300 bg-violet-50 text-violet-700 hover:bg-violet-100 disabled:opacity-60 transition-colors"
                    title="立即读取云端记录、合并历史档案并写回"
                  >
                    <RotateCcw size={16} className={isForcingCloudSync ? 'animate-spin' : ''} />
                    {isForcingCloudSync ? '同步中…' : '强制同步'}
                  </button>
                )}

                {pendingReadingEntries.length > 0 && (
                  <button onClick={importReadingInbox} className="text-sm px-3 py-1.5 rounded-lg bg-emerald-600 text-white hover:bg-emerald-700 transition-colors">
                    导入阅读生词本 ({pendingReadingEntries.length})
                  </button>
                )}

                {appState !== 'import' && appState !== 'print' && words.length > 0 && (
                  <button 
                    onClick={exportJSON}
                    className="text-sm flex items-center gap-1 text-gray-600 hover:text-blue-600 transition-colors"
                    title="导出当前用户学习记录 JSON"
                  >
                    <Download size={16} />
                    导出记录
                  </button>
                )}
              </div>
            </div>
          </header>

          <main className={`max-w-4xl mx-auto px-4 pb-12 ${appState === 'print' ? 'max-w-none print-main-container' : ''}`}>
            {readerCloudUser && appState !== 'print' && (
              <div className="mb-5 flex flex-wrap items-center justify-between gap-3 rounded-xl border border-violet-200 bg-violet-50 px-4 py-3 no-print">
                <div className="text-sm text-violet-900">
                  <span className="font-semibold">阅读器云同步已连接</span>
                  <span className="ml-2 text-violet-700">{cloudReadingStatus}</span>
                </div>
                <button
                  onClick={forceReaderCloudSync}
                  disabled={isForcingCloudSync}
                  className="inline-flex items-center gap-2 rounded-lg bg-violet-600 px-4 py-2 text-sm font-semibold text-white hover:bg-violet-700 disabled:bg-violet-300"
                >
                  <RotateCcw size={16} className={isForcingCloudSync ? 'animate-spin' : ''} />
                  {isForcingCloudSync ? '正在强制同步…' : '立即强制同步'}
                </button>
              </div>
            )}
            {!isHydrated ? (
              <div className="flex justify-center py-20 text-gray-400">
                <Loader2 className="animate-spin mr-2" size={20} />
                正在加载本地记录...
              </div>
            ) : (
              <>
                {appState === 'import' && renderImport()}
                {(appState === 'select' || appState === 'reading') && renderSelect()}
                {appState === 'study' && renderStudy()}
                {appState === 'flashcards' && renderFlashcards()}
                {appState === 'summary' && renderSummary()}
                {appState === 'print' && renderPrint()}
              </>
            )}
          </main>
          <audio ref={audioElementRef} preload="auto" playsInline aria-hidden="true" className="hidden" />

          <style dangerouslySetInnerHTML={{__html: `
            @keyframes shake {
              0%, 100% { transform: translateX(0); }
              25% { transform: translateX(-5px); }
              50% { transform: translateX(5px); }
              75% { transform: translateX(-5px); }
            }
            .animate-shake {
              animation: shake 0.4s ease-in-out;
            }
            @keyframes fadeIn {
              from { opacity: 0; transform: translateY(10px); }
              to { opacity: 1; transform: translateY(0); }
            }
            .animate-fade-in {
              animation: fadeIn 0.3s ease-out forwards;
            }

            /* 打印样式优化 */
            @media print {
              @page {
                margin: 1cm;
                size: A4 portrait;
              }
              body {
                background-color: white !important;
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
              }
              .no-print {
                display: none !important;
              }
              .print-main-container {
                max-width: 100% !important;
                padding: 0 !important;
                margin: 0 !important;
              }
              .print-grid {
                grid-template-columns: repeat(3, 1fr) !important;
                gap: 1rem !important;
                padding-bottom: 0 !important;
              }
              .print-card {
                break-inside: avoid;
                page-break-inside: avoid;
                border-color: #000 !important;
              }
              /* 防止阴影和圆角在旧打印机上变黑 */
              .shadow-xl, .shadow-md, .shadow-sm, .shadow {
                box-shadow: none !important;
              }
            }
          `}} />
        </div>
      );
    }

    createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
