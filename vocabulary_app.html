    import React, { useState, useEffect, useMemo, useRef } from 'https://esm.sh/react@18.2.0';

    const STORAGE_KEY = 'vocabmaster_app_data';

    const DATA_FILE_NAME = 'vocab_data.json';
    const READING_VOCAB_INBOX_KEY = 'vocabmaster_reader_inbox_v1';
    const READING_VOCAB_SECTION = '阅读生词本';
    const READER_SUPABASE_URL = 'https://faeixgpjhnwpfzfkgjsu.supabase.co';
    const READER_SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_vg-bfePJ4OSgoOOiMEJeCg_7YxdAdkx';
    const readerSupabase = createClient(READER_SUPABASE_URL, READER_SUPABASE_PUBLISHABLE_KEY, {
      auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true }
    });
    const IS_FILE_PROTOCOL = window.location.protocol === 'file:';
    const GRADE_ORDER = ['三上', '三下', '四上', '四下', '五上', '五下', '音乐', 'RFD1', 'RFD2', 'RFD3'];
    const LESSON_TEXT_FILES = ['./四上英语课文.md', './四上英语课文_英文.md'];
    const MAX_LESSON_EXAMPLES = 3;

    const normalizeLessonText = (text) =>
      (text || '')
        .replace(/[\u2018\u2019]/g, "'")
        .replace(/[\u201C\u201D]/g, '"')
        .replace(/\u2026/g, '...')
        .toLowerCase();

    const hasChinese = (text) => /[\u4e00-\u9fff]/.test(text || '');

    const parseLessonText = (raw) => {
      const lines = (raw || '').split(/\r?\n/).map(line => line.trim());
      const sentences = [];
      let unit = '';
      let lesson = '';
      let lessonTitle = '';

      for (let i = 0; i < lines.length; i++) {
        const line = lines[i];
        if (!line) continue;

        const unitMatch = line.match(/^#\s*(U\d+)\b(.*)$/i);
        if (unitMatch) {
          unit = unitMatch[1].toUpperCase();
          lesson = '';
          lessonTitle = '';
          continue;
        }

        const lessonMatch = line.match(/^##\s*(L\d+)\b\s*(.*)$/i);
        if (lessonMatch) {
          lesson = lessonMatch[1].toUpperCase();
          lessonTitle = (lessonMatch[2] || '').trim();
          continue;
        }

        if (line.startsWith('#')) continue;
        if (hasChinese(line)) continue;

        let zh = '';
        if (i + 1 < lines.length && hasChinese(lines[i + 1])) {
          zh = lines[i + 1];
          i += 1;
        }

        sentences.push({
          en: line,
          zh,
          unit,
          lesson,
          lessonTitle,
          source: [unit, lesson].filter(Boolean).join(' '),
        });
      }

      return sentences;
    };

    const getPreferredLessonUnit = (section) => {
      const match = (section || '').match(/Unit\s*(\d+)/i);
      return match ? `U${match[1]}` : '';
    };

    const sentenceContainsWord = (sentence, wordText) => {
      const word = normalizeLessonText(wordText).trim();
      const hay = normalizeLessonText(sentence);
      if (!word || !hay) return false;

      if (word.includes(' ')) {
        const phrase = word.replace(/\s+/g, '\\s+');
        return new RegExp(phrase, 'i').test(hay);
      }

      const escaped = word.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
      const pattern = new RegExp(
        `(^|[^a-z0-9])${escaped}(?:'s|s|es|ed|ing|er|est)?(?![a-z0-9])`,
        'i'
      );
      return pattern.test(hay);
    };

    const findLessonExamples = (word, lessonSentences, limit = MAX_LESSON_EXAMPLES) => {
      if (!word || !lessonSentences?.length) return [];
      const preferredUnit = getPreferredLessonUnit(word.section);
      const matched = lessonSentences.filter(s => sentenceContainsWord(s.en, word.english_word));
      const sameUnit = preferredUnit
        ? matched.filter(s => (s.unit || '').toUpperCase() === preferredUnit)
        : [];
      const ranked = (sameUnit.length ? sameUnit : matched);
      const seen = new Set();
      const unique = [];
      for (const item of ranked) {
        const key = normalizeLessonText(item.en);
        if (seen.has(key)) continue;
        seen.add(key);
        unique.push(item);
        if (unique.length >= limit) break;
      }
      return unique;
    };

    const highlightLessonWord = (sentence, wordText) => {
      const word = (wordText || '').trim();
      if (!sentence || !word) return sentence;

      if (word.includes(' ')) {
        const parts = word.split(/\s+/).map(p => p.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'));
        const re = new RegExp(`(${parts.join('\\s+')})`, 'ig');
        return String(sentence).replace(re, '<mark class="bg-amber-200 text-amber-900 px-0.5 rounded">$1</mark>');
      }

      const escaped = word.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
      const re = new RegExp(`\\b(${escaped}(?:'s|s|es|ed|ing|er|est)?)\\b`, 'ig');
      return String(sentence).replace(re, '<mark class="bg-amber-200 text-amber-900 px-0.5 rounded">$1</mark>');
    };

    const parseSectionMeta = (section) => {
      const match = section.match(/^(.+?)(Unit .+)$/);
      if (match) {
        return { grade: match[1].trim(), unitLabel: match[2], full: section };
      }
      return { grade: section, unitLabel: '全部', full: section };
    };

    const isRecognitionWord = (word) => (
      (word?.learning_requirement || '').includes('见到英文')
    );

    const normalizeMeaning = (text) => (text || '').trim();

    const POS_CANON = {
      'n.': 'n', noun: 'n',
      'v.': 'v', verb: 'v',
      'adj.': 'adj', adjective: 'adj',
      'adv.': 'adv', adverb: 'adv',
      'det.': 'det', determiner: 'det',
      'pron.': 'pron', pronoun: 'pron',
      'prep.': 'prep', preposition: 'prep',
      'conj.': 'conj', conjunction: 'conj',
      'num.': 'num', number: 'num',
      'phr.': 'phr', phrase: 'phr',
    };

    const getWordPos = (word) => {
      const raw = (word?.pos || '').trim().toLowerCase();
      if (!raw) return '';
      return POS_CANON[raw] || raw.replace(/\.$/, '');
    };

    const POS_LABEL_ZH = {
      n: '名词', v: '动词', adj: '形容词', adv: '副词',
      det: '限定词', pron: '代词', prep: '介词', conj: '连词',
      num: '数词', phr: '短语',
    };

    // 重点词的结构记忆（词根词缀 / 词性转化 / 发音），非故事型助记
    const SPECIAL_STUDY_TIPS = {
      worried: 'worry(担心) → worried：y→i 再加 -ed，动词变形容词「担心的」',
      worry: '词族：worry(v.) → worried(adj.)；Don’t worry = 别担心',
      excited: 'excite + -ed → excited：人对……感到兴奋（ed 表自身感受）',
      interesting: 'interest + -ing → interesting：事物「令人感兴趣」（ing 表主动特征）',
      different: 'differ(不同) + -ent → different(形容词)',
      remember: 're-(再) + member → 再想起来；反义 forget',
      together: 'to + get + her 可拆读，整体记「一起」',
      welcome: 'wel(好) + come(来) → 欢迎到来',
      'in time': '词组：in + time → 及时 / 刚好赶上',
      'calm down': '动词词组：calm(冷静) + down → 冷静下来',
      'excuse me': '礼貌用语：excuse(原谅) + me → 劳驾 / 借过',
      better: 'good / well 的不规则比较级：good → better → best',
      best: 'good / well 的不规则最高级：good → better → best',
      angry: '发怒 anger(n.) → angry(adj.)；拼写注意 -gry',
      sad: '短元音 /æ/；反义 happy',
      happy: '词尾 -y 常构成形容词；反义 sad',
      late: '开音节 a_e → /eɪ/；反义 early',
      matter: 'What’s the matter? = What’s wrong? 固定问句',
      should: '情态动词：should + 动词原形 → 应该……',
      could: '情态动词：could 比 can 更礼貌（Could you…?）',
      would: 'Would you please…? 礼貌请求；I’d like = I would like',
      must: '情态动词：must + 动词原形 → 必须',
      may: '情态动词：May I…? 请求允许',
      polite: '反义 impolite / not polite；词族 politely',
      hungry: 'hunger(n.) → hungry(adj.)：饿的',
      thirsty: 'thirst(n.) → thirsty(adj.)：渴的',
      healthy: 'health(n.) + -y → healthy(adj.)：健康的',
      lovely: 'love + -ly → lovely：可爱的（此处 -ly 构成形容词）',
      favourite: '美式 favorite；favour + -ite → 最喜欢的',
      sandwich: '可拆读 sand-wich；复合名词',
      tomato: '复数 tomatoes（加 -es）',
      potato: '复数 potatoes（加 -es）',
      animal: '重音在第一音节 A-ni-mal',
      nature: '词族：nature(n.) → natural(adj.)',
      without: 'with + out → 没有 / 不带',
      fireworks: 'fire + works → 烟花（合成词）',
      firecrackers: 'fire + crackers → 鞭炮（合成词）',
      lantern: '词族：lantern → Lantern Festival 元宵节',
      festival: '重音 fes-ti-val；Spring / Lantern Festival',
      character: '多音节拆读 char-ac-ter；也可指汉字',
      monster: '词尾 -er 表人或物；故事中的 Nian',
      afraid: 'a + fraid；be afraid of… 害怕……',
      banana: '开音节反复：ba-na-na，重音常在第二音节',
      garden: 'gar-den 两音节；ar 常发 /ɑː/',
      problem: 'prob-lem 两音节；o 发短音',
      tomorrow: 'to-mor-row；双写 r',
      today: 'to + day → 今天',
      classroom: 'class + room → 教室（合成词）',
      schoolbag: 'school + bag → 书包（合成词）',
      raincoat: 'rain + coat → 雨衣（合成词）',
      'hot dog': 'hot + dog → 热狗（合成词组）',
      'ice-skating': 'ice + skating → 滑冰；skate + -ing',
      leaves: 'leaf 的不规则复数：f → ves',
      mice: 'mouse 的不规则复数',
      sunny: 'sun + -y → sunny：出太阳的',
      rainy: 'rain + -y → rainy：下雨的',
      windy: 'wind + -y → windy：有风的',
      cloudy: 'cloud + -y → cloudy：多云的',
      snowy: 'snow + -y → snowy：下雪的',
    };

    const buildCardStudyTip = (word) => {
      const en = (word?.english_word || '').trim();
      if (!en) return '';
      const lower = en.toLowerCase();
      const pos = getWordPos(word);
      const posLabel = POS_LABEL_ZH[pos] || '';
      const tips = [];

      if (SPECIAL_STUDY_TIPS[lower]) {
        tips.push(SPECIAL_STUDY_TIPS[lower]);
      }

      if (/\s/.test(lower) && tips.length === 0) {
        tips.push(`词组拆记：${lower.split(/\s+/).join(' + ')}`);
      }

      if (lower.includes('-') && tips.length === 0) {
        tips.push(`合成词：${lower.split('-').join(' + ')}`);
      }

      // 词缀 / 词性转化
      if (!SPECIAL_STUDY_TIPS[lower] && !/\s/.test(lower)) {
        if (lower.endsWith('ied') && (pos === 'adj' || pos === 'v')) {
          tips.push(`变形：${lower.slice(0, -3)}y → ${lower}（y→i+-ed）`);
        } else if (lower.endsWith('ed') && lower.length > 4 && (pos === 'adj' || pos === 'v')) {
          tips.push('词尾 -ed：常表「已经……」或状态形容词');
        } else if (lower.endsWith('ing') && lower.length > 5) {
          tips.push('词尾 -ing：进行式，或「令人……的」形容词');
        } else if (lower.endsWith('ly') && pos === 'adv') {
          tips.push(`副词构成：去/留词干 + -ly → ${lower}`);
        } else if (lower.endsWith('tion') || lower.endsWith('sion')) {
          tips.push('后缀 -tion/-sion：常构成名词，读 /ʃən/');
        } else if (lower.endsWith('ful')) {
          tips.push('后缀 -ful：……的 → 形容词');
        } else if (lower.endsWith('less')) {
          tips.push('后缀 -less：没有……的');
        } else if (lower.endsWith('ness')) {
          tips.push('后缀 -ness：形容词 → 名词');
        } else if (lower.endsWith('ment')) {
          tips.push('后缀 -ment：动词 → 名词');
        } else if ((lower.endsWith('er') || lower.endsWith('or')) && pos === 'n' && lower.length > 4) {
          tips.push('词尾 -er/-or：常表示人或器具');
        } else if (lower.startsWith('un') && lower.length > 4) {
          tips.push('前缀 un-：表示「不 / 未」');
        } else if (lower.startsWith('re') && lower.length > 5 && !['rest', 'read', 'real', 'red'].includes(lower)) {
          tips.push('前缀 re-：常表示「再 / 重新」');
        } else if (lower.endsWith('y') && pos === 'adj' && lower.length > 3) {
          const base = lower.slice(0, -1);
          tips.push(`后缀 -y：${base} + -y → ${lower}（……的）`);
        }
      }

      // 发音规则
      if (tips.length < 2 && !/\s/.test(lower)) {
        if (/ough/.test(lower)) tips.push('发音：ough 组合读音特殊，需单独记');
        else if (lower.endsWith('tion')) tips.push('发音：-tion → /ʃən/');
        else if (/th/.test(lower)) tips.push('发音：th 为咬舌音 /θ/ 或 /ð/');
        else if (/(ee|ea)/.test(lower)) tips.push('发音：ee/ea 常发长音 /i:/');
        else if (/oo/.test(lower)) tips.push('发音：oo 常发 /u:/ 或 /ʊ/');
        else if (/[aeiou][bcdfghjklmnpqrstvwxyz]e$/.test(lower) && lower.length >= 4) {
          tips.push('发音：词尾静音 e，常让前元音发长音');
        } else if (/ck$/.test(lower)) {
          tips.push('拼写：短元音后常用 ck 表 /k/');
        }
      }

      // 词性兜底
      if (tips.length === 0 && posLabel) {
        tips.push(`${posLabel}：抓住词性，对照中文「${word.chinese_meaning || ''}」记忆`);
      }

      // 较长单词拆读兜底
      if (tips.length === 0 && lower.length >= 6) {
        const mid = Math.ceil(lower.length / 2);
        tips.push(`拆读记忆：${lower.slice(0, mid)}-${lower.slice(mid)}`);
      }

      if (tips.length === 0) {
        tips.push(posLabel ? `${posLabel}，直接音形义对照记` : '音形义对照，朗读两遍再写');
      }

      return tips.slice(0, 2).join('；');
    };

    const levenshtein = (a, b) => {
      const m = a.length;
      const n = b.length;
      if (m === 0) return n;
      if (n === 0) return m;
      const dp = Array.from({ length: m + 1 }, () => new Array(n + 1).fill(0));
      for (let i = 0; i <= m; i++) dp[i][0] = i;
      for (let j = 0; j <= n; j++) dp[0][j] = j;
      for (let i = 1; i <= m; i++) {
        for (let j = 1; j <= n; j++) {
          const cost = a[i - 1] === b[j - 1] ? 0 : 1;
          dp[i][j] = Math.min(dp[i - 1][j] + 1, dp[i][j - 1] + 1, dp[i - 1][j - 1] + cost);
        }
      }
      return dp[m][n];
    };

    const getSpellingSimilarity = (targetWord, candidateWord) => {
      const a = (targetWord.english_word || '').toLowerCase().trim();
      const b = (candidateWord.english_word || '').toLowerCase().trim();
      if (!a || !b || a === b) return 0;
      const maxLen = Math.max(a.length, b.length);
      const ratio = 1 - levenshtein(a, b) / maxLen;
      let prefix = 0;
      for (let i = 0; i < Math.min(a.length, b.length); i++) {
        if (a[i] === b[i]) prefix += 1;
        else break;
      }
      const prefixBoost = prefix >= 3 ? 0.12 : (prefix >= 2 && maxLen >= 5 ? 0.08 : 0);
      return Math.min(1, ratio + prefixBoost);
    };

    const isSpellingSimilar = (target, candidate, threshold = 0.5) => (
      getSpellingSimilarity(target, candidate) >= threshold
    );

    const isSamePos = (target, candidate) => {
      const p1 = getWordPos(target);
      const p2 = getWordPos(candidate);
      return Boolean(p1 && p2 && p1 === p2);
    };

    const matchesDistractorRule = (target, candidate, opts = {}) => {
      if (opts.posOnly) return isSamePos(target, candidate);
      if (opts.spellingOnly) {
        return isSpellingSimilar(target, candidate, opts.spellingThreshold ?? 0.3);
      }
      return isSamePos(target, candidate)
        || isSpellingSimilar(target, candidate, opts.spellingThreshold ?? 0.5);
    };

    const scoreDistractor = (target, candidate, opts = {}) => {
      let score = Math.random();
      if (isSamePos(target, candidate)) score += 40;
      if (isSpellingSimilar(target, candidate, opts.spellingThreshold ?? 0.5)) score += 35;
      score += getSpellingSimilarity(target, candidate) * 15;
      return score;
    };

    // 见英选义：干扰项须满足「同词性 / 拼写相似」至少一项，可来自全词库
    const buildRecognitionChoices = (currentWord, allWords, choiceCount = 4) => {
      const correct = normalizeMeaning(currentWord.chinese_meaning);
      const pool = allWords.filter(w =>
        w.id !== currentWord.id &&
        normalizeMeaning(w.chinese_meaning) !== correct &&
        normalizeMeaning(w.chinese_meaning).length > 0
      );

      const need = choiceCount - 1;
      const picked = [];
      const usedIds = new Set();
      const usedMeanings = new Set([correct]);

      const addFromTier = (opts) => {
        const ranked = pool
          .filter(w => !usedIds.has(w.id))
          .filter(w => matchesDistractorRule(currentWord, w, opts))
          .sort((a, b) => scoreDistractor(currentWord, b, opts) - scoreDistractor(currentWord, a, opts));

        for (const w of ranked) {
          const meaning = normalizeMeaning(w.chinese_meaning);
          if (usedMeanings.has(meaning)) continue;
          picked.push(w);
          usedIds.add(w.id);
          usedMeanings.add(meaning);
          if (picked.length >= need) break;
        }
      };

      const tiers = [
        { spellingThreshold: 0.5 },
        { posOnly: true },
        { spellingOnly: true, spellingThreshold: 0.3 },
      ];

      for (const opts of tiers) {
        if (picked.length >= need) break;
        addFromTier(opts);
      }

      return [
        { key: String(currentWord.id), text: correct, isCorrect: true },
        ...picked.map(w => ({
          key: String(w.id),
          text: normalizeMeaning(w.chinese_meaning),
          isCorrect: false,
        })),
      ].sort(() => Math.random() - 0.5);
    };

    const sortGrades = (grades) => (
      [...grades].sort((a, b) => {
        const ia = GRADE_ORDER.indexOf(a);
        const ib = GRADE_ORDER.indexOf(b);
        if (ia === -1 && ib === -1) return a.localeCompare(b, 'zh-CN');
        if (ia === -1) return 1;
        if (ib === -1) return -1;
        return ia - ib;
      })
    );

    const getGradesFromSections = (sectionList) => (
      sortGrades([...new Set(sectionList.map(s => parseSectionMeta(s).grade))])
    );

    const getSectionsForGrade = (sectionList, grade) => (
      sectionList
        .filter(s => parseSectionMeta(s).grade === grade)
        .sort((a, b) => {
          const na = parseInt(a.match(/Unit (\d+)/)?.[1] || '0', 10);
          const nb = parseInt(b.match(/Unit (\d+)/)?.[1] || '0', 10);
          return na - nb;
        })
    );

    const MISTAKE_BOOK_ALL = '⚠️ 错题本';
    const MISTAKE_EXIT_STREAK = 2;

    const getMistakeBookKey = (grade = null) => (
      grade ? `${MISTAKE_BOOK_ALL}·${grade}` : MISTAKE_BOOK_ALL
    );

    const isMistakeBookKey = (key) => (
      key === MISTAKE_BOOK_ALL || key.startsWith(`${MISTAKE_BOOK_ALL}·`)
    );

    const getMistakeBookGradeFromKey = (key) => {
      if (key === MISTAKE_BOOK_ALL) return null;
      if (key.startsWith(`${MISTAKE_BOOK_ALL}·`)) {
        return key.slice(MISTAKE_BOOK_ALL.length + 1);
      }
      return null;
    };

    const isInMistakeBook = (word) => (
      word.source !== 'reading' && (word.incorrectCount || 0) > 0 && !word.mistakeCleared
    );

    const getMistakeLevel = (word) => {
      const n = word.incorrectCount || 0;
      if (n >= 4) {
        return { level: 3, label: '重点', className: 'text-red-700 bg-red-100 border-red-200' };
      }
      if (n >= 2) {
        return { level: 2, label: '需巩固', className: 'text-amber-700 bg-amber-100 border-amber-200' };
      }
      return { level: 1, label: '偶错', className: 'text-orange-700 bg-orange-100 border-orange-200' };
    };

    const getMistakeWords = (wordList, grade = null) => {
      let list = (wordList || []).filter(isInMistakeBook);
      if (grade) {
        list = list.filter(w => parseSectionMeta(w.section).grade === grade);
      }
      return list;
    };

    const countMistakeByLevel = (wordList, grade = null) => {
      const mistakes = getMistakeWords(wordList, grade);
      return {
        total: mistakes.length,
        level1: mistakes.filter(w => getMistakeLevel(w).level === 1).length,
        level2: mistakes.filter(w => getMistakeLevel(w).level === 2).length,
        level3: mistakes.filter(w => getMistakeLevel(w).level === 3).length,
      };
    };

    const normalizeWordStats = (word) => ({
      ...word,
      correctCount: word.correctCount || 0,
      incorrectCount: word.incorrectCount || 0,
      consecutiveCorrect: word.consecutiveCorrect || 0,
      mistakeCleared: word.mistakeCleared || false,
    });

    // 词库曾将四上 Unit 2/3/5/6/7 误标为四下（id 176-278），加载时自动纠正
    const MISPLACED_ID_RANGE = [176, 278];
    const MISPLACED_SECTION_MAP = {
      '四下Unit 2': '四上Unit 2',
      '四下Unit 3': '四上Unit 3',
      '四下Unit 5': '四上Unit 5',
      '四下Unit 6': '四上Unit 6',
      '四下Unit 7': '四上Unit 7',
    };

    const isMisplacedWordId = (id) => {
      const n = parseInt(id, 10);
      return !Number.isNaN(n) && n >= MISPLACED_ID_RANGE[0] && n <= MISPLACED_ID_RANGE[1];
    };

    const migrateMislabeledWords = (wordList) => (
      (wordList || []).map(w => {
        if (isMisplacedWordId(w.id) && MISPLACED_SECTION_MAP[w.section]) {
          return { ...w, section: MISPLACED_SECTION_MAP[w.section] };
        }
        return w;
      })
    );

    const migrateSelectedSections = (sections, wordList) => {
      const list = sections || [];
      const words = wordList || [];
      return list.map(section => {
        if (!MISPLACED_SECTION_MAP[section]) return section;
        const hasMisplaced = words.some(w => w.section === section && isMisplacedWordId(w.id));
        const hasReal = words.some(w => w.section === section && !isMisplacedWordId(w.id));
        if (hasMisplaced && !hasReal) return MISPLACED_SECTION_MAP[section];
        return section;
      });
    };

    // 三下词库原把 Lesson 编号误标为 Unit，按北京版（2024）教材映射为真正 Unit
    const SANXIA_LESSON_TO_UNIT = {
      1: 1, 2: 1, 3: 1, 4: 1,
      5: 2, 6: 2, 7: 2, 8: 2,
      9: 3, 10: 3, 11: 3, 12: 3,
      13: 4, 14: 4,
      15: 5, 16: 5, 17: 5, 18: 5,
      19: 6, 20: 6, 21: 6, 22: 6,
      23: 7, 24: 7, 25: 7, 26: 7,
      27: 8, 28: 8,
    };

    const normalizeSanxiaSection = (section) => {
      const match = section.match(/^三下Unit (\d+)$/);
      if (!match) return section;
      const lesson = parseInt(match[1], 10);
      const unit = SANXIA_LESSON_TO_UNIT[lesson];
      return unit ? `三下Unit ${unit}` : section;
    };

    const migrateSanxiaWords = (wordList) => (
      (wordList || []).map(w => ({
        ...w,
        section: normalizeSanxiaSection(w.section),
      }))
    );

    const migrateSanxiaSelectedSections = (sections) => {
      const mapped = (sections || []).map(normalizeSanxiaSection);
      return [...new Set(mapped)];
    };

    const migrateUserRecord = (user) => {
      if (!user) return user;
      let words = migrateMislabeledWords(user.words);
      words = migrateSanxiaWords(words).map(normalizeWordStats);
      let selectedSections = migrateSelectedSections(user.selectedSections, words);
      selectedSections = migrateSanxiaSelectedSections(selectedSections);
      return {
        ...user,
        words,
        selectedSections,
      };
    };

    const buildPayload = (currentUserId, users) => ({
      version: STORAGE_VERSION,
      currentUserId,
      users,
      savedAt: new Date().toISOString(),
    });

    const isValidAppData = (data) =>
      data && data.version === STORAGE_VERSION && data.users && typeof data.users === 'object';

    const mergeCloudWord = (remote = {}, local = {}) => {
      const remoteUpdatedAt = remote.vocabMasterProgressUpdatedAt || remote.updatedAt || '';
      const localUpdatedAt = local.vocabMasterProgressUpdatedAt || local.updatedAt || '';
      const newest = localUpdatedAt >= remoteUpdatedAt ? local : remote;
      return normalizeWordStats({
        ...remote,
        ...local,
        ...newest,
        correctCount: Math.max(remote.correctCount || 0, local.correctCount || 0),
        incorrectCount: Math.max(remote.incorrectCount || 0, local.incorrectCount || 0),
        consecutiveCorrect: Math.max(remote.consecutiveCorrect || 0, local.consecutiveCorrect || 0),
        mistakeCleared: Boolean(remote.mistakeCleared || local.mistakeCleared),
        flashcardKnown: Boolean(remote.flashcardKnown || local.flashcardKnown),
        vocabMasterProgressUpdatedAt: remoteUpdatedAt >= localUpdatedAt ? remoteUpdatedAt : localUpdatedAt,
      });
    };

    const mergeCloudAppState = (remote = null, local = null) => {
      if (!isValidAppData(remote)) return local;
      if (!isValidAppData(local)) return remote;
      const users = { ...remote.users };
      const remoteUserIdByName = new Map(Object.entries(remote.users).map(([id, user]) => [String(user.name || '').trim().toLowerCase(), id]));
      const localUserIdMap = new Map();
      Object.entries(local.users).forEach(([id, localUser]) => {
        const matchingRemoteId = users[id] ? id : remoteUserIdByName.get(String(localUser.name || '').trim().toLowerCase());
        localUserIdMap.set(id, matchingRemoteId || id);
        const remoteUser = matchingRemoteId ? users[matchingRemoteId] : null;
        if (!remoteUser) { users[id] = localUser; return; }
        const words = new Map((remoteUser.words || []).map(word => [word.id, word]));
        (localUser.words || []).forEach(word => words.set(word.id, mergeCloudWord(words.get(word.id), word)));
        const remoteIsNewer = (remoteUser.updatedAt || '') > (localUser.updatedAt || '');
        users[matchingRemoteId] = {
          ...(remoteIsNewer ? localUser : remoteUser),
          ...(remoteIsNewer ? remoteUser : localUser),
          words: [...words.values()],
          updatedAt: remoteIsNewer ? remoteUser.updatedAt : localUser.updatedAt,
        };
      });
      const remoteIsNewer = (remote.savedAt || '') > (local.savedAt || '');
      return {
        version: STORAGE_VERSION,
        users,
        currentUserId: remoteIsNewer ? remote.currentUserId : (localUserIdMap.get(local.currentUserId) || local.currentUserId),
        savedAt: remoteIsNewer ? remote.savedAt : local.savedAt,
      };
    };

    const loadFromBrowser = () => {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return null;
        const data = JSON.parse(raw);
        return isValidAppData(data) ? data : null;
      } catch {
        return null;
      }
    };

    const saveToBrowser = (payload) => {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(payload));
    };

    const pickNewerData = (a, b) => {
      if (!isValidAppData(a)) return isValidAppData(b) ? b : null;
      if (!isValidAppData(b)) return a;
      const ta = new Date(a.savedAt || 0).getTime();
      const tb = new Date(b.savedAt || 0).getTime();
      return ta >= tb ? a : b;
    };

    const checkServerAvailable = async () => {
      try {
        const res = await fetch('/api/health');
        return res.ok;
      } catch {
        return false;
      }
    };

    const loadFromLocalFile = async () => {
      try {
        const res = await fetch(DATA_API);
        if (!res.ok) return null;
        const data = await res.json();
        return isValidAppData(data) ? data : null;
      } catch {
        return null;
      }
    };

    const saveToLocalFile = async (payload) => {
      const res = await fetch(DATA_API, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload),
      });
      return res.ok;
    };

    const loadAppData = async () => {
      const serverAvailable = await checkServerAvailable();
      const browserData = loadFromBrowser();
      const fileData = serverAvailable ? await loadFromLocalFile() : null;
      const data = pickNewerData(fileData, browserData);

      if (data) {
        const migratedUsers = Object.fromEntries(
          Object.entries(data.users).map(([id, user]) => [id, migrateUserRecord(user)])
        );
        data.users = migratedUsers;
        saveToBrowser(data);
      }

      return {
        data,
        serverAvailable,
        source: data === fileData ? 'file' : data === browserData ? 'browser' : null,
      };
    };

    const persistAppData = async (currentUserId, users, serverAvailable) => {
      const payload = buildPayload(currentUserId, users);
      saveToBrowser(payload);

      if (!serverAvailable) {
        return 'browser';
      }

      try {
        const ok = await saveToLocalFile(payload);
        return ok ? 'file' : 'browser';
      } catch {
        return 'browser';
      }
    };

    const createEmptyUser = (name) => ({
      id: `user_${Date.now()}_${Math.random().toString(36).slice(2, 8)}`,
      name,
      selectedGrade: null,
      selectedSections: [],
      words: [],
      vocabSource: '',
      createdAt: new Date().toISOString(),
      updatedAt: new Date().toISOString(),
    });

    const mergeWordStats = (incomingWords, existingWords) => {
      const statsById = new Map(
        (existingWords || []).map(w => [w.id, {
          correctCount: w.correctCount || 0,
          incorrectCount: w.incorrectCount || 0,
          consecutiveCorrect: w.consecutiveCorrect || 0,
          mistakeCleared: w.mistakeCleared || false,
        }])
      );
      return incomingWords.map(w => {
        const prev = statsById.get(w.id);
        return normalizeWordStats({
          ...w,
          correctCount: prev?.correctCount ?? w.correctCount ?? 0,
          incorrectCount: prev?.incorrectCount ?? w.incorrectCount ?? 0,
          consecutiveCorrect: prev?.consecutiveCorrect ?? w.consecutiveCorrect ?? 0,
          mistakeCleared: prev?.mistakeCleared ?? w.mistakeCleared ?? false,
        });
      });
    };

    const parseData = (text) => {
      const lines = text.split('\n');
      const parsedWords = [];

      lines.forEach(line => {
        let parts = [];

        if (line.includes('|')) {
          parts = line.split('|').map(s => s.trim());
          if (parts[0] === '') parts.shift();
          if (parts[parts.length - 1] === '') parts.pop();
        } else if (line.includes(',')) {
          parts = line.split(',').map(s => s.trim());
        } else {
          return;
        }

        if (parts.length >= 5 && !parts[0].match(/^[-:]+$/) && parts[0].toLowerCase() !== 'id') {
          parsedWords.push(normalizeWordStats({
            id: parts[0],
            section: parts[1],
            english_word: parts[2],
            chinese_meaning: parts[3],
            learning_requirement: parts[4],
            pos: parts[5] || '',
            correctCount: 0,
            incorrectCount: 0,
            consecutiveCorrect: 0,
            mistakeCleared: false,
          }));
        }
      });
      return parsedWords;
    };

    function App() {
      const [appState, setAppState] = useState('import'); // 'import', 'select', 'study', 'flashcards', 'summary', 'print', 'users'
      const [words, setWords] = useState([]);
      const [errorMsg, setErrorMsg] = useState('');
      const [isHydrated, setIsHydrated] = useState(false);
      const [saveStatus, setSaveStatus] = useState(''); // '', 'saving', 'saved-file', 'saved-browser'
      const [serverAvailable, setServerAvailable] = useState(false);
      
      // User State
      const [users, setUsers] = useState({});
      const [currentUserId, setCurrentUserId] = useState(null);
      const [newUserName, setNewUserName] = useState('');
      const [showUserPanel, setShowUserPanel] = useState(false);
      
      // Selection State
      const [sections, setSections] = useState([]);
      const [selectedGrade, setSelectedGrade] = useState(null);
      const [selectedSections, setSelectedSections] = useState([]);
      const [readingInboxEntries, setReadingInboxEntries] = useState([]);
      const [cloudReadingEntries, setCloudReadingEntries] = useState([]);
      const [cloudReadingProgress, setCloudReadingProgress] = useState({});
      const [cloudMasterAppState, setCloudMasterAppState] = useState(null);
      const [cloudMasterStateLoaded, setCloudMasterStateLoaded] = useState(false);
      const [cloudReadingStatus, setCloudReadingStatus] = useState('正在检查阅读器云同步…');
      const [readerCloudUser, setReaderCloudUser] = useState(null);
      const [showReaderLogin, setShowReaderLogin] = useState(false);
      const [readerLoginEmail, setReaderLoginEmail] = useState('');
      const [readerLoginPassword, setReaderLoginPassword] = useState('');
      const [readerLoginError, setReaderLoginError] = useState('');
      const [isReaderLoggingIn, setIsReaderLoggingIn] = useState(false);
      
      // Study State
      const [studyList, setStudyList] = useState([]);
      const [printList, setPrintList] = useState([]); // New state for printing
      const [currentIndex, setCurrentIndex] = useState(0);
      const [userInput, setUserInput] = useState('');
      const [feedback, setFeedback] = useState(null); // 'correct', 'incorrect'
      const [showHint, setShowHint] = useState(false);
      const [recognitionChoices, setRecognitionChoices] = useState([]);
      const [selectedChoiceKey, setSelectedChoiceKey] = useState(null);
      const [flashcardList, setFlashcardList] = useState([]);
      const [flashcardIndex, setFlashcardIndex] = useState(0);
      const [flashcardFlipped, setFlashcardFlipped] = useState(false);
      const [flashcardKnownIds, setFlashcardKnownIds] = useState([]);
      
      // Stats
      // 同一张卡在本次学习中反复尝试，只算作 1 个错词。
      const [sessionStats, setSessionStats] = useState({ correct: 0, incorrect: 0, mistakeWordIds: [] });

      // AI Features State
      const [isAILoading, setIsAILoading] = useState(false);
      const [aiHintText, setAiHintText] = useState('');
      const [aiHintSource, setAiHintSource] = useState(''); // 'ai' | 'local'

      // Lesson example sentences from 课文原文
      const [lessonSentences, setLessonSentences] = useState([]);
      
      // Dictionary / Audio State
      const [currentPhonetic, setCurrentPhonetic] = useState('');
      const [currentAudioUrl, setCurrentAudioUrl] = useState('');

      const inputRef = useRef(null);
      const saveTimerRef = useRef(null);
      const usersRef = useRef({});
      const wordsRef = useRef([]);
      const serverAvailableRef = useRef(false);
      const audioPlayerRef = useRef(null);
      const cloudProgressWriteTimerRef = useRef(null);
      const lastCloudProgressSnapshotRef = useRef('');
      const cloudMasterStateAppliedRef = useRef(false);

      useEffect(() => {
        usersRef.current = users;
      }, [users]);

      useEffect(() => {
        wordsRef.current = words;
      }, [words]);

      useEffect(() => {
        const readInbox = () => {
          try {
            const inbox = JSON.parse(localStorage.getItem(READING_VOCAB_INBOX_KEY) || '{}');
            setReadingInboxEntries(Array.isArray(inbox.entries) ? inbox.entries : []);
          } catch {
            setReadingInboxEntries([]);
          }
        };
        readInbox();
        const onStorage = (event) => {
          if (event.key === READING_VOCAB_INBOX_KEY) readInbox();
        };
        window.addEventListener('storage', onStorage);
        return () => window.removeEventListener('storage', onStorage);
      }, []);

      useEffect(() => {
        let cancelled = false;
        const loadCloudVocabulary = async (session) => {
          if (!session?.user) {
            if (!cancelled) setReaderCloudUser(null);
            if (!cancelled) setCloudMasterStateLoaded(false);
            if (!cancelled) setCloudReadingStatus('登录阅读器账号后，可跨设备导入阅读生词本。');
            return;
          }
          setReaderCloudUser(session.user);
          const { data, error } = await readerSupabase
            .from('reader_sync_state')
            .select('vocabulary, vocab_master_progress')
            .eq('user_id', session.user.id)
            .maybeSingle();
          if (cancelled) return;
          if (error) {
            setCloudReadingStatus(`读取阅读器云端生词失败：${error.message}`);
            return;
          }
          setCloudReadingEntries(Array.isArray(data?.vocabulary) ? data.vocabulary : []);
          const masterState = data?.vocab_master_progress && typeof data.vocab_master_progress === 'object'
            ? data.vocab_master_progress
            : {};
          const progress = masterState.words && typeof masterState.words === 'object'
            ? masterState.words
            : {};
          setCloudReadingProgress(progress);
          setCloudMasterAppState(masterState.appState && isValidAppData(masterState.appState) ? masterState.appState : null);
          setCloudMasterStateLoaded(true);
          lastCloudProgressSnapshotRef.current = JSON.stringify(masterState);
          setCloudReadingStatus(`已连接阅读器云端：${Array.isArray(data?.vocabulary) ? data.vocabulary.length : 0} 个生词。`);
        };
        readerSupabase.auth.getSession().then(({ data }) => loadCloudVocabulary(data.session));
        const { data: { subscription } } = readerSupabase.auth.onAuthStateChange((_event, session) => loadCloudVocabulary(session));
        return () => { cancelled = true; subscription.unsubscribe(); };
      }, []);

      const currentUser = currentUserId ? users[currentUserId] : null;

      useEffect(() => {
        if (!isHydrated || !cloudMasterStateLoaded || cloudMasterStateAppliedRef.current) return;
        const remote = cloudMasterAppState;
        if (remote?.users && typeof remote.users === 'object') {
          const localState = {
            version: STORAGE_VERSION,
            currentUserId,
            users,
            savedAt: new Date(Math.max(0, ...Object.values(users).map(user => new Date(user.updatedAt || 0).getTime() || 0))).toISOString()
          };
          const mergedState = mergeCloudAppState(remote, localState);
          const mergedUsers = Object.fromEntries(Object.entries(mergedState.users).map(([id, user]) => [id, migrateUserRecord(user)]));
          const nextUserId = mergedState.currentUserId && mergedUsers[mergedState.currentUserId]
            ? mergedState.currentUserId
            : Object.keys(mergedUsers)[0] || null;
          const active = nextUserId ? mergedUsers[nextUserId] : null;
          usersRef.current = mergedUsers;
          setUsers(mergedUsers);
          setCurrentUserId(nextUserId);
          if (active?.words?.length) {
            const nextSections = [...new Set(active.words.map(word => word.section))];
            setWords(active.words);
            setSections(nextSections);
            setSelectedGrade(active.selectedGrade || null);
            setSelectedSections(active.selectedSections || []);
            setAppState('select');
          }
        }
        cloudMasterStateAppliedRef.current = true;
      }, [isHydrated, cloudMasterStateLoaded, cloudMasterAppState]);
      const pendingReadingEntries = useMemo(() => {
        const byWord = new Map();
        [...readingInboxEntries, ...cloudReadingEntries].forEach(entry => {
          const word = String(entry?.word || '').trim();
          if (word) byWord.set(word.toLowerCase(), { ...entry, word });
        });
        const importedById = new Map(words.filter(word => word.source === 'reading').map(word => [word.id, word]));
        return [...byWord.values()].filter(entry => {
          const imported = importedById.get(`reading:${entry.word.toLowerCase()}`);
          if (!imported) return true;
          const cloudProgress = cloudReadingProgress[entry.word.toLowerCase()];
          return ['pronunciation', 'etymology', 'exampleSentence', 'sourceContext', 'sourceArticleTitle']
            .some(field => !imported[field] && entry[field])
            || !imported.vocabMasterProgressUpdatedAt
            || (cloudProgress?.updatedAt && cloudProgress.updatedAt > (imported.vocabMasterProgressUpdatedAt || ''));
        });
      }, [readingInboxEntries, cloudReadingEntries, cloudReadingProgress, words]);

      const applyWordsToState = (parsedWords, sourceLabel = '', nextSelectedSections = null, nextSelectedGrade = null, keepAppState = false) => {
        const uniqueSections = [...new Set(parsedWords.map(w => w.section))];
        const grades = getGradesFromSections(uniqueSections);
        setWords(parsedWords);
        setSections(uniqueSections);
        const sectionsToUse = nextSelectedSections ?? selectedSections.filter(s => isMistakeBookKey(s) || uniqueSections.includes(s));
        setSelectedSections(sectionsToUse);
        const gradeCandidate = nextSelectedGrade ?? selectedGrade;
        const gradeToUse = gradeCandidate && grades.includes(gradeCandidate) ? gradeCandidate : null;
        setSelectedGrade(gradeToUse);
        if (!keepAppState) {
          setAppState(parsedWords.length > 0 ? 'select' : 'import');
        }
        if (currentUserId) {
          setUsers(prev => ({
            ...prev,
            [currentUserId]: {
              ...prev[currentUserId],
              words: parsedWords,
              selectedGrade: gradeToUse,
              selectedSections: sectionsToUse,
              vocabSource: sourceLabel || prev[currentUserId]?.vocabSource || '',
              updatedAt: new Date().toISOString(),
            },
          }));
        }
      };

      const importReadingInbox = () => {
        if (!currentUserId) {
          setErrorMsg('请先创建或选择一个用户，再导入阅读生词本。');
          return;
        }
        const imported = pendingReadingEntries
          .filter(entry => typeof entry?.word === 'string' && entry.word.trim())
          .map(entry => {
            const englishWord = entry.word.trim();
            const progress = cloudReadingProgress[englishWord.toLowerCase()] || {};
            return normalizeWordStats({
              id: `reading:${englishWord.toLowerCase()}`,
              section: READING_VOCAB_SECTION,
              english_word: englishWord,
              chinese_meaning: entry.meaning || '暂无释义',
              learning_requirement: '见到英文，能选出中文意思',
              pos: '',
              source: 'reading',
              pronunciation: entry.pronunciation || '',
              etymology: entry.etymology || '',
              exampleSentence: entry.exampleSentence || '',
              sourceContext: entry.sourceContext || '',
              sourceArticleId: entry.sourceArticleId || null,
              sourceArticleTitle: entry.sourceArticleTitle || '',
              importedAt: new Date().toISOString(),
              correctCount: progress.correctCount || 0,
              incorrectCount: progress.incorrectCount || 0,
              consecutiveCorrect: progress.consecutiveCorrect || 0,
              mistakeCleared: Boolean(progress.mistakeCleared),
              flashcardKnown: Boolean(progress.flashcardKnown),
              vocabMasterProgressUpdatedAt: progress.updatedAt || new Date().toISOString(),
            });
          });
        if (imported.length === 0) {
          setErrorMsg('阅读生词本收件箱没有可导入的单词。');
          return;
        }
        const merged = mergeWordStats([...words, ...imported], words);
        const deduped = Array.from(new Map(merged.map(word => [word.id, word])).values());
        const incomingById = new Map(imported.map(word => [word.id, word]));
        const refreshed = deduped.map(word => {
          const incoming = incomingById.get(word.id);
          return incoming && incoming.vocabMasterProgressUpdatedAt > (word.vocabMasterProgressUpdatedAt || '')
            ? { ...word, ...incoming }
            : word;
        });
        applyWordsToState(
          refreshed,
          '阅读器生词本',
          Array.from(new Set([...selectedSections, READING_VOCAB_SECTION]))
        );
        localStorage.removeItem(READING_VOCAB_INBOX_KEY);
        setReadingInboxEntries([]);
        setErrorMsg('');
      };

      // A connected learner should never need to manually carry reader words
      // between the two apps. The visible import button remains as a fallback.
      useEffect(() => {
        if (!readerCloudUser || !currentUserId || pendingReadingEntries.length === 0) return;
        importReadingInbox();
      }, [readerCloudUser, currentUserId, pendingReadingEntries.length]);

      useEffect(() => {
        if (!readerCloudUser || !cloudMasterStateLoaded || !cloudMasterStateAppliedRef.current) return;
        const readingWords = words.filter(word => word.source === 'reading');
        if (readingWords.length === 0) return;
        const now = new Date().toISOString();
        const progress = Object.fromEntries(readingWords.map(word => [word.english_word.toLowerCase(), {
          correctCount: word.correctCount || 0,
          incorrectCount: word.incorrectCount || 0,
          consecutiveCorrect: word.consecutiveCorrect || 0,
          mistakeCleared: Boolean(word.mistakeCleared),
          flashcardKnown: Boolean(word.flashcardKnown),
          updatedAt: word.vocabMasterProgressUpdatedAt || now
        }]));
        const savedAt = new Date(Math.max(0, ...Object.values(users).map(user => new Date(user.updatedAt || 0).getTime() || 0))).toISOString();
        const masterState = {
          version: 2,
          words: progress,
          appState: { version: STORAGE_VERSION, currentUserId, users, savedAt }
        };
        const snapshot = JSON.stringify(masterState);
        if (snapshot === lastCloudProgressSnapshotRef.current) return;
        if (cloudProgressWriteTimerRef.current) clearTimeout(cloudProgressWriteTimerRef.current);
        cloudProgressWriteTimerRef.current = setTimeout(async () => {
          const { data: latestCloud } = await readerSupabase
            .from('reader_sync_state')
            .select('vocab_master_progress')
            .eq('user_id', readerCloudUser.id)
            .maybeSingle();
          const remoteMasterState = latestCloud?.vocab_master_progress && typeof latestCloud.vocab_master_progress === 'object'
            ? latestCloud.vocab_master_progress
            : {};
          const mergedProgress = { ...(remoteMasterState.words || {}) };
          Object.entries(progress).forEach(([word, localProgress]) => {
            const remoteProgress = mergedProgress[word] || {};
            mergedProgress[word] = {
              ...remoteProgress,
              ...localProgress,
              correctCount: Math.max(remoteProgress.correctCount || 0, localProgress.correctCount || 0),
              incorrectCount: Math.max(remoteProgress.incorrectCount || 0, localProgress.incorrectCount || 0),
              consecutiveCorrect: Math.max(remoteProgress.consecutiveCorrect || 0, localProgress.consecutiveCorrect || 0),
              mistakeCleared: Boolean(remoteProgress.mistakeCleared || localProgress.mistakeCleared),
              flashcardKnown: Boolean(remoteProgress.flashcardKnown || localProgress.flashcardKnown),
              updatedAt: (remoteProgress.updatedAt || '') > (localProgress.updatedAt || '') ? remoteProgress.updatedAt : localProgress.updatedAt,
            };
          });
          const mergedMasterState = {
            version: 2,
            words: mergedProgress,
            appState: mergeCloudAppState(remoteMasterState.appState, masterState.appState)
          };
          const mergedSnapshot = JSON.stringify(mergedMasterState);
          const { error } = await readerSupabase.from('reader_sync_state').upsert({
            user_id: readerCloudUser.id,
            vocab_master_progress: mergedMasterState,
            updated_at: new Date().toISOString()
          }, { onConflict: 'user_id' });
          if (!error) lastCloudProgressSnapshotRef.current = mergedSnapshot;
        }, 600);
        return () => { if (cloudProgressWriteTimerRef.current) clearTimeout(cloudProgressWriteTimerRef.current); };
      }, [words, users, currentUserId, readerCloudUser, cloudMasterStateLoaded]);

      const handleReaderCloudLogin = async (event) => {

      const switchUser = (userId) => {

      const deleteUser = (userId) => {
        if (!users[userId] && !usersRef.current[userId]) return;
        const remainingIds = Object.keys(usersRef.current).filter(id => id !== userId);
        if (remainingIds.length === 0) {

      // Restore from local JSON file (preferred) or browser cache
      useEffect(() => {
        let cancelled = false;

        (async () => {
          const { data: stored, serverAvailable: serverOk } = await loadAppData();
          if (cancelled) return;

          serverAvailableRef.current = serverOk;
          setServerAvailable(serverOk);

          if (stored && Object.keys(stored.users).length > 0) {
            usersRef.current = stored.users;
            setUsers(stored.users);
            const uid = stored.currentUserId && stored.users[stored.currentUserId]
              ? stored.currentUserId

            setCurrentUserId(uid);
            const user = stored.users[uid];
            if (user.words?.length > 0) {
              const uniqueSections = [...new Set(user.words.map(w => w.section))];
              const grades = getGradesFromSections(uniqueSections);

      // Auto-save to local JSON file + browser cache (debounced)
      useEffect(() => {
        if (!isHydrated || !currentUserId) return;

        setSaveStatus('saving');
        if (saveTimerRef.current) clearTimeout(saveTimerRef.current);

        saveTimerRef.current = setTimeout(async () => {
          const baseUsers = usersRef.current;
          if (!baseUsers[currentUserId]) return;

          const updatedUsers = {
            ...baseUsers,
            [currentUserId]: {
              ...baseUsers[currentUserId],

              selectedGrade,

              updatedAt: new Date().toISOString(),
            },
          };
          usersRef.current = updatedUsers;
          setUsers(updatedUsers);

          const mode = await persistAppData(currentUserId, updatedUsers, serverAvailableRef.current);
          setSaveStatus(mode === 'file' ? 'saved-file' : 'saved-browser');
          setTimeout(() => setSaveStatus(''), 2500);
        }, 400);

        return () => {
          if (saveTimerRef.current) clearTimeout(saveTimerRef.current);
        };
      }, [words, selectedGrade, selectedSections, currentUserId, isHydrated]);

      // Load bundled 词库.md: initial import, or merge newly added words for existing users
      useEffect(() => {
        if (!isHydrated || !currentUserId) return;
        fetch('./词库.md')
          .then(res => (res.ok ? res.text() : null))
          .then(text => {
            if (!text) return;
            const parsed = parseData(text);
            if (parsed.length === 0) return;
            const existing = currentUserId ? usersRef.current[currentUserId]?.words || [] : words;
            const existingById = new Map((existing || []).map(w => [w.id, w]));
            const hasNewWords = parsed.some(w => !existingById.has(w.id));
            const hasUpdatedMeta = parsed.some(w => {
              const prev = existingById.get(w.id);
              return prev && (
                prev.learning_requirement !== w.learning_requirement ||
                prev.chinese_meaning !== w.chinese_meaning ||
                prev.section !== w.section ||
                (prev.pos || '') !== (w.pos || '')
              );

            if (existing.length === 0 || hasNewWords || hasUpdatedMeta) {
              const merged = mergeWordStats(parsed, existing);
              const savedSections = currentUserId ? usersRef.current[currentUserId]?.selectedSections || [] : [];
              const savedGrade = currentUserId ? usersRef.current[currentUserId]?.selectedGrade || null : null;
              applyWordsToState(merged, '词库.md', savedSections, savedGrade, existing.length > 0);
            }
          })
          .catch(() => {});
      }, [isHydrated, currentUserId]);

      // Load 课文原文 for example sentences after answering
      useEffect(() => {
        let cancelled = false;
        const loadLessonText = async () => {
          for (const path of LESSON_TEXT_FILES) {
            try {
              const res = await fetch(path);
              if (!res.ok) continue;
              const text = await res.text();
              const parsed = parseLessonText(text);
              if (!cancelled && parsed.length > 0) {
                setLessonSentences(parsed);

            } catch {

          }

        loadLessonText();

      }, []);

      // Load voices for TTS fallback
      useEffect(() => {

      // Focus input when moving to a new word (spelling mode only)
      useEffect(() => {
        const currentWord = studyList[currentIndex];
        if (appState === 'study' && inputRef.current && !showHint && feedback !== 'correct' && currentWord && !isRecognitionWord(currentWord)) {
          inputRef.current.focus();
        }
      }, [currentIndex, appState, feedback, showHint, studyList]);

      // Enter →「下一个」：答对 / 看提示 / 认词答错后可回车跳转
      useEffect(() => {
        if (appState !== 'study') return;

        const onKeyDown = (e) => {

          const currentWord = studyList[currentIndex];
          if (!currentWord) return;

          const canGoNext = showHint
            || feedback === 'correct'
            || (recognitionMode && feedback === 'incorrect');

          e.preventDefault();

        window.addEventListener('keydown', onKeyDown);
        return () => window.removeEventListener('keydown', onKeyDown);

      // 闪卡：空格翻面，左右方向键切换；不改变答题记录
      useEffect(() => {
        if (appState !== 'flashcards') return;
