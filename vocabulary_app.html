        readerSupabase.auth.getSession().then(({ data }) => loadCloudVocabulary(data.session));
        const { data: { subscription } } = readerSupabase.auth.onAuthStateChange((_event, session) => loadCloudVocabulary(session));
        return () => { cancelled = true; subscription.unsubscribe(); };
      }, []);

      const currentUser = currentUserId ? users[currentUserId] : null;
      const ignoredReadingWordIds = useMemo(() => new Set(currentUser?.ignoredReadingWordIds || []), [currentUser]);

      useEffect(() => {
        if (!isHydrated || !cloudMasterStateLoaded || cloudMasterStateAppliedRef.current) return;
        const remote = cloudMasterAppState;
        const localState = {
          version: STORAGE_VERSION,
          currentUserId,
          users,
          savedAt: new Date(Math.max(0, ...Object.values(users).map(user => new Date(user.updatedAt || 0).getTime() || 0))).toISOString()
        };
        // 强制同步只触发重新读取；仍须保留本机独有的答题事件和累计进度。
        let mergedState;
        try {
          const accountId = readerCloudUser?.id;
          const archived = localStorage.getItem(`vocabmaster_account_archive_v3:${accountId}`);
          if (archived && !localState.users[`reader_${accountId}`]) localState.users[`reader_${accountId}`] = JSON.parse(archived);
          const localAccount = collapseToReaderAccount(localState, readerCloudUser);
          const accountUser = localAccount?.users?.[`reader_${accountId}`];
          // Upgrade existing answer history into the durable queue; the server deduplicates known IDs.
          const foreignAccount = Object.keys(localState.users || {}).some(id => id.startsWith('reader_') && id !== `reader_${accountId}`);
          if (accountId && !foreignAccount) {
            const box = readLearningOutbox(accountId);
            writeLearningOutbox(accountId, { ...box, events: mergeStudyEvents(box.events, accountUser?.studyEvents || []) });
          }
          const base = isValidAppData(remote) ? reconcileLearningState(remote, localAccount, accountId) : localAccount;
          mergedState = accountId && isValidAppData(remote)
            ? replayPendingLearningEvents(base, accountId, readLearningOutbox(accountId).events)
            : base;
        } catch (error) {
          void reportLearningSyncHealth({ accountId: readerCloudUser?.id, rpc: readerSupabase.rpc.bind(readerSupabase), healthy: false, error });
          setCloudReadingStatus(`学习档案加载失败：${error.message}；本机原始记录已保留。`);
          return;
        }
        const mergedUsers = Object.fromEntries(Object.entries(mergedState.users).map(([id, user]) => [id, migrateUserRecord(user)]));
        const nextUserId = mergedState.currentUserId && mergedUsers[mergedState.currentUserId]
          ? mergedState.currentUserId
          : Object.keys(mergedUsers)[0] || null;
        const active = nextUserId ? mergedUsers[nextUserId] : null;
        usersRef.current = mergedUsers;
        setUsers(mergedUsers);
        setCurrentUserId(nextUserId);
        if (active?.words?.length) {
          const nextSections = [...new Set(active.words.map(word => word.section))];
          setWords(active.words);
          setStudyEvents(normalizeStudyEvents(active.studyEvents));
          setSections(nextSections);
          setSelectedGrade(active.selectedGrade || null);
          setSelectedSections(active.selectedSections || []);
          setAppState('select');
        }
        cloudMasterStateAppliedRef.current = true;
      }, [isHydrated, cloudMasterStateLoaded, cloudMasterAppState, readerCloudUser]);
      const pendingReadingEntries = useMemo(() => {
        const byWord = new Map();
        [...readingInboxEntries, ...cloudReadingEntries].forEach(entry => {
          const word = String(entry?.word || '').trim();
          if (word && !ignoredReadingWordIds.has(`reading:${word.toLowerCase()}`)) {
            byWord.set(word.toLowerCase(), { ...entry, word });
          }
        });
        const importedById = new Map(words.filter(word => word.source === 'reading').map(word => [word.id, word]));
        return [...byWord.values()].filter(entry => {
          const imported = importedById.get(`reading:${entry.word.toLowerCase()}`);
          if (!imported) return true;
          const cloudProgress = cloudReadingProgress[entry.word.toLowerCase()];
          return ['pronunciation', 'etymology', 'exampleSentence', 'sourceContext', 'sourceArticleTitle']
            .some(field => !imported[field] && entry[field])
            || !imported.vocabMasterProgressUpdatedAt
            || (cloudProgress?.updatedAt && cloudProgress.updatedAt > (imported.vocabMasterProgressUpdatedAt || ''));
        });
      }, [readingInboxEntries, cloudReadingEntries, cloudReadingProgress, words, ignoredReadingWordIds]);

      const applyWordsToState = (parsedWords, sourceLabel = '', nextSelectedSections = null, nextSelectedGrade = null, keepAppState = false) => {
        parsedWords = splitAlternativeWords(parsedWords);
        const uniqueSections = [...new Set(parsedWords.map(w => w.section))];
        const grades = getGradesFromSections(uniqueSections);
        setWords(parsedWords);
        setSections(uniqueSections);
        const sectionsToUse = (nextSelectedSections ?? selectedSections.filter(s => isMistakeBookKey(s) || uniqueSections.includes(s)))
          .filter(section => isMistakeBookKey(section) || !isHiddenGrade(parseSectionMeta(section).grade));
        setSelectedSections(sectionsToUse);
        const gradeCandidate = nextSelectedGrade ?? selectedGrade;
        const gradeToUse = gradeCandidate && grades.includes(gradeCandidate) ? gradeCandidate : null;
        setSelectedGrade(gradeToUse);
        if (!keepAppState) {
          setAppState(parsedWords.length > 0 ? 'select' : 'import');
        }
        if (currentUserId) {
          setUsers(prev => ({
            ...prev,
            [currentUserId]: {
              ...prev[currentUserId],
              words: parsedWords,
              selectedGrade: gradeToUse,
              selectedSections: sectionsToUse,
              vocabSource: sourceLabel || prev[currentUserId]?.vocabSource || '',
              updatedAt: new Date().toISOString(),
            },
          }));
        }
      };

      // 允许从一次性链接批量加入错题本：仅更新当前阅读器账号的现有词条，
      // 随后的自动同步会写回 Supabase。处理完成后移除参数，避免重复导入。
      useEffect(() => {
        if (!isHydrated || !currentUserId) return;
        const params = new URLSearchParams(window.location.search);
        const rawWords = params.get('pdfMistakes');
        if (!rawWords) return;
        const targets = new Set(rawWords.split(',').map(word => word.trim().toLowerCase()).filter(Boolean));
        if (targets.size === 0) return;
        let imported = 0;
        const updatedWords = words.map(word => {
          if (!targets.has(String(word.english_word || '').trim().toLowerCase())) return word;
          imported += 1;
          return word;
        });
        if (imported > 0) {
          const mistakeKey = getMistakeBookKey('四上');
          applyWordsToState(updatedWords, '', [...new Set([...selectedSections, mistakeKey])], selectedGrade, true);
          localStorage.setItem(`vocabmaster_pdf_mistakes_${Date.now()}`, JSON.stringify([...targets]));
          setErrorMsg(`PDF 的 ${imported} 个匹配词已单独留档；没有逐次答题记录，不能作为新错题同步，请实际练习或核实恢复。`);
        } else {
          setErrorMsg('PDF 中的单词未在当前词库中找到。');
        }
        params.delete('pdfMistakes');
        const query = params.toString();
        window.history.replaceState({}, '', `${window.location.pathname}${query ? `?${query}` : ''}${window.location.hash}`);
      }, [isHydrated, currentUserId]);

      const parseAIReadingFilter = (rawText, entries, preliminaryByWord) => {
        let parsed = null;
        try {
          const json = String(rawText || '').replace(/^```(?:json)?\s*/i, '').replace(/\s*```$/, '');
          parsed = JSON.parse(json);
        } catch {
          // A malformed AI response must never silently discard a learner's words.
        }
        const verdicts = new Map((parsed?.items || []).map(item => [normalizeReadingWord(item.word), item]));
        return entries.map(entry => {
          const word = String(entry.word || '').trim();
          const preliminary = preliminaryByWord.get(normalizeReadingWord(word));
          const verdict = verdicts.get(normalizeReadingWord(word));
          const keep = typeof verdict?.keep === 'boolean' ? verdict.keep : !preliminary;
          return {
            ...entry,
            word,
            keep,
            reason: String(verdict?.reason || preliminary || (keep ? '常用、适合当前阅读' : '暂不建议纳入')).slice(0, 80),
          };
        });
      };

      const buildReadingFilterPrompt = (entries, preliminaryByWord) => `你是小学英语词汇编辑。为四年级学生审核阅读生词，目标是保留“见英文选中文”值得练习的高频、能帮助理解近期阅读的词。\n\n请排除：过于难或生僻的词、专有名词、明显重复词、同一词的复数/时态/ing 等词形（应保留最基础词形）。不要因为词较长就排除常用词。\n\n只返回严格 JSON，不要 Markdown：{"items":[{"word":"原词","keep":true,"reason":"不超过12字中文理由"}]}。每个输入词必须出现一次。\n\n待审核：${entries.map(entry => {
        const word = String(entry.word || '').trim();
        const meaning = String(entry.meaning || '').trim();
        const preliminary = preliminaryByWord.get(normalizeReadingWord(word));
        return `- ${word}${meaning ? `：${meaning}` : ''}${preliminary ? `（规则提示：${preliminary}）` : ''}`;
      }).join('\n')}`;

      const reviewReadingInbox = async () => {
        if (!pendingReadingEntries.length) return;
        setIsReadingFilterLoading(true);
        setReadingFilterError('');
        try {
          const existingWords = words.filter(word => word.source === 'reading').map(word => word.english_word);
          const seenWords = new Set(existingWords.map(normalizeReadingWord));
          const seenStems = new Map(existingWords.map(word => [getReadingVariantStem(word), word]));
          const preliminaryByWord = new Map();
          pendingReadingEntries.forEach(entry => {
            const key = normalizeReadingWord(entry.word);
            const stem = getReadingVariantStem(entry.word);
            if (seenWords.has(key)) preliminaryByWord.set(key, '已在学习列表，更新资料即可');
            else if (seenStems.has(stem)) preliminaryByWord.set(key, `可能是 ${seenStems.get(stem)} 的词形`);
            else {
              seenWords.add(key);
              seenStems.set(stem, entry.word);
            }
          });

          const batches = [];
          for (let index = 0; index < pendingReadingEntries.length; index += READING_FILTER_BATCH_SIZE) {
            batches.push(pendingReadingEntries.slice(index, index + READING_FILTER_BATCH_SIZE));
          }
          const reviewed = [];
          for (const batch of batches) {
            const prompt = buildReadingFilterPrompt(batch, preliminaryByWord);
            let text = null;
            if (readerAiKey && readerAiPreferences?.cloudBaseUrl && readerAiPreferences?.cloudModel) {
              text = await fetchAIHintFromReaderConfig(prompt, 1000);
            } else if (serverAvailableRef.current) {
              const res = await fetch('/api/ai-filter-reading', {
                method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ prompt })
              });
              if (res.ok) text = (await res.json()).text?.trim() || null;
            }
            reviewed.push(...parseAIReadingFilter(text, batch, preliminaryByWord));
          }
          setReadingImportReview(reviewed);
          if (!readerAiKey && !serverAvailableRef.current) {
            setReadingFilterError('未连接 AI，已使用重复词和词形的保守预筛；可连接阅读器账号后重新筛选。');
          }
        } catch (error) {
          setReadingFilterError(`AI 筛选暂不可用：${error.message || '请稍后重试'}；未删除任何词。`);
        } finally {
          setIsReadingFilterLoading(false);
        }
      };

      const openReadingImportConfirmation = () => {
        if (!pendingReadingEntries.length) return;
        setReadingImportSelectedKeys([]);
        setReadingFilterError('');
        setReadingImportReview(pendingReadingEntries.map(entry => ({
          ...entry,
          word: String(entry.word || '').trim(),
          keep: false,
          reason: '待教师确认',
        })));
      };

      const reviewExistingReadingWords = async () => {
        const readingWords = words.filter(word => word.source === 'reading');
        if (!readingWords.length) return;
        setIsExistingReadingFilterLoading(true);
        setReadingFilterError('');
        try {
          const entries = readingWords.map(word => ({ id: word.id, word: word.english_word, meaning: word.chinese_meaning }));
          const seenWords = new Set();
          const seenStems = new Map();
          const preliminaryByWord = new Map();
          entries.forEach(entry => {
            const key = normalizeReadingWord(entry.word);
            const stem = getReadingVariantStem(entry.word);
            if (seenWords.has(key)) preliminaryByWord.set(key, '重复词');
            else if (seenStems.has(stem)) preliminaryByWord.set(key, `可能是 ${seenStems.get(stem)} 的词形`);
            else {
              seenWords.add(key);
              seenStems.set(stem, entry.word);
            }
          });
          const reviewed = [];
          for (let index = 0; index < entries.length; index += READING_FILTER_BATCH_SIZE) {
            const batch = entries.slice(index, index + READING_FILTER_BATCH_SIZE);
            const prompt = buildReadingFilterPrompt(batch, preliminaryByWord);
            let text = null;
            if (readerAiKey && readerAiPreferences?.cloudBaseUrl && readerAiPreferences?.cloudModel) {
              text = await fetchAIHintFromReaderConfig(prompt, 1000);
            } else if (serverAvailableRef.current) {
              const res = await fetch('/api/ai-filter-reading', {
                method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ prompt })
              });
              if (res.ok) text = (await res.json()).text?.trim() || null;
            }
            reviewed.push(...parseAIReadingFilter(text, batch, preliminaryByWord));
          }
          setReadingExistingReview(reviewed);
          if (!readerAiKey && !serverAvailableRef.current) {
            setReadingFilterError('未连接 AI，已使用重复词和词形的保守预筛；没有删除任何词。');
          }
        } catch (error) {
          setReadingFilterError(`AI 批量整理暂不可用：${error.message || '请稍后重试'}；未修改任何词。`);
        } finally {
          setIsExistingReadingFilterLoading(false);
        }
      };

      const applyExistingReadingReview = () => {
        if (!readingExistingReview?.length) return;
        const verdicts = new Map(readingExistingReview.map(entry => [entry.id, entry]));
        const deferredCount = readingExistingReview.filter(entry => !entry.keep).length;
        setWords(previous => previous.map(word => {
          const verdict = verdicts.get(word.id);
          return verdict ? {
            ...word,
            readingDeferred: !verdict.keep,
            readingReviewReason: verdict.reason,
            readingReviewedAt: new Date().toISOString(),
          } : word;
        }));
        setReadingExistingReview(null);
        setReadingFilters(previous => ({ ...previous, group: '', level: '' }));
        setErrorMsg(`已批量整理：${deferredCount} 个词暂缓学习；它们仍保留在词本中，随时可恢复。`);
      };

      const importReadingInbox = (entries = pendingReadingEntries) => {
        if (!currentUserId) {
          setErrorMsg('请先创建或选择一个用户，再导入阅读生词本。');
          return;
        }
        const imported = entries
          .filter(entry => typeof entry?.word === 'string' && entry.word.trim())
          .map(entry => {
            const englishWord = entry.word.trim();
            const progress = cloudReadingProgress[englishWord.toLowerCase()] || {};
            return normalizeWordStats({
              id: `reading:${englishWord.toLowerCase()}`,
              section: READING_VOCAB_SECTION,
              english_word: englishWord,
              chinese_meaning: entry.meaning || '暂无释义',
              learning_requirement: '见到英文，能选出中文意思',
              pos: '',
              source: 'reading',
              pronunciation: entry.pronunciation || '',
              etymology: entry.etymology || '',
              exampleSentence: entry.exampleSentence || '',
              sourceContext: entry.sourceContext || '',
              sourceArticleId: entry.sourceArticleId || null,
              sourceArticleTitle: entry.sourceArticleTitle || '',
              sourceArticleDate: entry.sourceArticleDate || entry.date || entry.addedAt || entry.createdAt || '',
              importedAt: new Date().toISOString(),
              correctCount: progress.correctCount || 0,
              incorrectCount: progress.incorrectCount || 0,
              consecutiveCorrect: progress.consecutiveCorrect || 0,
              mistakeCleared: Boolean(progress.mistakeCleared),
              flashcardKnown: Boolean(progress.flashcardKnown),
              readingIntroducedAt: progress.readingIntroducedAt || '',
              readingNextDueAt: progress.readingNextDueAt || '',
              readingMasteredAt: progress.readingMasteredAt || '',
              readingReviewStage: progress.readingReviewStage || 0,
              vocabMasterProgressUpdatedAt: progress.updatedAt || new Date().toISOString(),
            });
          });
        if (imported.length === 0) {
          setErrorMsg('阅读生词本收件箱没有可导入的单词。');
          return;
        }
        const merged = mergeWordStats([...words, ...imported], words);
        const deduped = Array.from(new Map(merged.map(word => [word.id, word])).values());
        const incomingById = new Map(imported.map(word => [word.id, word]));
        const refreshed = deduped.map(word => {
          const incoming = incomingById.get(word.id);
          return incoming && incoming.vocabMasterProgressUpdatedAt > (word.vocabMasterProgressUpdatedAt || '')
            ? { ...word, ...incoming }
            : word;
        });
        applyWordsToState(
          refreshed,
          '阅读器生词本',
          selectedSections.filter(section => section !== READING_VOCAB_SECTION)
        );
        const importedKeys = new Set(imported.map(word => word.english_word.toLowerCase()));
        setReadingInboxEntries(previous => {
          const remaining = previous.filter(entry => !importedKeys.has(String(entry?.word || '').trim().toLowerCase()));
          if (remaining.length) localStorage.setItem(READING_VOCAB_INBOX_KEY, JSON.stringify({ entries: remaining }));
          else localStorage.removeItem(READING_VOCAB_INBOX_KEY);
          return remaining;
        });
        setReadingImportReview(null);
        setReadingImportSelectedKeys([]);
        setReadingFilterError('');
        setErrorMsg('');
      };

      useEffect(() => {
        if (!readerCloudUser || !cloudMasterStateLoaded || !cloudMasterStateAppliedRef.current || currentUserId !== `reader_${readerCloudUser.id}`) return;
        const readingWords = words.filter(word => word.source === 'reading');
        // 学习档案（含每日学习事件）不依赖阅读生词本；登录同一账号的所有设备都应同步它。
        const now = new Date().toISOString();
        const progress = Object.fromEntries(readingWords.map(word => [word.english_word.toLowerCase(), {
          correctCount: word.correctCount || 0,
          incorrectCount: word.incorrectCount || 0,
          consecutiveCorrect: word.consecutiveCorrect || 0,
          mistakeCleared: Boolean(word.mistakeCleared),
          flashcardKnown: Boolean(word.flashcardKnown),
          readingIntroducedAt: word.readingIntroducedAt || '',
          readingNextDueAt: word.readingNextDueAt || '',
          readingMasteredAt: word.readingMasteredAt || '',
          readingReviewStage: word.readingReviewStage || 0,
          updatedAt: word.vocabMasterProgressUpdatedAt || ''
        }]));
        const savedAt = new Date(Math.max(0, ...Object.values(users).map(user => new Date(user.updatedAt || 0).getTime() || 0))).toISOString();
        const appState = collapseToReaderAccount({ version: STORAGE_VERSION, currentUserId, users, savedAt }, readerCloudUser);
        const masterState = {
          version: 3,
          words: progress,
          appState
        };
        const snapshot = learningSnapshotKey(masterState);
        try {
          if (snapshot === lastCloudProgressSnapshotRef.current && readLearningOutbox(readerCloudUser.id).events.length === 0) return;
        } catch (error) {
          void reportLearningSyncHealth({ accountId: readerCloudUser.id, rpc: readerSupabase.rpc.bind(readerSupabase), healthy: false, error: { syncHealthCode: 'storage_failed' } });
          setCloudReadingStatus('待同步答题备份无法读取，请保留现有备份。');
          return;
        }
        if (cloudProgressWriteTimerRef.current) clearTimeout(cloudProgressWriteTimerRef.current);
        cloudProgressWriteTimerRef.current = setTimeout(async () => {
          if (syncInFlightRef.current) return;
          const accountId = readerCloudUser.id;
          if (syncAccountRef.current !== accountId) return;
          syncInFlightRef.current = true;
          try {
            const pending = readLearningOutbox(accountId).events.length;
            setCloudReadingStatus(`正在同步学习档案，${pending} 条答题等待云端确认…`);
            const result = await syncLearningOutbox({
              accountId, master: masterState, rpc: readerSupabase.rpc.bind(readerSupabase),
              isCurrentAccount: () => syncAccountRef.current === accountId,
            });
            if (!result) return;
            const authoritative = replayPendingLearningEvents(reconcileLearningState(result.appState, { users: usersRef.current }, accountId), accountId, readLearningOutbox(accountId).events);
            if (learningSnapshotKey(usersRef.current) !== learningSnapshotKey(authoritative.users)) {
              usersRef.current = authoritative.users;
              setUsers(authoritative.users);
            }
            const active = authoritative.users[authoritative.currentUserId];
            if (active) {
              if (learningSnapshotKey(wordsRef.current) !== learningSnapshotKey(active.words)) {
                wordsRef.current = active.words;
                setWords(active.words);
              }
              setStudyEvents(previous => learningSnapshotKey(previous) === learningSnapshotKey(active.studyEvents) ? previous : normalizeStudyEvents(active.studyEvents));
              setSelectedSections(previous => learningSnapshotKey(previous) === learningSnapshotKey(active.selectedSections || []) ? previous : (active.selectedSections || []));
              setSelectedGrade(previous => previous === (active.selectedGrade || null) ? previous : (active.selectedGrade || null));
              const filters = { group: '', article: '', date: '', level: '', ...(active.readingFilters || {}) };
              setReadingFilters(previous => learningSnapshotKey(previous) === learningSnapshotKey(filters) ? previous : filters);
              const nextSections = [...new Set(active.words.map(word => word.section))];
              setSections(previous => learningSnapshotKey(previous) === learningSnapshotKey(nextSections) ? previous : nextSections);
            }
            if (!saveToBrowser(authoritative)) throw Object.assign(new Error('云端已保存，本机档案保存失败，请导出备份。'), { syncHealthCode: 'storage_failed' });
            void reportLearningSyncHealth({ accountId, rpc: readerSupabase.rpc.bind(readerSupabase), healthy: !result.healthErrorCode, error: { syncHealthCode: result.healthErrorCode } });
            lastCloudProgressSnapshotRef.current = learningSnapshotKey({ version: 3, words: result.master.words || {}, appState: result.master.appState });
            const newerLocalMetadata = (usersRef.current[`reader_${accountId}`]?.updatedAt || '') > (masterState.appState.users[`reader_${accountId}`]?.updatedAt || '');
            setCloudReadingStatus(result.pendingCount
              ? `本机已保存，还有 ${result.pendingCount} 条答题等待云端确认。`
              : newerLocalMetadata ? '已确认本次同步；本机最新变更正在等待云端确认。' : '学习档案已由云端确认保存。');
          } catch (error) {
            if (syncAccountRef.current === accountId) {
              void reportLearningSyncHealth({ accountId, rpc: readerSupabase.rpc.bind(readerSupabase), healthy: false, error });
              let pending = 0;
              try { pending = readLearningOutbox(accountId).events.length; } catch {}
              setCloudReadingStatus(`同步失败：${error.message || error.code || '网络不可用'}；本机保留 ${pending} 条待同步答题，将自动重试。`);
            }
          } finally {
            syncInFlightRef.current = false;
          }
        }, 600);
        return () => { if (cloudProgressWriteTimerRef.current) clearTimeout(cloudProgressWriteTimerRef.current); };
      }, [words, users, currentUserId, readerCloudUser, cloudMasterStateLoaded, syncRetryTick]);

      useEffect(() => {
        if (!readerCloudUser || syncAccountRef.current !== readerCloudUser.id) return;
        void reportLearningSyncHealth({ accountId: readerCloudUser.id, rpc: readerSupabase.rpc.bind(readerSupabase) });
      }, [readerCloudUser, syncRetryTick]);

      useEffect(() => {
        const retry = () => setSyncRetryTick(tick => tick + 1);
        window.addEventListener('online', retry);
        document.addEventListener('visibilitychange', retry);
        const timer = setInterval(retry, 15000);
        return () => { window.removeEventListener('online', retry); document.removeEventListener('visibilitychange', retry); clearInterval(timer); };
      }, []);

      const handleReaderCloudLogin = async (event) => {
        event.preventDefault();
        setReaderLoginError('');
        if (!readerLoginEmail.trim() || !readerLoginPassword) {
          setReaderLoginError('请输入阅读器账号的邮箱和密码。');
          return;
        }
        setIsReaderLoggingIn(true);
        try {
          const { error } = await readerSupabase.auth.signInWithPassword({
            email: readerLoginEmail.trim(),
            password: readerLoginPassword
          });
          if (error) throw error;
          setShowReaderLogin(false);

      // Restore from local JSON file (preferred) or browser cache
      useEffect(() => {

        }, appState === 'summary' ? 0 : 400);

      useEffect(() => {

          fetch('./ket_vocab.json', { cache: 'no-store' }).then(res => (res.ok ? res.json() : null)),
        ])
          .then(([text, ketData]) => {
            const parsed = [
              ...(text ? parseData(text) : []),
              ...((ketData?.words || []).map(normalizeWordStats)),

            if (parsed.length === 0) return;
            const existing = currentUserId ? usersRef.current[currentUserId]?.words || [] : words;
            const existingById = new Map((existing || []).map(w => [w.id, w]));
            const hasNewWords = parsed.some(w => !existingById.has(w.id));
            const hasUpdatedMeta = parsed.some(w => {
              const prev = existingById.get(w.id);
              return prev && (
                prev.english_word !== w.english_word ||

                prev.chinese_meaning !== w.chinese_meaning ||
                prev.section !== w.section ||

                (prev.recognition_audit || '') !== (w.recognition_audit || '') ||
                JSON.stringify(prev.recognition_choices || null) !== JSON.stringify(w.recognition_choices || null)
              );
            });
            if (existing.length === 0 || hasNewWords || hasUpdatedMeta) {
              const bundledIds = new Set(parsed.map(word => word.id));
              const preservedWords = existing.filter(word => !bundledIds.has(word.id));
              const merged = mergeWordStats([...parsed, ...preservedWords], existing);
              const savedSections = currentUserId ? usersRef.current[currentUserId]?.selectedSections || [] : [];
              const savedGrade = currentUserId ? usersRef.current[currentUserId]?.selectedGrade || null : null;
              applyWordsToState(merged, '词库.md + KET词库', savedSections, savedGrade, existing.length > 0);

          .catch(() => {});

          .catch(() => {});

        Promise.all(MNEMONIC_FILES.map(path => fetch(path, { cache: 'no-store' }).then(res => {

              const parsed = parseLessonText(text);
              if (!cancelled && parsed.length > 0) {

      useEffect(() => {

          const currentWord = studyList[currentIndex];
          if (!currentWord) return;

          const canGoNext = showHint

            || (recognitionMode && feedback === 'incorrect');
          if (!canGoNext) return;

          e.preventDefault();

        window.addEventListener('keydown', onKeyDown);

      useEffect(() => {

          setRecognitionChoices([]);

        if (cached || currentWord.source === 'ket') {
          setRecognitionChoices(shuffleRecognitionChoices(cached || buildRecognitionChoices(currentWord, wordsRef.current)));
          setRecognitionChoiceStatus('audited');
          setSelectedChoiceKey(null);
          return () => { cancelled = true; };
        }
        const candidates = buildRecognitionChoices(currentWord, wordsRef.current);

          setRecognitionChoiceStatus('rejected');
          setSelectedChoiceKey(null);

        setRecognitionChoices([]);

        });
        return () => { cancelled = true; };
      }, [currentIndex, appState, studyList]);

      // 系统英语朗读是 iPad 及音频加载失败时的后备。
      const fallbackTTS = (text) => {
        if (!('speechSynthesis' in window)) return false;
        window.speechSynthesis.cancel();
        window.speechSynthesis.resume();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'en-US';

        // 尽可能寻找标准的美国发音引擎 (优先 Google, 其次 Mac: Samantha, Win: Zira)
        const usVoice = voices.find(v => v.lang.startsWith('en-US') && v.name.includes('Google')) ||

      const getOnlineTTSUrl = (text) => (

      );

        if (isIOSDevice() && fallbackTTS(wordText)) return;

          if (audioPlayerRef.current) {

            audioPlayerRef.current.src = '';
          }
          // Edge 对动态创建且未挂载到 DOM 的 Audio 播放限制更严格。
          const audio = audioElementRef.current || new Audio();
          audio.src = url;
          audio.preload = 'auto';
          audio.playsInline = true;
          audio.defaultMuted = false;
          audio.muted = false;
          audio.volume = 1;
          audioPlayerRef.current = audio;
          let handled = false;

            if (handled) return;
            handled = true;
            if (canFallbackToOnline) play(fallbackAudioUrl, false);
            else fallbackTTS(wordText);
          };
          // play() 有时会成功返回，但实际下载音频时才失败；两种情况都要兜底。

      const fetchWordDataAndPlay = async (wordText, shouldPlay = true) => {

          : [];

      const buildLocalHint = (word) => {

        return `【听读与回忆练习】\n先点喇叭听“${en}”，跟读并指着字母拼写。\n\n遮住英文，只看“${cn}”，试着说出并写出这个词；再打开核对，标出漏写或写错的字母。\n\n这条是通用练习提示，尚无这个词的专属助记。`;
      };

      const buildHintPrompt = (word) =>
        `为三至五年级孩子写单词“${word.english_word}”（${word.chinese_meaning}，${word.pos || '词性未提供'}）的一条具体拼写线索。先明确本课词义。用【读音与字母】指出可靠的实际声形对应及最多两个易错点，例如双写、不发音字母、弱读处的实际字母或词尾变化；再用【收起再写】要求遮住后写完整词并核对这些位置。核心说明80至140字。只有已熟悉的透明组成或实际字形变化能减少记忆负担时才补充；不适用就省略，不输出“整体记”或否定式空提醒。不要凑满视觉、语义、情境、构词五种维度，不编字母标签故事，不把任意两件物品强配双字母，不把口形或动作当作特定字母的依据，不让孩子靠另一个陌生词记目标词。拼写分块不得说成音节数量或真实词根，音标不得用中文谐音代替，词源没有可靠来源不使用。词义图和用法只能作为理解的补充，不能冒充拼写线索。若附加情境问题，必须只用中文明确要求取回目标词或词组，不能只问是否、区别或让孩子随意造句。无法确认读音对应时不猜，明确没有专属线索，并给出准确的字母顺序核对点。`;

      const fetchAIHintFromServer = async (prompt) => {
        const res = await fetch('/api/ai-hint', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ prompt }),
        });
        if (!res.ok) return null;
        const data = await res.json();
        return data.text?.trim() || null;
      };

      const buildChoiceAuditPrompt = (word, choices, retry = false) => `你是小学英语“见英选义”题的严格质检员兼改题老师。目标词：${word.english_word}；唯一正确中文释义必须严格写为：${normalizeMeaning(word.chinese_meaning)}；词性：${word.pos || '未提供'}。

候选题：${choices.map(choice => `- ${choice.isCorrect ? '正确' : '错误'}：${choice.text}`).join('\n')}

检查唯一正确性：不能有近义词、包含关系、可同时成立的解释、泛化词（如“某种东西”“做某事”）或语义模糊的选项。错误项应是孩子能明确排除的具体词义，尽量与目标保持同词性或同表达层级。

${retry ? '上一次输出未通过格式或唯一正确性校验。现在必须重写一组更清楚的选项。' : '若候选题不合格，请直接重写。'} 无论审核结果如何，都必须只返回严格 JSON，不要 Markdown：{"approved":true,"choices":[{"text":"唯一正确释义","isCorrect":true},{"text":"明确错误释义1","isCorrect":false},{"text":"明确错误释义2","isCorrect":false},{"text":"明确错误释义3","isCorrect":false}]}。必须恰好 4 项、恰好 1 项正确；正确项必须与给定正确释义逐字一致。`;

      const extractAIJson = (text) => {
        const source = String(text || '').trim().replace(/^```(?:json)?\s*/i, '').replace(/\s*```$/, '');
        const start = source.indexOf('{');
        const end = source.lastIndexOf('}');
        if (start < 0 || end <= start) return null;
        try { return JSON.parse(source.slice(start, end + 1)); } catch { return null; }
      };

      const auditRecognitionChoices = async (word, choices) => {
        const hasReaderAiSettings = Boolean(readerAiPreferences?.cloudBaseUrl && readerAiPreferences?.cloudModel);
        for (let attempt = 0; attempt < 2; attempt++) {
          const prompt = buildChoiceAuditPrompt(word, choices, attempt > 0);
          let text = null;
          try {
            if (readerAiKey && hasReaderAiSettings) text = await fetchAIHintFromReaderConfig(prompt, 700);
            else if (serverAvailableRef.current) {
              const res = await fetch('/api/ai-choice-audit', {
                method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ prompt })
              });
              if (res.ok) text = (await res.json()).text?.trim() || null;
            }
          } catch {
            text = null;
          }
          const audited = normalizeAuditedChoices(word, extractAIJson(text)?.choices);
          if (audited) return { choices: audited, source: 'ai' };
        }
        // 离线时仍只接受已有的本地硬规则；不以模糊选项凑数。
        const safeLocal = normalizeAuditedChoices(word, choices);
        return safeLocal ? { choices: safeLocal, source: 'local' } : null;
      };

      const fetchAIHintFromReaderConfig = async (prompt, maxTokens = 500) => {
        const apiKey = readerAiKey.trim();
        const baseUrl = String(readerAiPreferences?.cloudBaseUrl || '').trim().replace(/\/+$/, '');
        const model = String(readerAiPreferences?.cloudModel || '').trim();
        if (!apiKey || !baseUrl || !model) return null;
        const response = await fetch(`${baseUrl}/chat/completions`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${apiKey}`
          },
          body: JSON.stringify({
            model,
            temperature: 0.7,
            max_tokens: maxTokens,
            // DeepSeek V4 enables thinking by default. Mnemonics need the
            // final answer directly, not an empty/non-display reasoning turn.
            thinking: { type: 'disabled' },
            messages: [
              { role: 'system', content: '你是一位耐心、有趣的小学英语老师。用简体中文回答。' },
              { role: 'user', content: prompt }
            ]
          })
        });
        if (!response.ok) {
          const detail = (await response.text()).slice(0, 300);
          throw new Error(`AI 服务请求失败（HTTP ${response.status}）${detail ? `：${detail}` : ''}`);
        }
        const data = await response.json();
        const content = data?.choices?.[0]?.message?.content?.trim();
        if (!content) throw new Error('AI 服务返回了空内容');
        return content;
      };

      const generateHint = async (word) => {
        const authoredCard = mnemonicCards.get(mnemonicKey(word.section, word.english_word));
        if (authoredCard) {
          return {
            text: `【${authoredCard.method}】\n${authoredCard.hint}\n\n【例句】\n${authoredCard.example}`,
            source: 'library',
          };
        }
        const prompt = buildHintPrompt(word);
        let readerAiError = '';
        const hasReaderAiSettings = Boolean(readerAiPreferences?.cloudBaseUrl && readerAiPreferences?.cloudModel);
        if (hasReaderAiSettings && !readerAiKey.trim()) {
          return {
            text: buildLocalHint(word),
            source: 'local',
            aiError: '阅读器 AI Key 当前未解锁。刷新页面或关闭网页后，需要重新点击右上角“阅读器账号”并输入同步加密口令。'
          };
        }
        if (readerAiKey && hasReaderAiSettings) {
          try {
            const aiText = await fetchAIHintFromReaderConfig(prompt);
            if (aiText) return { text: aiText, source: 'ai' };
          } catch (error) {
            readerAiError = error.message || '请求没有返回内容';
            setReaderAiStatus(`阅读器 AI 助记暂不可用：${readerAiError}`);
          }
        }
        if (serverAvailableRef.current) {
          try {
            const aiText = await fetchAIHintFromServer(prompt);
            if (aiText) return { text: aiText, source: 'ai' };
          } catch {
            // fall through to local
          }
        }
        return { text: buildLocalHint(word), source: 'local', aiError: readerAiError };
      };

      const handleAIHint = async () => {
        const currentWord = studyList[currentIndex];

        if (!showHint && feedback !== 'correct') {
          handleShowHint();
        }

        setIsAILoading(true);
        setAiHintText('');
        setAiHintSource('');
        setAiHintError('');
        try {
          const { text, source, aiError } = await generateHint(currentWord);
          setAiHintText(text);
          setAiHintSource(source);
          setAiHintError(aiError || '');
        } catch {
          setAiHintText(buildLocalHint(currentWord));
          setAiHintSource('local');
        } finally {
          setIsAILoading(false);
        }
      };

      const generatePhonicsForWords = async (targets, label = '所选词库') => {
        targets = targets.filter(word => !mnemonicCards.has(mnemonicKey(word.section, word.english_word)));
        if (!targets.length || isBulkPhonicsLoading) return;
        const hasReaderAiSettings = Boolean(readerAiPreferences?.cloudBaseUrl && readerAiPreferences?.cloudModel);
        if (hasReaderAiSettings && !readerAiKey.trim()) {
          setBulkPhonicsError('请先在右上角“阅读器账号”输入同步加密口令，解锁 AI Key。');
          return;
        }
        if (!hasReaderAiSettings && !serverAvailableRef.current) {
          setBulkPhonicsError('需要已解锁的阅读器 AI Key，或启动本地服务并配置 AI Key。');
          return;
        }
        setIsBulkPhonicsLoading(true);
        setBulkPhonicsError('');
        let completed = 0;
        setBulkPhonicsProgress({ completed, total: targets.length, label });
        try {
          for (let index = 0; index < targets.length; index += PHONICS_BATCH_SIZE) {
            const batch = targets.slice(index, index + PHONICS_BATCH_SIZE);
            const prompt = buildPhonicsBatchPrompt(batch);
            let text = null;
            if (readerAiKey && hasReaderAiSettings) text = await fetchAIHintFromReaderConfig(prompt, 1100);
            else {
              const res = await fetch('/api/ai-phonics-batch', {
                method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ prompt })
              });
              if (res.ok) text = (await res.json()).text?.trim() || null;
            }
            const json = String(text || '').replace(/^```(?:json)?\s*/i, '').replace(/\s*```$/, '');
            const items = JSON.parse(json)?.items || [];
            const mnemonics = new Map(items.filter(item => item?.id && item?.text).map(item => [String(item.id), String(item.text).slice(0, 240)]));
            if (!mnemonics.size) throw new Error(`第 ${Math.floor(index / PHONICS_BATCH_SIZE) + 1} 批没有返回有效结果`);
            const generatedAt = new Date().toISOString();
            setWords(previous => previous.map(word => mnemonics.has(word.id)
              ? { ...word, phonicsMnemonic: mnemonics.get(word.id), phonicsMnemonicAddedAt: generatedAt, vocabMasterProgressUpdatedAt: generatedAt }
              : word));
            completed += batch.length;
            setBulkPhonicsProgress({ completed, total: targets.length, label });
          }
          setErrorMsg(`已为${label}的 ${targets.length} 个词生成 AI 自然拼读助记。`);
        } catch (error) {
          setBulkPhonicsError(`${label}的批量生成在 ${completed}/${targets.length} 词后暂停：${error.message || '请稍后重试'}。已完成的词已保存。`);
        } finally {
          setIsBulkPhonicsLoading(false);
        }
      };

      const generateAllReadingPhonics = () => (
        generatePhonicsForWords(words.filter(word => word.source === 'reading'), '阅读生词本')
      );

      const generateSelectedBookPhonics = () => {
        const normalSections = selectedSections.filter(section => !isMistakeBookKey(section) && section !== READING_VOCAB_SECTION);
        const targets = words.filter(word => normalSections.includes(word.section) && word.source !== 'reading');
        generatePhonicsForWords(targets, normalSections.join('、') || '所选书本');
      };
      // --- End AI Hint Logic ---

      // 1. Parser Logic for Markdown and CSV File
      const handleFileUpload = (e) => {
        setErrorMsg('');
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = (event) => {
          const text = event.target.result;
          const parsed = parseData(text);

          if (parsed.length > 0) {
            const merged = mergeWordStats(parsed, words);
            applyWordsToState(merged, file.name, selectedSections);
          } else {
            setErrorMsg('未能解析出有效的单词数据。请确保文件包含标准的 Markdown 表格或 CSV 格式，且列为: id, section, english_word, chinese_meaning, learning_requirement, pos（pos 可选）。');
          }
        };
        reader.readAsText(file);
        e.target.value = '';
      };

      // Handle JSON Learning Record Upload
      const handleJsonUpload = (e) => {
        setErrorMsg('');
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = (event) => {
          try {
            const parsed = JSON.parse(event.target.result);
            if (parsed.format === 'vocabmaster-backup-v3' && isValidAppData(parsed.appState)) {
              const recoveryAccount = learningAccountKey(readerCloudUser?.id || currentUserId);
              if (parsed.accountId !== recoveryAccount) throw new Error('备份账号与当前账号不同。');
              const before = { appState: loadFromBrowser(), outbox: readLearningOutbox(recoveryAccount) };
              localStorage.setItem(`vocabmaster_before_import_${Date.now()}`, JSON.stringify(before));
              const box = readLearningOutbox(recoveryAccount);
              writeLearningOutbox(recoveryAccount, { ...box, events: mergeStudyEvents(mergeStudyEvents(box.events, parsed.outbox?.events || []), parsed.appState.users[currentUserId]?.studyEvents || []) });
              const restored = mergeCloudAppState(parsed.appState, buildPayload(currentUserId, usersRef.current));
              usersRef.current = restored.users; setUsers(restored.users);
              const active = restored.users[currentUserId];
              if (active) { setWords(active.words); setStudyEvents(active.studyEvents); }
              if (!saveToBrowser(restored)) throw new Error('导入档案无法保存到本机，请保留原备份。');
              setSyncRetryTick(tick => tick + 1);
              return;
            }
            if (Array.isArray(parsed.entries)) {
              localStorage.setItem(READING_VOCAB_INBOX_KEY, JSON.stringify(parsed));
              setReadingInboxEntries(parsed.entries);
              setErrorMsg('已载入阅读生词本收件箱，请先进行 AI 筛选。');
              return;
            }
            if (Array.isArray(parsed) && parsed.length > 0 && parsed[0].hasOwnProperty('english_word') && parsed[0].hasOwnProperty('correctCount')) {
              localStorage.setItem(`vocabmaster_legacy_import_${Date.now()}`, JSON.stringify(parsed));
              applyWordsToState(parsed.map(word => ({ ...word, correctCount: 0, incorrectCount: 0, consecutiveCorrect: 0, mistakeCleared: false })), file.name, selectedSections);
              setErrorMsg('已导入词条，原历史计数已单独留档；缺少逐次答题凭据的计数需要核实恢复，未作为新答题上传。');
            } else {
              setErrorMsg('导入的 JSON 格式不符合要求，请确保是本软件导出的学习记录文件。');
            }
          } catch (err) {
            setErrorMsg(`导入失败：${err.message} 原备份文件未修改。`);
          }
        };
        reader.readAsText(file);
        e.target.value = '';
      };

      // 2. Selection Logic
      const updateUserSelectionMeta = (patch) => {
        if (!currentUserId) return;
        setUsers(prev => ({
          ...prev,
          [currentUserId]: {
            ...prev[currentUserId],
            ...patch,
            updatedAt: new Date().toISOString(),
          },
        }));
      };

      const selectGrade = (grade) => {
        setSelectedGrade(grade);
        setErrorMsg('');
        updateUserSelectionMeta({ selectedGrade: grade });
      };

      const backToGradeList = () => {
        setSelectedGrade(null);
        setErrorMsg('');
        updateUserSelectionMeta({ selectedGrade: null });
      };

      const toggleSection = (section) => {
        const next = selectedSections.includes(section)
          ? selectedSections.filter(s => s !== section)
          : [...selectedSections, section];
        setSelectedSections(next);
        updateUserSelectionMeta({ selectedSections: next });
      };

      const unlockReadingManager = async (event) => {
        event.preventDefault();
        setReadingManagerError('');
        if (!readerCloudUser?.email) {
          setReadingManagerError('请先登录阅读器账号。');
          return;
        }
        const { error } = await readerSupabase.auth.signInWithPassword({
          email: readerCloudUser.email,
          password: readingManagerPassword,
        });
        if (error) {
          setReadingManagerError('管理密码不正确，请重试。');
          return;
        }
        setReadingManagerPassword('');
        setReadingManagerUnlocked(true);
      };

      const deleteSelectedReadingWords = () => {
        if (!readingManagerUnlocked || readingDeleteIds.length === 0 || !currentUserId) return;
        if (!window.confirm(`确定从阅读生词学习列表删除 ${readingDeleteIds.length} 个词吗？`)) return;
        const deleted = new Set(readingDeleteIds);
        const ignored = Array.from(new Set([...(currentUser?.ignoredReadingWordIds || []), ...deleted]));
        setWords(previous => previous.filter(word => !deleted.has(word.id)));
        const nextUsers = {
          ...usersRef.current,
          [currentUserId]: { ...usersRef.current[currentUserId], ignoredReadingWordIds: ignored, updatedAt: new Date().toISOString() },
        };
        usersRef.current = nextUsers;
        setUsers(nextUsers);
        setReadingDeleteIds([]);
        setShowReadingManager(false);
        setReadingManagerUnlocked(false);
        setErrorMsg('已删除所选阅读生词；它们不会在下次导入时重新加入学习列表。');
      };

      const getFilteredReadingWords = () => {
        return words.filter(word => word.source === 'reading' && !word.readingDeferred);
      };

      // 阅读生词本不是预分组：它是一个最多 50 词的到期队列。新词只在
      // 复习债允许时补入；cursor 让“从新到旧”是一次持续扫描，而不是每天
      // 又从最新词重新开始，避免旧词被持续新增的词饿死。
      const getReadingRollingPlan = () => {
        const now = new Date();
        const today = getLocalDateKey(now);
        const readingWords = words.filter(word => word.source === 'reading' && !word.readingDeferred);
        const introduced = readingWords.filter(word => word.readingIntroducedAt);
        const activeDue = introduced
          .filter(word => !word.readingMasteredAt)
          .filter(word => !word.readingNextDueAt || word.readingNextDueAt <= today)
          .sort((a, b) => {
            const difficulty = (b.incorrectCount || 0) - (a.incorrectCount || 0);
            return difficulty || String(a.readingNextDueAt || '').localeCompare(String(b.readingNextDueAt || ''));
          });
        const masteredDue = introduced
          .filter(word => Boolean(word.readingMasteredAt))
          .filter(word => word.readingNextDueAt && word.readingNextDueAt <= today)
          .sort((a, b) => {
            const risk = (b.incorrectCount || 0) - (a.incorrectCount || 0);
            return risk || String(a.readingNextDueAt || '').localeCompare(String(b.readingNextDueAt || ''));
          });

        const readingEvents = normalizeStudyEvents(studyEvents).filter(event => event.section === READING_VOCAB_SECTION);
        const recentEvents = readingEvents.filter(event => {
          const at = new Date(event.at);
          return !Number.isNaN(at.getTime()) && now - at <= 14 * 24 * 60 * 60 * 1000;
        });
        const correctRate = recentEvents.length
          ? recentEvents.filter(event => event.result === 'correct').length / recentEvents.length
          : null;
        const firstIntroducedAt = introduced.map(word => word.readingIntroducedAt).sort()[0];
        const hasTwoWeekHistory = firstIntroducedAt
          && now - new Date(firstIntroducedAt) >= 14 * 24 * 60 * 60 * 1000
          && recentEvents.length >= 20;
        const newLimit = introduced.length === 0
          ? READING_WARMUP_NEW_LIMIT
          : !hasTwoWeekHistory ? READING_DEFAULT_NEW_LIMIT
            : correctRate >= 0.93 ? 20
              : correctRate >= 0.90 ? 18
                : correctRate >= 0.85 ? 15
                  : correctRate >= 0.80 ? 12 : 8;

        const active = activeDue.slice(0, READING_DAILY_LIMIT);
        const roomAfterActive = READING_DAILY_LIMIT - active.length;
        const samples = masteredDue.slice(0, Math.min(READING_MASTERED_SAMPLE_LIMIT, roomAfterActive));
        const remaining = READING_DAILY_LIMIT - active.length - samples.length;
        const cursor = readingCursorOrderKey(currentUser?.readingQueueCursor);
        const orderKey = (word) => `${word.importedAt || word.sourceArticleDate || ''}\u0000${word.id}`;
        const unseen = readingWords
          .filter(word => !word.readingIntroducedAt)
          .sort((a, b) => orderKey(b).localeCompare(orderKey(a)));
        let candidates = cursor ? unseen.filter(word => orderKey(word) < cursor) : unseen;
        // 到达最旧词后才开启下一轮；新导入词不会打断当前从新到旧的扫描。
        if (cursor && candidates.length === 0) candidates = unseen;
        const newcomers = candidates.slice(0, Math.min(newLimit, remaining));
        const nextCursor = normalizeReadingQueueCursor(newcomers.length ? orderKey(newcomers.at(-1)) : cursor);

        return {
          words: [...active, ...samples, ...newcomers],
          activeCount: active.length,
          sampleCount: samples.length,
          newCount: newcomers.length,
          newLimit,
          correctRate,
          nextCursor,
          hasTwoWeekHistory,
        };
      };

      // Helper function to get the combined list of words selected
      const getWordsToStudy = () => {
        let filteredWords = [];
        const normalSections = selectedSections.filter(s => !isMistakeBookKey(s) && s !== READING_VOCAB_SECTION);

        if (normalSections.length > 0) {
          filteredWords = words.filter(w => normalSections.includes(w.section));
        }

        if (selectedSections.includes(READING_VOCAB_SECTION) || appState === 'reading') {
          filteredWords.push(...getFilteredReadingWords());
        }

        const existingIds = new Set(filteredWords.map(w => w.id));
        selectedSections.filter(isMistakeBookKey).forEach(key => {
          const grade = getMistakeBookGradeFromKey(key);
          getMistakeWords(words, grade).forEach(m => {
            if (!existingIds.has(m.id)) {
              filteredWords.push(m);
              existingIds.add(m.id);
            }
          });
        });
        return filteredWords
          .filter(word => !isHiddenGrade(parseSectionMeta(word.section).grade))
          .filter((word, index, list) => list.findIndex(item => item.id === word.id) === index)
          // KET 审核未通过的识义题宁可暂不出题，也不能退回随机干扰项。
          .filter(word => word.source !== 'ket' || !isRecognitionWord(word) || hasAuditedRecognitionChoices(word));
      };

      const playEncouragement = (kind) => {
        if (!feedbackSoundEnabled) return;
        if (!encouragementPlayerRef.current) encouragementPlayerRef.current = createEncouragementPlayer();
        void encouragementPlayerRef.current.play(kind);
      };

      const resetSessionReward = () => {
        clearTimeout(advanceTimerRef.current);
        encouragementPlayerRef.current?.stop();
        sessionRewardRef.current = { points: 0, streak: 0, bestStreak: 0 };
        setSessionReward(sessionRewardRef.current);
        questionProgressRef.current = { attempted: false, solved: false };
        setRewardFeedback(null);
      };

      const encourageAnswer = (isCorrect) => {
        const reward = getAnswerReward(sessionRewardRef.current.streak, isCorrect, questionProgressRef.current.attempted);
        const next = {
          points: sessionRewardRef.current.points + reward.points,
          streak: reward.streak,
          bestStreak: Math.max(sessionRewardRef.current.bestStreak, reward.streak),
        };
        sessionRewardRef.current = next;
        setSessionReward(next);
        setRewardFeedback(reward);
        playEncouragement(reward.kind);
        return reward.points;
      };

      const renderRewardPanel = (inSession = false) => (
        <section aria-label="学习奖励" className="mb-5 rounded-xl border border-amber-200 bg-amber-50 px-4 py-3 text-left">
          <div className="flex flex-wrap items-center justify-between gap-3">
            <div className="flex flex-wrap items-center gap-x-5 gap-y-2 text-sm text-amber-950">
              <span>★ 累计积分 <b data-testid="reward-total">{getRewardTotal(currentUser?.rewardLedger)}</b></span>
              {inSession && <><span>本次 <b data-testid="reward-session">+{sessionReward.points}</b></span><span>连对 <b data-testid="reward-streak">{sessionReward.streak}</b> 题</span></>}
            </div>
            <button type="button" aria-label="鼓励音效" aria-pressed={feedbackSoundEnabled}
              onClick={() => {
                const enabled = !feedbackSoundEnabled;
                setFeedbackSoundEnabled(enabled);
                try { localStorage.setItem(FEEDBACK_SOUND_KEY, enabled ? 'on' : 'off'); } catch {}
                if (!enabled) encouragementPlayerRef.current?.stop();
              }}
              className="rounded-lg border border-amber-300 bg-white px-3 py-2 text-xs font-medium text-amber-950">
              鼓励音效：{feedbackSoundEnabled ? '开' : '关'}
            </button>
          </div>
          <details className="mt-2 text-xs leading-6 text-amber-900"><summary className="cursor-pointer">积分怎么得？</summary>
            首次答对 +10 分；每连续答对 3 题额外 +5 分；答错后改对 +5 分。答错、看提示和跳题不扣分，连对重新计数。助记自查不计分。积分从启用奖励后开始累计。
          </details>
        </section>
      );

      const startStudy = () => {
        const filteredWords = getWordsToStudy();
        if (filteredWords.length === 0) {
          setErrorMsg('请至少选择一个 Unit、错题本，或调整阅读生词本筛选条件');
          return;
        }
        setErrorMsg('');

        // Optional: Shuffle the array for randomness
        const shuffled = [...filteredWords].sort(() => Math.random() - 0.5);
        setStudyList(shuffled);
        setCurrentIndex(0);
        setSessionStats({ correct: 0, incorrect: 0, mistakeWordIds: [] });
        resetSessionReward();
        setUserInput('');
        setFeedback(null);
        setShowHint(false);
        setSelectedChoiceKey(null);
        setRecognitionChoices([]);
        setRecognitionChoiceStatus('');
        setCurrentPhonetic('');
        setCurrentAudioUrl('');
        setAppState('study');
        
        // Fetch and Auto-play first word pronunciation
        if (shuffled.length > 0) {
          fetchWordDataAndPlay(shuffled[0].english_word, true);
        }
      };

      const startMistakeLevelStudy = (grade, level) => {
        const candidates = getMistakeWords(words, grade).filter(word => getMistakeLevel(word).level === level);
        if (!candidates.length) return;
        const shuffled = [...candidates].sort(() => Math.random() - 0.5);
        setErrorMsg('');
        setStudyList(shuffled);
        setCurrentIndex(0);
        setSessionStats({ correct: 0, incorrect: 0, mistakeWordIds: [] });
        resetSessionReward();
        setUserInput('');
        setFeedback(null);
        setShowHint(false);
        setSelectedChoiceKey(null);
        setRecognitionChoices([]);
        setRecognitionChoiceStatus('');
        setCurrentPhonetic('');
        setCurrentAudioUrl('');
        setAppState('study');
        fetchWordDataAndPlay(shuffled[0].english_word, true);
      };

      const startReadingRollingStudy = () => {
        const plan = getReadingRollingPlan();
        if (!plan.words.length) {
          setErrorMsg('今天没有到期的阅读词；明天会自动安排下一轮复习。');
          return;
        }
        setErrorMsg('');
        setStudyList(plan.words);
        setCurrentIndex(0);
        setSessionStats({ correct: 0, incorrect: 0, mistakeWordIds: [] });
        resetSessionReward();
        setUserInput('');
        setFeedback(null);
        setShowHint(false);
        setSelectedChoiceKey(null);
        setRecognitionChoices([]);
        setRecognitionChoiceStatus('');
        setCurrentPhonetic('');
        setCurrentAudioUrl('');
        setAppState('study');
        fetchWordDataAndPlay(plan.words[0].english_word, true);
      };

      const startPrintPreview = () => {
        const filteredWords = getWordsToStudy();
        if (filteredWords.length === 0) {
          setErrorMsg('没有可打印的单词，请调整选择条件');
          return;
        }
        setErrorMsg('');
        setPrintList(filteredWords);
        setPrintMode('cards');
        setAppState('print');
      };

      const startTodayMistakePrint = async () => {
        const today = getLocalDateKey(new Date());
        const mistakenIds = [...new Set(
          normalizeStudyEvents(studyEvents)
            .filter(event => getLocalDateKey(event.at) === today && event.result === 'incorrect')
            .map(event => event.wordId)
        )];
        const mistakenWords = mistakenIds.map(id => wordsRef.current.find(word => word.id === id)).filter(Boolean);
        if (!mistakenWords.length) {
          setErrorMsg('今天还没有可打印的错题。');
          return;
        }
        setIsPreparingMistakePrint(true);
        setErrorMsg('');
        try {
          const prepared = [];
          for (const word of mistakenWords) {
            const hint = await generateHint(word);
            prepared.push({ ...word, printableHint: hint.text, printableHintSource: hint.source });
          }
          setPrintList(prepared);
          setPrintMode('mistakes');
          setAppState('print');
        } catch {
          setErrorMsg('错题讲义生成失败，请重试。');
        } finally {
          setIsPreparingMistakePrint(false);
        }
      };

      const startFlashcards = () => {
        const cards = [...getWordsToStudy()].sort(() => Math.random() - 0.5);
        if (!cards.length) {
          setErrorMsg('所选词库暂时没有单词');
          return;
        }
        setErrorMsg('');
        setFlashcardList(cards);
        setFlashcardIndex(0);
        setFlashcardFlipped(false);
        setFlashcardKnownIds(cards.filter(card => card.flashcardKnown).map(card => card.id));
        setAppState('flashcards');
      };

      const moveFlashcard = (direction) => {
        setFlashcardIndex(prev => Math.max(0, Math.min(flashcardList.length - 1, prev + direction)));
        setFlashcardFlipped(false);
      };

      const toggleFlashcardKnown = () => {
        const card = flashcardList[flashcardIndex];
        if (!card) return;
        const nextKnown = !flashcardKnownIds.includes(card.id);
        setFlashcardKnownIds(prev => nextKnown ? [...prev, card.id] : prev.filter(id => id !== card.id));
        setWords(prevWords => prevWords.map(word => word.id === card.id
          ? { ...word, flashcardKnown: nextKnown, vocabMasterProgressUpdatedAt: new Date().toISOString() }
          : word));
      };

      const exitStudy = () => {
        clearTimeout(advanceTimerRef.current);
        encouragementPlayerRef.current?.stop();
        if ('speechSynthesis' in window) {
          window.speechSynthesis.cancel();
        }
        setFeedback(null);
        setUserInput('');
        setShowHint(false);
        setAiHintText('');
        setAiHintSource('');
        setCurrentPhonetic('');
        setCurrentAudioUrl('');
        setAppState('select');
      };

      // 3. Study Logic
      const recordStudyEvent = (wordId, isCorrect, nextWords, readingQueueCursor, rewardPoints = 0) => {
        const word = wordsRef.current.find(item => item.id === wordId);
        if (!word) return;
        const at = new Date().toISOString();
        const id = typeof crypto !== 'undefined' && typeof crypto.randomUUID === 'function'
          ? crypto.randomUUID()
          : `${at}-${wordId}-${Math.random().toString(36).slice(2, 8)}`;
        if (readerCloudUser && (currentUserId !== `reader_${readerCloudUser.id}` || !cloudMasterStateAppliedRef.current || syncAccountRef.current !== readerCloudUser.id)) {
          setErrorMsg('正在切换学习账号，请等待档案加载后再答题。');
          return false;
        }
        const activeUser = usersRef.current[currentUserId];
        const event = {
          id, at, wordId, durableVersion: 3, englishWord: word.english_word, chineseMeaning: word.chinese_meaning,
          section: word.section, result: isCorrect ? 'correct' : 'incorrect', rewardPoints,
          wordDefinition: { ...word, correctCount: 0, incorrectCount: 0, consecutiveCorrect: 0, mistakeCleared: false },
          wordState: Object.fromEntries(Object.entries(nextWords.find(item => item.id === wordId) || {}).filter(([key]) => key.startsWith('reading'))),
        };
        try {
          enqueueLearningEvent(readerCloudUser?.id || currentUserId, event);
        } catch (error) {
          if (readerCloudUser) void reportLearningSyncHealth({ accountId: readerCloudUser.id, rpc: readerSupabase.rpc.bind(readerSupabase), healthy: false, error: { syncHealthCode: error.syncHealthCode || 'storage_failed' } });
          setErrorMsg(`这次答题尚未保存：${error.message} 请释放浏览器存储空间后再试。`);
          return false;
        }
        const nextEvents = mergeStudyEvents(activeUser?.studyEvents || studyEvents, [event]);
        setStudyEvents(nextEvents);

        // 答题事件和词状态必须一起立即落盘，不能让词状态只依赖 400ms 防抖。
        if (activeUser) {
          const nextUsers = {
            ...usersRef.current,
            [currentUserId]: {
              ...activeUser,
              words: nextWords,
              studyEvents: nextEvents,
              rewardLedger: rewardPoints > 0 ? { ...normalizeRewardLedger(activeUser.rewardLedger), [id]: rewardPoints } : normalizeRewardLedger(activeUser.rewardLedger),
              ...(readingQueueCursor ? { readingQueueCursor } : {}),
              updatedAt: at,
            },
          };
          usersRef.current = nextUsers;
          setUsers(nextUsers);
          if (!saveToBrowser(buildPayload(currentUserId, nextUsers))) {
            if (readerCloudUser) void reportLearningSyncHealth({ accountId: readerCloudUser.id, rpc: readerSupabase.rpc.bind(readerSupabase), healthy: false, error: { syncHealthCode: 'storage_failed' } });
            setErrorMsg('答题已保存在待同步备份中；本机档案保存失败，请导出备份。');
          }
        }
        return true;
      };

      const updateGlobalWordStats = (wordId, isCorrect, rewardPoints = 0) => {
        const now = new Date().toISOString();
        const liveWord = wordsRef.current.find(word => word.id === wordId);
        // 游标只在真正完成首次作答后前移；中途退出不会跳过已经选中但尚未作答的词。
        const readingQueueCursor = liveWord?.source === 'reading' && !liveWord.readingIntroducedAt
          ? { importedAt: liveWord.importedAt || liveWord.sourceArticleDate || '', wordId: String(liveWord.id) }
          : '';
        const nextWords = wordsRef.current.map(w => {
            if (w.id !== wordId) return w;

            const isReadingWord = w.source === 'reading';
            const introducedAt = w.readingIntroducedAt || now;

            if (isCorrect) {
              const consecutiveCorrect = (w.consecutiveCorrect || 0) + 1;
              const hadMistakes = (w.incorrectCount || 0) > 0;
              const wasMastered = isReadingWord && Boolean(w.readingMasteredAt);
              const becomesMastered = isReadingWord && !wasMastered && consecutiveCorrect >= MISTAKE_EXIT_STREAK;
              const nextReviewStage = wasMastered ? Math.min((w.readingReviewStage || 0) + 1, 3) : (becomesMastered ? 0 : (w.readingReviewStage || 0));
              const reviewIntervals = [7, 14, 30, 60];
              const mistakeCleared = hadMistakes && !w.mistakeCleared && consecutiveCorrect >= MISTAKE_EXIT_STREAK
                ? true
                : (w.mistakeCleared || false);

              return {
                ...w,
                correctCount: (w.correctCount || 0) + 1,
                consecutiveCorrect,
                mistakeCleared,
                ...(isReadingWord ? {
                  readingIntroducedAt: introducedAt,
                  readingMasteredAt: becomesMastered || wasMastered ? (w.readingMasteredAt || now) : '',
                  readingReviewStage: nextReviewStage,
                  readingNextDueAt: addLocalDays(now, becomesMastered || wasMastered ? reviewIntervals[nextReviewStage] : 1),
                } : {}),
                vocabMasterProgressUpdatedAt: now,
              };
            }

            return {
              ...w,
              incorrectCount: (w.incorrectCount || 0) + 1,
              consecutiveCorrect: 0,
              mistakeCleared: false,
              ...(isReadingWord ? {
                readingIntroducedAt: introducedAt,
                readingMasteredAt: '',
                readingReviewStage: 0,
                readingNextDueAt: addLocalDays(now, 1),
              } : {}),
              vocabMasterProgressUpdatedAt: now,
            };
          });
        if (!recordStudyEvent(wordId, isCorrect, nextWords, readingQueueCursor, rewardPoints)) return false;
        wordsRef.current = nextWords;
        setWords(nextWords);
        return true;
      };

      const recordSessionMistake = (wordId) => {
        setSessionStats(prev => {
          if (prev.mistakeWordIds.includes(wordId)) return prev;
          return {
            ...prev,
            incorrect: prev.incorrect + 1,
            mistakeWordIds: [...prev.mistakeWordIds, wordId],
          };
        });
      };

      const handleCheck = (e) => {
        e.preventDefault();
        if (!userInput.trim() || showHint || questionProgressRef.current.solved) return;

        const currentWord = studyList[currentIndex];
        const isCorrect = matchesSpelling(userInput, currentWord.english_word);

        if (isCorrect) {
          const rewardPoints = getAnswerReward(sessionRewardRef.current.streak, true, questionProgressRef.current.attempted).points;
          if (!updateGlobalWordStats(currentWord.id, true, rewardPoints)) return;
          encourageAnswer(true);
          questionProgressRef.current.solved = true;
          setFeedback('correct');
          setSessionStats(prev => ({ ...prev, correct: prev.correct + 1 }));

          const willGraduate = isInMistakeBook(currentWord)
            && (currentWord.consecutiveCorrect || 0) + 1 >= MISTAKE_EXIT_STREAK;
          const hasExamples = findLessonExamples(currentWord, lessonSentences).length > 0;

          // 有课文例句时留给孩子阅读，不再自动跳题
          if (!hasExamples) {
            advanceTimerRef.current = setTimeout(() => {
              handleNext(willGraduate);
            }, (sessionRewardRef.current.streak > 0 && sessionRewardRef.current.streak % 3 === 0) || willGraduate ? 1200 : 900);
          }
        } else {
          if (!questionProgressRef.current.attempted) {
            if (!updateGlobalWordStats(currentWord.id, false)) return;
            encourageAnswer(false);
            setFeedback('incorrect');
            questionProgressRef.current.attempted = true;
            recordSessionMistake(currentWord.id);
          }
          // Let user try again or ask for hint
        }
      };

      const handleChoiceSelect = (choice) => {
        if (showHint || questionProgressRef.current.solved || questionProgressRef.current.attempted) return;

        const currentWord = studyList[currentIndex];
        setSelectedChoiceKey(choice.key);

        if (choice.isCorrect) {
          const rewardPoints = getAnswerReward(sessionRewardRef.current.streak, true, questionProgressRef.current.attempted).points;
          if (!updateGlobalWordStats(currentWord.id, true, rewardPoints)) return;
          encourageAnswer(true);
          questionProgressRef.current.solved = true;
          setFeedback('correct');
          setSessionStats(prev => ({ ...prev, correct: prev.correct + 1 }));

          const willGraduate = isInMistakeBook(currentWord)
            && (currentWord.consecutiveCorrect || 0) + 1 >= MISTAKE_EXIT_STREAK;
          const hasExamples = findLessonExamples(currentWord, lessonSentences).length > 0;

          if (!hasExamples) {
            advanceTimerRef.current = setTimeout(() => {
              handleNext(willGraduate);
            }, sessionRewardRef.current.streak % 3 === 0 || willGraduate ? 1200 : 900);
          }
        } else {
          if (!updateGlobalWordStats(currentWord.id, false)) return;
          encourageAnswer(false);
          questionProgressRef.current.attempted = true;
          setFeedback('incorrect');
          recordSessionMistake(currentWord.id);
        }
      };

      const handleNext = (graduatedFromMistakeBook = false) => {
        clearTimeout(advanceTimerRef.current);
        encouragementPlayerRef.current?.stop();
        if (!questionProgressRef.current.solved) {
          sessionRewardRef.current = { ...sessionRewardRef.current, streak: 0 };
          setSessionReward(sessionRewardRef.current);
        }
        questionProgressRef.current = { attempted: false, solved: false };
        setRewardFeedback(null);
        setFeedback(null);
        setUserInput('');
        setShowHint(false);
        setSelectedChoiceKey(null);
        setAiHintText('');
        setAiHintSource('');
        if (graduatedFromMistakeBook) {
          // brief pause already handled in handleCheck timeout
        }
        if (currentIndex < studyList.length - 1) {
          setCurrentIndex(currentIndex + 1);
          fetchWordDataAndPlay(studyList[currentIndex + 1].english_word, true);
        } else {
          setAppState('summary');
        }
      };

      const handleShowHint = () => {
        if (questionProgressRef.current.solved) return;
        const currentWord = studyList[currentIndex];
        // 连续输错后再看提示，仍只记作这张卡的 1 次错词。
        if (!questionProgressRef.current.attempted) {
          if (!updateGlobalWordStats(currentWord.id, false)) return;
          encourageAnswer(false);
          questionProgressRef.current.attempted = true;
          recordSessionMistake(currentWord.id);
        }
        setShowHint(true);
      };

      // 4. Export Logic
      const exportJSON = () => {
        const accountId = readerCloudUser?.id || currentUserId;
        const dataStr = JSON.stringify({ format: 'vocabmaster-backup-v3', appState: buildPayload(currentUserId, usersRef.current), accountId, outbox: readLearningOutbox(accountId) }, null, 2);
        const dataUri = 'data:application/json;charset=utf-8,'+ encodeURIComponent(dataStr);
        const userLabel = currentUser?.name ? currentUser.name.replace(/\s+/g, '_') : 'user';
        const exportFileDefaultName = `vocabulary_${userLabel}_${new Date().toISOString().slice(0, 10)}.json`;

        const linkElement = document.createElement('a');
        linkElement.setAttribute('href', dataUri);
        linkElement.setAttribute('download', exportFileDefaultName);
        linkElement.click();
      };

      const exportReadingEnglishWords = () => {
        const exportedWords = words
          .filter(word => word.source === 'reading')
          .map(word => String(word.english_word || '').trim())
          .filter(Boolean)
          .filter((word, index, list) => list.findIndex(item => item.toLowerCase() === word.toLowerCase()) === index)
          .join(',');
        const dataUri = 'data:text/plain;charset=utf-8,' + encodeURIComponent(exportedWords);
        const userLabel = currentUser?.name ? currentUser.name.replace(/\s+/g, '_') : 'user';
        const linkElement = document.createElement('a');

        linkElement.setAttribute('href', dataUri);
        linkElement.setAttribute('download', `reading_words_${userLabel}_${new Date().toISOString().slice(0, 10)}.txt`);
        linkElement.click();
      };

      // --- UI Components ---

      const renderImport = () => (
        <div className="flex flex-col items-center justify-center py-12 text-center animate-fade-in">
          <div className="bg-blue-50 p-6 rounded-full mb-6">
            <BookOpen size={48} className="text-blue-600" />
          </div>
          <h2 className="text-2xl font-bold text-gray-800 mb-4">开始背单词</h2>

          <div className={`w-full max-w-lg mb-6 p-4 rounded-xl border text-sm ${
            serverAvailable
              ? 'bg-green-50 border-green-200 text-green-800'
              : IS_FILE_PROTOCOL
                ? 'bg-red-50 border-red-200 text-red-800'
                : 'bg-amber-50 border-amber-200 text-amber-800'
          }`}>
            {serverAvailable ? (
              <p>
                本地文件模式已启用：学习记录自动写入
                <code className="mx-1 px-1.5 py-0.5 bg-white/70 rounded">{DATA_FILE_NAME}</code>
              </p>
            ) : IS_FILE_PROTOCOL ? (
              <div className="text-left space-y-2">
                <p className="font-semibold">当前是直接双击 HTML 打开的，浏览器不允许写入本地 JSON 文件。</p>
                <p>请改用同目录下的启动器（效果等同于「一键打开 app」）：</p>
                <p>
                  <code className="px-1.5 py-0.5 bg-white/70 rounded">启动单词.command</code>
                  <span className="text-red-700"> ← 双击这个文件</span>
                </p>
                <p className="text-xs opacity-80">启动后会自动打开浏览器，学习记录写入 {DATA_FILE_NAME}。现在只能暂存于浏览器缓存。</p>
              </div>
            ) : (
              <p>
                当前仅浏览器缓存。请在终端运行
                <code className="mx-1 px-1.5 py-0.5 bg-white/70 rounded">python3 vocab_server.py</code>
                后访问页面，才能自动保存到本地 JSON 文件。
              </p>
            )}
          </div>

          <p className="w-full max-w-lg mb-4 text-xs text-gray-500">
            阅读器云同步：{cloudReadingStatus}
            <a className="ml-2 text-blue-600 hover:underline" href="https://lesong36.github.io/reading/" target="_blank" rel="noreferrer">登录阅读器账号</a>
          </p>

          {pendingReadingEntries.length > 0 && (
            <div className="w-full max-w-lg mb-6 p-4 rounded-xl border border-emerald-200 bg-emerald-50 text-emerald-900">
              <p className="font-semibold">阅读器有 {pendingReadingEntries.length} 个生词等待导入</p>
              <p className="text-sm mt-1">导入后会进入独立的“阅读生词本”，练习只需见英选义。</p>
              <button
                onClick={openReadingImportConfirmation}
                disabled={!currentUserId}
                className="mt-3 bg-emerald-600 hover:bg-emerald-700 disabled:bg-emerald-300 text-white font-semibold py-2 px-4 rounded-lg transition-colors"
              >
                {!currentUserId ? '请先连接阅读器账号' : '教师确认后导入'}
              </button>
            </div>
          )}

          {readingImportReview && (() => {
            const selectedEntries = readingImportReview.filter(entry => readingImportSelectedKeys.includes(normalizeReadingWord(entry.word)));
            return <div className="w-full max-w-lg mb-6 rounded-2xl border-2 border-sky-200 bg-sky-50 p-5 text-left text-sky-950">
              <div className="flex items-start justify-between gap-3"><div><h3 className="font-bold">教师确认导入</h3><p className="mt-1 text-sm">请勾选需要进入阅读生词本的词；未勾选的词不会导入。</p></div><button onClick={() => { setReadingImportReview(null); setReadingImportSelectedKeys([]); }} className="text-sm font-semibold underline">关闭</button></div>
              <div className="mt-3 flex flex-wrap gap-2"><button onClick={() => setReadingImportSelectedKeys(readingImportReview.map(entry => normalizeReadingWord(entry.word)))} className="rounded-lg border border-sky-300 bg-white px-3 py-1.5 text-sm font-semibold text-sky-800 hover:bg-sky-100">全选</button><button onClick={() => setReadingImportSelectedKeys([])} className="rounded-lg border border-sky-300 bg-white px-3 py-1.5 text-sm font-semibold text-sky-800 hover:bg-sky-100">清空</button><button onClick={reviewReadingInbox} disabled={isReadingFilterLoading} className="rounded-lg border border-sky-300 bg-white px-3 py-1.5 text-sm font-semibold text-sky-800 hover:bg-sky-100 disabled:opacity-50">{isReadingFilterLoading ? 'AI 分析中…' : 'AI 提供建议'}</button></div>
              <div className="mt-3 max-h-56 space-y-1 overflow-y-auto rounded-xl bg-white/80 p-3 text-sm">{readingImportReview.map(entry => { const key = normalizeReadingWord(entry.word); return <label key={key} className="flex cursor-pointer items-center gap-2 rounded-lg px-2 py-1.5 hover:bg-sky-100"><input type="checkbox" checked={readingImportSelectedKeys.includes(key)} onChange={() => setReadingImportSelectedKeys(previous => previous.includes(key) ? previous.filter(item => item !== key) : [...previous, key])} /><span className="font-semibold">{entry.word}</span><span className={entry.keep ? 'text-emerald-700' : 'text-gray-600'}>{entry.keep ? `AI 建议：${entry.reason}` : entry.reason}</span></label>; })}</div>
              <button disabled={!selectedEntries.length} onClick={() => importReadingInbox(selectedEntries)} className="mt-4 rounded-lg bg-emerald-600 px-4 py-2 font-bold text-white hover:bg-emerald-700 disabled:cursor-not-allowed disabled:bg-emerald-300">导入教师确认的 {selectedEntries.length} 词</button>
            </div>;
          })()}
          {readingFilterError && <p className="w-full max-w-lg mb-5 rounded-lg border border-amber-200 bg-amber-50 px-4 py-3 text-sm text-amber-800">{readingFilterError}</p>}

          {!currentUserId ? (
            <div className="w-full max-w-md mb-8 p-6 bg-white rounded-xl border-2 border-blue-100 shadow-sm">
