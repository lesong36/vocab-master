                    <div>
                      <span className="text-xs font-bold tracking-wider text-amber-700">背 面 · 想一想</span>
                      <h3 className="mt-2 text-3xl sm:text-4xl font-bold">{card.chinese_meaning}</h3>
                      <p className="mt-2 text-base font-mono text-amber-800">{card.english_word}{card.pos ? ` · ${card.pos}` : ''}</p>
                    </div>
                    <EyeOff className="text-amber-600 shrink-0" size={24} />
                  </div>
                  {mnemonicCards.get(mnemonicKey(card.section, card.english_word))?.dimensions ? <MnemonicDimensions key={`${card.section}-${card.english_word}`} card={mnemonicCards.get(mnemonicKey(card.section, card.english_word))} /> : <div className="mt-6 rounded-2xl bg-white/80 border border-amber-200 p-5">
                    <p className="text-xs font-bold text-amber-700 mb-2">💡 助记线索</p>
                    <p className="whitespace-pre-line leading-relaxed text-gray-700">{studyTip}</p>
                  </div>}
                  {card.source === 'reading' && card.exampleSentence && (
                    <div className="mt-4 rounded-2xl bg-indigo-50 border border-indigo-200 p-5">
                      <p className="text-xs font-bold text-indigo-700 mb-2">✨ AI 拓展例句</p>
                      <p className="leading-relaxed text-gray-800">{card.exampleSentence}</p>
                    </div>
                  )}
                  {card.source === 'reading' && card.etymology && (
                    <div className="mt-4 rounded-2xl bg-emerald-50 border border-emerald-200 p-5">
                      <p className="text-xs font-bold text-emerald-700 mb-2">🌱 AI 词源记忆</p>
                      <p className="leading-relaxed text-gray-700">{card.etymology}</p>
                    </div>
                  )}
                  {examples.length > 0 && (
                    <div className="mt-4 rounded-2xl bg-sky-50 border border-sky-200 p-5">
                      <p className="text-xs font-bold text-sky-700 mb-2">课文里这样说</p>
                      <p className="font-medium text-gray-800" dangerouslySetInnerHTML={{ __html: highlightLessonWord(examples[0].en, card.english_word) }} />
                      {examples[0].zh && <p className="mt-1 text-sm text-gray-500">{examples[0].zh}</p>}
                    </div>
                  )}
                  <button type="button" aria-label="显示英文单词" onClick={() => setFlashcardFlipped(false)} className="mt-6 w-full rounded-lg border border-amber-300 bg-white px-4 py-2 text-center text-sm font-semibold text-amber-800">翻回英文</button>
                </div>
              )}
            </div>

            <div className="mt-5 grid grid-cols-3 gap-3">
              <button onClick={() => moveFlashcard(-1)} disabled={flashcardIndex === 0} className="rounded-xl bg-gray-100 hover:bg-gray-200 disabled:opacity-40 text-gray-700 font-bold py-3 transition-colors">← 上一张</button>
              <button onClick={toggleFlashcardKnown} className={`rounded-xl font-bold py-3 transition-colors ${isKnown ? 'bg-emerald-600 hover:bg-emerald-700 text-white' : 'bg-emerald-50 hover:bg-emerald-100 text-emerald-700 border border-emerald-200'}`}>{isKnown ? '✓ 已会' : '我会了'}</button>
              <button onClick={() => moveFlashcard(1)} disabled={flashcardIndex === flashcardList.length - 1} className="rounded-xl bg-amber-500 hover:bg-amber-600 disabled:opacity-40 text-white font-bold py-3 transition-colors">下一张 →</button>
            </div>
            <button
              type="button"
              onClick={() => {
                playWordAudio(card.english_word, currentAudioUrl);
              }}
              className="mt-4 w-full rounded-xl border border-slate-200 bg-white hover:bg-slate-50 text-slate-600 font-medium py-2.5 flex items-center justify-center gap-2 transition-colors"
            >
              <Volume2 size={18} /> 听一听 {card.english_word}
            </button>
            <p className="mt-4 text-center text-xs text-gray-400">点击卡片或按空格翻面 · ← → 切换卡片 · “我会了”只记录本次复习</p>
          </div>
        );
      };

      const renderStudy = () => {
        const currentWord = studyList[currentIndex];
        if (!currentWord) return null;

        const recognitionMode = isRecognitionWord(currentWord);
        const progress = ((currentIndex) / studyList.length) * 100;
        const liveWord = words.find(w => w.id === currentWord.id) || currentWord;
        const mistakeMeta = isInMistakeBook(liveWord) ? getMistakeLevel(liveWord) : null;
        const exitProgress = isInMistakeBook(liveWord)
          ? (liveWord.consecutiveCorrect || 0)
          : 0;
        const justGraduated = feedback === 'correct' && liveWord.mistakeCleared && (liveWord.incorrectCount || 0) > 0;
        const choicesLocked = showHint || feedback === 'correct' || (feedback === 'incorrect' && selectedChoiceKey);
        const activeChoices = recognitionChoices;
        const showAnswered = feedback === 'correct' || feedback === 'incorrect' || showHint;
        const lessonExamples = showAnswered
          ? findLessonExamples(currentWord, lessonSentences)
          : [];
        const currentMnemonicCard = mnemonicCards.get(mnemonicKey(currentWord.section, currentWord.english_word));
        const unitStory = mnemonicStories.get(currentWord.section);
        const unitSpellingWords = words.filter(word => word.section === currentWord.section && mnemonicCards.has(mnemonicKey(word.section, word.english_word)));

        if (unitSpellingPractice && unitSpellingWords.length) {
          const { index, phase, input } = unitSpellingPractice;
          const target = unitSpellingWords[index];
          const card = mnemonicCards.get(mnemonicKey(target.section, target.english_word));
          const spellingWord = card.spellingParts
            ? card.spellingParts.map((part, partIndex) => <span key={partIndex} className={part.focus ? 'border-b-4 border-amber-300 text-amber-900' : ''}>{part.text}</span>)
            : target.english_word;
          const correct = matchesSpelling(input, target.english_word);
          const update = patch => setUnitSpellingPractice(previous => ({ ...previous, ...patch }));
          const move = direction => update({ index: Math.min(unitSpellingWords.length - 1, Math.max(0, index + direction)), phase: 'learn', input: '' });
          return (
            <section aria-label="单元拼写练习" className="max-w-xl mx-auto rounded-2xl border border-emerald-200 bg-white p-6 sm:p-8 shadow-sm">
              <div className="flex items-center justify-between text-sm text-gray-600">
                <span>{currentWord.section} · 拼写助记</span><span>{index + 1} / {unitSpellingWords.length}</span>
              </div>
              <div className="mt-3 h-1.5 rounded-full bg-emerald-50"><div className="h-full rounded-full bg-emerald-600" style={{ width: `${((index + 1) / unitSpellingWords.length) * 100}%` }} /></div>
              <h2 className="mt-8 text-center text-3xl font-bold text-gray-900">{target.chinese_meaning}</h2>
              {renderWordIPA(target)}
              {phase === 'learn' && (
                <div className="mt-6">
                  <p className="whitespace-pre-wrap text-center font-mono text-4xl font-bold tracking-wide text-emerald-900">{spellingWord}</p>
                  {card.spellingParts && <p className="mt-3 text-center text-sm text-gray-600">带下划线的字母要特别记住。</p>}
                  {!card.dimensions && <div className="mt-6 rounded-xl bg-emerald-50 p-5">
                    <h3 className="font-semibold text-emerald-900">记住这些字母</h3>
                    <p className="mt-2 whitespace-pre-line leading-7 text-gray-800">{card.spellingCue || card.hint}</p>
                    {card.spellingImage && <p className="mt-3 border-t border-emerald-200 pt-3 leading-7 text-gray-800">{card.spellingImage}</p>}
                  </div>}
                  <MnemonicDimensions key={`${target.section}-${target.english_word}`} card={card} onSpellPractice={() => update({ phase: 'recall', input: '' })} />
                  <button onClick={() => playWordAudio(target.english_word, target.audioUrl)} className="mt-4 w-full rounded-lg border border-gray-300 px-4 py-2 text-gray-700">听读音，指着字母读一遍</button>
                  <button onClick={() => update({ phase: 'recall', input: '' })} className="mt-4 w-full rounded-lg bg-emerald-700 px-4 py-3 font-semibold text-white">收起线索，写完整单词</button>
                </div>
              )}
              {phase === 'recall' && (
                <form className="mt-6 text-center" onSubmit={event => { event.preventDefault(); if (!input.trim()) return; playEncouragement(correct ? 'correct' : 'incorrect'); update({ phase: 'feedback' }); }}>
                  <p className="text-gray-600">按记住的字母顺序写，写完再核对。</p>
                  <input autoFocus aria-label="回忆本词拼写" autoComplete="off" autoCorrect="off" spellCheck={false} value={input} onChange={event => update({ input: event.target.value })} className="mt-6 w-full rounded-lg border-2 border-gray-300 p-3 text-center font-mono text-2xl focus:border-emerald-600 focus:outline-none" />
                  <button type="submit" disabled={!input.trim()} className="mt-4 w-full rounded-lg bg-emerald-700 px-4 py-3 font-semibold text-white disabled:opacity-40">写好了，核对字母</button>
                  <button type="button" onClick={() => update({ phase: 'learn', input: '' })} className="mt-4 text-gray-600 underline">再看一次拼写线索</button>
                </form>
              )}
              {phase === 'feedback' && (
                <div aria-live="polite" className="mt-6">
                  <p className="text-center font-semibold text-emerald-900">{correct ? '这次拼写正确。' : '找到需要改的字母，再试一次。'}</p>
                  <p className="mt-2 text-center text-xs text-gray-500">助记自查不计分。</p>
                  {!correct && <p className="mt-4 text-gray-600">你写的是：<span className="font-mono">{input}</span></p>}
                  <p className="mt-4 whitespace-pre-wrap text-center font-mono text-4xl font-bold text-emerald-900">{spellingWord}</p>
                  {!correct && <ul className="mt-4 space-y-1 text-center text-amber-900">{spellingDifferences(input, target.english_word).map((change, changeIndex) => <li key={changeIndex}>{change}</li>)}</ul>}
                  <div className="mt-5"><MnemonicSpellingGuide card={card} /></div><p className="mt-4 rounded-xl bg-emerald-50 p-4 leading-7 text-gray-800">{card.spellingCue || card.hint}</p>
                  <button onClick={() => update({ phase: 'recall', input: '' })} className="mt-5 w-full rounded-lg bg-emerald-700 px-4 py-3 font-semibold text-white">收起答案，再写一次</button>
                  <p className="mt-3 text-center text-sm text-gray-600">稍后再不看线索写一次。</p>
                </div>
              )}
              {phase !== 'recall' && (
                <div className="mt-6 flex justify-between gap-3">
                  <button disabled={index === 0} onClick={() => move(-1)} className="rounded-lg border border-gray-300 px-4 py-2 text-gray-700 disabled:opacity-40">上一词</button>
                  <button disabled={index === unitSpellingWords.length - 1} onClick={() => move(1)} className="rounded-lg border border-gray-300 px-4 py-2 text-gray-700 disabled:opacity-40">下一词</button>
                </div>
              )}
              <button onClick={() => setUnitSpellingPractice(null)} className="mt-8 block w-full text-center text-gray-600 underline">返回单词学习</button>
            </section>
          );
        }

        if (mnemonicRecallMode) {
          const spelling = mnemonicRecallMode === 'spell';
          const contextual = mnemonicRecallMode === 'context';
          const matches = matchesSpelling(mnemonicRecallInput, currentWord.english_word);
          const changeMode = (mode) => {
            setMnemonicRecallMode(mode);
            setMnemonicRecallInput('');
            setMnemonicRecallRevealed(false);
          };
          return (
            <section aria-label="助记回忆练习" className="max-w-xl mx-auto rounded-2xl border-2 border-emerald-200 bg-white p-6 sm:p-10 text-center shadow-sm">
              <h2 className="text-2xl font-bold text-emerald-900">收起线索，试着回忆</h2>
              <div className="mt-6 flex flex-wrap justify-center gap-3">
                <button aria-pressed={spelling} onClick={() => changeMode('spell')} className={`rounded-lg px-4 py-2 border ${spelling ? 'bg-emerald-700 text-white border-emerald-700' : 'border-gray-300 text-gray-700'}`}>看中文，写英文</button>
                <button aria-pressed={mnemonicRecallMode === 'read'} onClick={() => changeMode('read')} className={`rounded-lg px-4 py-2 border ${mnemonicRecallMode === 'read' ? 'bg-emerald-700 text-white border-emerald-700' : 'border-gray-300 text-gray-700'}`}>看英文，读一读</button>
                {currentMnemonicCard?.dimensions && <button aria-pressed={contextual} onClick={() => changeMode('context')} className={`rounded-lg px-4 py-2 border ${contextual ? 'bg-emerald-700 text-white border-emerald-700' : 'border-gray-300 text-gray-700'}`}>换个情境用一用</button>}
              </div>
              {contextual ? <p className="mt-8 rounded-xl bg-amber-50 p-5 text-left text-xl leading-8 text-stone-900">{currentMnemonicCard.dimensions.context.question}</p> : <p className="mt-8 text-4xl font-bold text-gray-900">{spelling ? currentWord.chinese_meaning : currentWord.english_word}</p>}
              {spelling && renderWordIPA(currentWord)}
              <p className="mt-4 text-gray-600">{contextual ? '先回答这个问题，可以说出来或写下来，再看参考。' : spelling ? '先自己写，写完再核对。' : '先读出这个词，再说出它的意思。'}</p>
              {spelling && (
                <form className="mt-6" onSubmit={(event) => { event.preventDefault(); if (!mnemonicRecallInput.trim() || mnemonicRecallRevealed) return; playEncouragement(matches ? 'correct' : 'incorrect'); setMnemonicRecallRevealed(true); }}>
                  <input autoFocus aria-label="回忆英文拼写" autoComplete="off" autoCorrect="off" spellCheck={false} value={mnemonicRecallInput} onChange={(event) => { setMnemonicRecallInput(event.target.value); setMnemonicRecallRevealed(false); }} className="w-full rounded-lg border-2 border-gray-300 p-3 text-center text-2xl font-mono focus:border-emerald-600 focus:outline-none" />
                  <button type="submit" disabled={!mnemonicRecallInput.trim() || mnemonicRecallRevealed} className="mt-4 rounded-lg bg-emerald-700 px-6 py-3 font-semibold text-white disabled:opacity-40">写好了，核对</button>
                </form>
              )}
              {contextual && <textarea aria-label="情境问题的回答" value={mnemonicRecallInput} onChange={event => { setMnemonicRecallInput(event.target.value); setMnemonicRecallRevealed(false); }} className="mt-6 min-h-24 w-full rounded-lg border-2 border-gray-300 p-3 text-left text-lg focus:border-emerald-600 focus:outline-none" />}
              {!spelling && !mnemonicRecallRevealed && <button onClick={() => setMnemonicRecallRevealed(true)} className="mt-6 rounded-lg bg-emerald-700 px-6 py-3 font-semibold text-white">{contextual ? '想好了，看参考用法' : '读好了，核对'}</button>}
              {mnemonicRecallRevealed && (
                <div aria-live="polite" className="mt-6 rounded-lg bg-emerald-50 p-5">
                  <p className="text-xl font-semibold text-emerald-900">{currentWord.english_word} · {currentWord.chinese_meaning}</p>
                  {spelling && <p className="mt-2 text-gray-700">{matches ? '拼写一致。过一会儿再试一次。' : '对照看看：哪些字母要补上或改一改？'}</p>}
                  {spelling && !matches && <ul className="mt-3 space-y-1 text-amber-900">{spellingDifferences(mnemonicRecallInput, currentWord.english_word).map((change, index) => <li key={index}>{change}</li>)}</ul>}
                  {spelling && <div className="mt-4 text-left"><MnemonicSpellingGuide card={currentMnemonicCard} /></div>}
                  {contextual && <><p className="mt-3 text-left leading-7 text-gray-800">{currentMnemonicCard.example}</p><p className="mt-3 text-left text-sm leading-6 text-gray-600">这是用法参考，表达可以不同。检查目标词的意思和句中用法，也请老师或家长帮你核对。</p></>}
                  <button onClick={() => playWordAudio(currentWord.english_word, currentAudioUrl)} className="mt-3 rounded-lg border border-emerald-300 px-4 py-2 text-emerald-900">听读音，跟读核对</button>
                  <button onClick={() => changeMode(mnemonicRecallMode)} className="ml-3 mt-3 rounded-lg border border-emerald-300 px-4 py-2 text-emerald-900">再试一次</button>
                </div>
              )}
              <button onClick={() => setMnemonicRecallMode('')} className="mt-8 text-gray-600 underline">返回助记线索</button>
            </section>
          );
        }

        const getChoiceClassName = (choice) => {
          if (showHint && choice.isCorrect) {
            return 'border-green-500 bg-green-50 text-green-800 ring-2 ring-green-200';
          }
          if (feedback === 'correct' && choice.key === selectedChoiceKey) {
            return 'border-green-500 bg-green-50 text-green-800';
          }
          if (feedback === 'incorrect' && choice.key === selectedChoiceKey) {
            return 'border-red-500 bg-red-50 text-red-800 animate-shake';
          }
          if (feedback === 'incorrect' && choice.isCorrect) {
            return 'border-green-500 bg-green-50 text-green-800';
          }
          if (selectedChoiceKey === choice.key) {
            return 'border-blue-500 bg-blue-50 text-blue-800';
          }
          return 'border-gray-200 bg-white hover:border-blue-300 hover:bg-blue-50 text-gray-800';
        };

        return (
          <div className="max-w-2xl mx-auto animate-fade-in">
            <button
              onClick={exitStudy}
              className="mb-4 text-sm text-blue-600 hover:text-blue-800 flex items-center gap-1 font-medium"
            >
              <ChevronLeft size={18} />
              返回 Unit 选择
            </button>

            {/* Progress Bar */}
            <div className="mb-6">
              <div className="flex justify-between text-sm text-gray-500 mb-2 font-medium">
                <span>进度 {currentIndex + 1} / {studyList.length}</span>
                <span>{currentWord.section}</span>
              </div>
              {mistakeMeta && (
                <div className="flex flex-wrap items-center gap-2 mb-2 text-xs">
                  <span className={`px-2 py-0.5 rounded border font-medium ${mistakeMeta.className}`}>
                    错题·{mistakeMeta.label}
                  </span>
                  <span className="text-gray-500">
                    移出进度：连续答对 {exitProgress}/{MISTAKE_EXIT_STREAK}
                  </span>
                </div>
              )}
              <div className="w-full bg-gray-200 rounded-full h-2.5">
                <div className="bg-blue-600 h-2.5 rounded-full transition-all duration-300" style={{ width: `${progress}%` }}></div>
              </div>
            </div>

            {renderRewardPanel(true)}
            {/* Word Card */}
            <div className="bg-white rounded-2xl shadow-xl border border-gray-100 p-8 text-center relative overflow-hidden">
              {/* Requirement Tag */}
              <div className={`absolute top-4 left-4 text-xs font-bold px-2 py-1 rounded ${
                recognitionMode ? 'bg-amber-100 text-amber-800' : 'bg-blue-100 text-blue-800'
              }`}>
                {recognitionMode ? '见英选义 · 四选一' : currentWord.learning_requirement}
              </div>
              
              <button 
                onClick={() => {
                  playWordAudio(currentWord.english_word, currentAudioUrl);
                }}
                className="absolute top-4 right-4 p-2 text-gray-400 hover:text-blue-600 hover:bg-blue-50 rounded-full transition-colors"
                title="播放发音"
              >
                <Volume2 size={24} />
              </button>

              {recognitionMode ? (
                <>
                  <div className="my-8 flex flex-col items-center">
                    <p className="text-sm text-gray-500 mb-3">请选择正确的中文含义</p>
                    <h3 className="text-4xl font-bold text-gray-800 mb-2 font-mono tracking-wide">{currentWord.english_word}</h3>
                    {renderWordIPA(currentWord)}
                    {showHint && (
                      <p className="text-sm text-green-600 font-medium mt-2 animate-fade-in">正确答案已高亮</p>
                    )}
                  </div>

                  {recognitionChoiceStatus === 'loading' ? (
                    <div className="mt-4 rounded-xl border border-sky-200 bg-sky-50 px-4 py-5 text-sm font-medium text-sky-800">正在进行 AI 唯一正确性审核，并在需要时重写选项…</div>
                  ) : recognitionChoiceStatus === 'rejected' ? (
                    <div className="mt-4 rounded-xl border border-amber-200 bg-amber-50 px-4 py-5 text-sm leading-6 text-amber-800">这道题无法生成四个含义明确、唯一正确的选项，已暂停出题以避免模棱两可。请使用提示学习后跳到下一词。</div>
                  ) : (
                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 mt-4">
                      {activeChoices.map(choice => (
                        <button
                          key={choice.key}
                          type="button"
                          onClick={() => handleChoiceSelect(choice)}
                          disabled={choicesLocked}
                          className={`text-left px-4 py-4 rounded-xl border-2 transition-all font-medium leading-snug ${getChoiceClassName(choice)} ${
                            choicesLocked ? 'cursor-default' : 'cursor-pointer'
                          }`}
                        >
                          {choice.text}
                        </button>
                      ))}
                    </div>
                  )}

                  {feedback === 'incorrect' && !showHint && (
                    <p className="text-sm text-amber-800 mt-4">看看绿色的正确含义，记住后再练一次。可点「不会 / 提示」或「下一个」继续。</p>
                  )}
                </>
              ) : (
                <>
                  <div className="my-8 flex flex-col items-center">
                    <h3 className="text-4xl font-bold text-gray-800 mb-2">{currentWord.chinese_meaning}</h3>
                    
                    {renderWordIPA(currentWord)}
                    
                    {showHint && (
                      <div className="text-2xl font-mono text-green-600 tracking-wider mb-4 animate-fade-in">
                        {currentWord.english_word}
                      </div>
                    )}
                  </div>

                  <form onSubmit={handleCheck} className="mt-8 relative">
                    <input
                      ref={inputRef}
                      type="text"
                      value={userInput}
                      onChange={(e) => setUserInput(e.target.value)}
                      placeholder="请输入英文拼写..."
                      autoCapitalize="none"
                      autoComplete="off"
                      disabled={showHint || feedback === 'correct'}
                      className={`w-full text-center text-2xl py-4 px-6 border-2 rounded-xl focus:outline-none transition-colors ${
                        feedback === 'correct' ? 'border-green-500 bg-green-50 text-green-700' : 
                        feedback === 'incorrect' ? 'border-red-500 bg-red-50 text-red-700 animate-shake' : 
                        'border-gray-300 focus:border-blue-500 bg-gray-50 font-mono'
                      }`}
                    />
                    
                    {/* Feedback Icons inside input */}
                    {feedback === 'correct' && <Check className="absolute right-4 top-1/2 -translate-y-1/2 text-green-500" size={28} />}
                    {feedback === 'incorrect' && <X className="absolute right-4 top-1/2 -translate-y-1/2 text-red-500" size={28} />}
                  </form>
                </>
              )}

              {rewardFeedback && (
                <div role="status" aria-live="polite" className={`mt-4 rounded-xl border px-4 py-3 text-sm leading-6 ${rewardFeedback.kind === 'incorrect' ? 'border-amber-200 bg-amber-50 text-amber-950' : 'border-emerald-200 bg-emerald-50 text-emerald-950'}`}>
                  <p className="font-semibold">{rewardFeedback.message}</p>
                  {rewardFeedback.points > 0 && <p className="mt-1 font-bold">★ +{rewardFeedback.points} 分</p>}
                </div>
              )}

              {justGraduated && (
                <p className="text-sm text-green-600 font-medium mt-3">已连续答对 {MISTAKE_EXIT_STREAK} 次，已从错题本移出</p>
              )}

              {/* 课文例句：答对 / 答错 / 看提示后显示 */}
              {showAnswered && lessonExamples.length > 0 && (
                <div className="mt-5 text-left animate-fade-in">
                  <div className="rounded-xl border border-sky-200 bg-sky-50 p-4 shadow-sm">
                    <h4 className="text-sky-800 font-bold mb-3 flex items-center gap-2">
                      <BookOpen size={18} />
                      课文例句
                      {lessonExamples[0]?.source && (
                        <span className="text-xs font-medium px-1.5 py-0.5 rounded bg-sky-200 text-sky-900">
                          {lessonExamples[0].source}
                        </span>
                      )}
                    </h4>
                    <ul className="space-y-3">
                      {lessonExamples.map((ex, idx) => (
                        <li key={`${ex.en}-${idx}`} className="leading-relaxed">
                          <p
                            className="text-gray-800 font-medium"
                            dangerouslySetInnerHTML={{
                              __html: highlightLessonWord(ex.en, currentWord.english_word),
                            }}
                          />
                          {ex.zh && (
                            <p className="text-sm text-gray-500 mt-1">{ex.zh}</p>
                          )}
                        </li>
                      ))}
                    </ul>
                  </div>
                </div>
              )}

              {/* Action Buttons */}
              <div className="mt-6 flex gap-3 justify-center w-full">
                {!recognitionMode && !showHint && feedback !== 'correct' ? (
                  <>
                    <button 
                      onClick={handleCheck}
                      className="flex-1 bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-lg shadow transition-colors"
                    >
                      提交答案 (Enter)
                    </button>
                    <button 
                      onClick={handleShowHint}
                      type="button"
                      className="px-6 bg-gray-100 hover:bg-gray-200 text-gray-700 font-bold py-3 rounded-lg transition-colors"
                    >
                      不会 / 提示
                    </button>
                  </>
                ) : recognitionMode && !showHint && feedback !== 'correct' ? (
                  <>
                    <button
                      onClick={handleNext}
                      type="button"
                      disabled={!feedback && !showHint}
                      className={`flex-1 font-bold py-3 rounded-lg shadow transition-colors ${
                        feedback === 'incorrect'
                          ? 'bg-green-600 hover:bg-green-700 text-white'
                          : 'bg-gray-100 text-gray-400 cursor-not-allowed'
                      }`}
                    >
                      下一个 (Enter) <ArrowRight size={20} className="inline ml-1" />
                    </button>
                    <button 
                      onClick={handleShowHint}
                      type="button"
                      className="px-6 bg-gray-100 hover:bg-gray-200 text-gray-700 font-bold py-3 rounded-lg transition-colors"
                    >
                      不会 / 提示
                    </button>
                  </>
                ) : (
                  <button 
                    onClick={handleNext}
                    type="button"
                    autoFocus
                    className="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-3 rounded-lg shadow transition-colors flex justify-center items-center gap-2"
                  >
                    下一个 (Enter) <ArrowRight size={20} />
                  </button>
                )}
              </div>
              
              {/* AI Hint Section */}
              <div className="mt-6">
                {!aiHintText && !isAILoading ? (
                  <button
                    onClick={handleAIHint}
                    className="w-full py-4 bg-purple-50 text-purple-700 hover:bg-purple-100 rounded-xl border border-purple-200 flex justify-center items-center gap-2 transition-colors font-semibold shadow-sm"
                  >
                    <Sparkles size={20} />
                    {currentMnemonicCard
                      ? '点击查看课本单词助记'
                      : '对这个词不熟悉？点击获取 AI 专属助记'}
                  </button>
                ) : (
                  <div className="bg-purple-50 border border-purple-200 rounded-xl p-6 text-left animate-fade-in relative shadow-sm">
                    <Sparkles className="absolute top-4 right-4 text-purple-300" size={24} />
                    <h4 className="text-purple-800 font-bold mb-2 flex items-center gap-2">
                      {isAILoading ? <Loader2 className="animate-spin" size={18}/> : <Sparkles size={18}/>}
                      单词助记
                      {!isAILoading && aiHintSource === 'library' && (
                        <span className="text-xs font-normal px-1.5 py-0.5 rounded bg-purple-200 text-purple-800">课本词库</span>
                      )}
                      {!isAILoading && aiHintSource === 'ai' && (
                        <span className="text-xs font-normal px-1.5 py-0.5 rounded bg-purple-200 text-purple-800">阅读器 AI</span>
                      )}
                      {!isAILoading && aiHintSource === 'local' && (
                        <span className="text-xs font-normal px-1.5 py-0.5 rounded bg-gray-200 text-gray-600">本地备用</span>
                      )}
                    </h4>
                    {!isAILoading && aiHintSource === 'library' && currentMnemonicCard?.dimensions ? <MnemonicDimensions key={`${currentWord.section}-${currentWord.english_word}`} card={currentMnemonicCard} onHear={() => playWordAudio(currentWord.english_word, currentAudioUrl)} onSpellPractice={() => { setMnemonicRecallMode('spell'); setMnemonicRecallInput(''); setMnemonicRecallRevealed(false); }} /> : <p className="text-gray-700 leading-relaxed whitespace-pre-line">
                      {isAILoading ? '正在生成助记内容...' : aiHintText}
                    </p>}
                    {!isAILoading && (
                      <button onClick={() => { setMnemonicRecallMode(currentMnemonicCard ? 'spell' : recognitionMode ? 'read' : 'spell'); setMnemonicRecallInput(''); setMnemonicRecallRevealed(false); }} className="mt-4 rounded-lg border border-purple-300 bg-white px-4 py-2 font-semibold text-purple-800">收起线索，试着回忆</button>
                    )}
                    {!isAILoading && aiHintSource === 'library' && currentMnemonicCard?.sourceUrl && (
                      <a href={currentMnemonicCard.sourceUrl} target="_blank" rel="noreferrer" className="mt-3 inline-block text-xs text-purple-700 underline">核对词源 →</a>
                    )}
                    {!isAILoading && aiHintError && (
                      <p className="mt-4 rounded-lg border border-amber-200 bg-amber-50 px-3 py-2 text-xs leading-5 text-amber-800">
                        阅读器 AI 请求失败，已改用本地备用助记：{aiHintError}。可点击右上角“阅读器账号”检查模型设置与 Key。
                      </p>
                    )}
                  </div>
                )}
                {showAnswered && unitSpellingWords.length > 0 && (
                  <div className="mt-4 rounded-xl border border-emerald-200 bg-emerald-50 p-4 text-left">
                    <h4 className="font-semibold text-emerald-900">本单元拼写助记</h4>
                    <p className="mt-2 text-sm text-gray-700">记字母组合和易错处，收起线索，写完整单词。</p>
                    <button onClick={() => setUnitSpellingPractice({ index: Math.max(0, unitSpellingWords.findIndex(word => word.id === currentWord.id)), phase: 'learn', input: '' })} className="mt-3 w-full rounded-lg bg-emerald-700 px-4 py-3 font-semibold text-white">练本单元拼写（{unitSpellingWords.length} 词）</button>
                  </div>
                )}
                {showAnswered && unitStory && (
                  <details key={currentWord.id} className="mt-4 rounded-xl border border-gray-200 bg-white p-4 text-left">
                    <summary className="cursor-pointer text-sm text-gray-600">课本词情境阅读</summary>
                    <div className="mt-4 space-y-4">
                      {unitStory.chapters.map((chapter, index) => (
                        <details key={index} className="rounded-lg border border-gray-200 p-3">
                          <summary className="cursor-pointer text-sm text-gray-700">第 {index + 1} 段</summary>
                          <p className="mt-2 leading-7 text-gray-800">{chapter.text}</p>
                        </details>
                      ))}
                    </div>
                  </details>
                )}
              </div>


            </div>
            
            {/* Live Stats */}
            <div className="mt-6 flex justify-center gap-6 text-sm text-gray-500">
              <span className="flex items-center gap-1"><Check size={16} className="text-green-500"/> 本次答对: {sessionStats.correct}</span>
              <span className="flex items-center gap-1"><X size={16} className="text-red-500"/> 本次错词: {sessionStats.incorrect}</span>
            </div>
          </div>
        );
      };

      const renderSummary = () => (
        <div className="max-w-2xl mx-auto text-center animate-fade-in">
          <div className="bg-white rounded-2xl shadow-xl border border-gray-100 p-10">
            <div className="w-20 h-20 bg-green-100 rounded-full flex items-center justify-center mx-auto mb-6">
              <Check size={40} className="text-green-600" />
            </div>
            <h2 className="text-3xl font-bold text-gray-800 mb-2">学习完成！</h2>
            <p className="text-gray-600 mb-8">你已经完成了本次选择的所有单词。学习记录已自动保存{serverAvailable ? `到 ${DATA_FILE_NAME}` : '到浏览器缓存'}。</p>
            {renderRewardPanel(true)}
            <p className="mb-6 text-sm text-amber-900">本次最高连续答对 {sessionReward.bestStreak} 题。每一次认真尝试都在帮你记牢单词。</p>
            
            <div className="grid grid-cols-2 gap-6 mb-10">
              <div className="bg-green-50 rounded-xl p-6 border border-green-100">
                <div className="text-green-800 text-sm font-bold mb-1">答对</div>
                <div className="text-4xl font-black text-green-600">{sessionStats.correct}</div>
              </div>
              <div className="bg-red-50 rounded-xl p-6 border border-red-100">
                <div className="text-red-800 text-sm font-bold mb-1">错词数</div>
                <div className="text-4xl font-black text-red-600">{sessionStats.incorrect}</div>
              </div>
            </div>

            <div className="flex flex-col sm:flex-row gap-4 justify-center">
              <button 
                onClick={() => setAppState('select')}
                className="flex-1 bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-6 rounded-lg shadow transition-colors flex justify-center items-center gap-2"
              >
                <RotateCcw size={20} />
                继续选择 Unit / 年级
              </button>
              <button 
                onClick={exportJSON}
                className="flex-1 bg-gray-800 hover:bg-gray-900 text-white font-bold py-3 px-6 rounded-lg shadow transition-colors flex justify-center items-center gap-2"
              >
                <FileJson size={20} />
                导出学习记录 (JSON)
              </button>
            </div>
          </div>
        </div>
      );

      return (
        <div className="min-h-screen bg-gray-50 text-gray-800 font-sans">
          {showReaderLogin && renderReaderLoginPanel()}

          <header className="bg-white border-b border-gray-200 shadow-sm px-6 py-4 mb-8 no-print">
            <div className="max-w-4xl mx-auto flex items-center justify-between gap-4">
              <h1 className="text-xl font-bold text-blue-700 flex items-center gap-2">
                <BookOpen size={24} />
                VocabMaster 单词达人
              </h1>

              <div className="flex items-center gap-3 flex-wrap justify-end">
                {serverAvailable && (
                  <span className="text-xs text-green-700 bg-green-50 border border-green-200 px-2 py-1 rounded-full">
                    {DATA_FILE_NAME}
                  </span>
                )}
                {saveStatus === 'saving' && (
                  <span className="text-xs text-gray-400 flex items-center gap-1">
                    <Loader2 size={14} className="animate-spin" /> 保存中
                  </span>
                )}
                {saveStatus === 'saved-file' && (
                  <span className="text-xs text-green-600 flex items-center gap-1">
                    <Save size={14} /> 已写入 {DATA_FILE_NAME}
                  </span>
                )}
                {saveStatus === 'saved-browser' && (
                  <span className="text-xs text-amber-600 flex items-center gap-1">
                    <Save size={14} /> 已缓存到浏览器
                  </span>
                )}
                {saveStatus === 'save-failed' && (
                  <span className="text-xs text-red-600 flex items-center gap-1">
                    <X size={14} /> 浏览器不允许保存；请关闭无痕浏览或允许此网站的数据存储
                  </span>
                )}

                <button
                  onClick={() => window.open('https://lesong36.github.io/reading/', '_blank', 'noopener')}
                  className="text-sm flex items-center gap-1.5 px-3 py-1.5 rounded-lg border border-indigo-300 bg-indigo-50 text-indigo-700 hover:bg-indigo-100 transition-colors"
                  title="打开 Readmaster 闹闹爱阅读"
                >
                  <BookOpen size={16} /> 打开 Readmaster
                </button>

                <button
                  onClick={() => setShowReaderLogin(true)}
                  className={`text-sm flex items-center gap-1.5 px-3 py-1.5 rounded-lg border transition-colors ${readerCloudUser ? 'border-emerald-300 bg-emerald-50 text-emerald-700' : 'border-blue-300 bg-blue-50 text-blue-700 hover:bg-blue-100'}`}
                  title={readerCloudUser ? `${cloudReadingStatus} ${readerAiStatus}` : '登录阅读器账号以同步阅读生词和 AI 设置'}
                >
                  <BookOpen size={16} />
                  {readerCloudUser ? `阅读器：${readerCloudUser.email}` : '连接阅读器账号'}
                </button>

                {readerCloudUser && (
                  <button
                    onClick={forceReaderCloudSync}
                    disabled={isForcingCloudSync}
                    className="text-sm flex items-center gap-1.5 px-3 py-1.5 rounded-lg border border-violet-300 bg-violet-50 text-violet-700 hover:bg-violet-100 disabled:opacity-60 transition-colors"
                    title="立即读取云端记录、合并历史档案并写回"
                  >
                    <RotateCcw size={16} className={isForcingCloudSync ? 'animate-spin' : ''} />
                    {isForcingCloudSync ? '同步中…' : '强制同步'}
                  </button>
                )}

                {pendingReadingEntries.length > 0 && (
                  <button onClick={openReadingImportConfirmation} className="text-sm px-3 py-1.5 rounded-lg bg-emerald-600 text-white hover:bg-emerald-700 transition-colors">
                    教师确认导入 ({pendingReadingEntries.length})
                  </button>
                )}

                {appState !== 'import' && appState !== 'print' && words.length > 0 && (
                  <button 
                    onClick={exportJSON}
                    className="text-sm flex items-center gap-1 text-gray-600 hover:text-blue-600 transition-colors"
                    title="导出当前用户学习记录 JSON"
                  >
                    <Download size={16} />
                    导出记录
                  </button>
                )}
              </div>
            </div>
          </header>

          <main className={`max-w-4xl mx-auto px-4 pb-12 ${appState === 'print' ? 'max-w-none print-main-container' : ''}`}>
            {readerCloudUser && appState !== 'print' && (
              <div className="mb-5 flex flex-wrap items-center justify-between gap-3 rounded-xl border border-violet-200 bg-violet-50 px-4 py-3 no-print">
                <div className="text-sm text-violet-900">
                  <span className="font-semibold">阅读器云同步已连接</span>
                  <span className="ml-2 text-violet-700">{cloudReadingStatus}</span>
                </div>
                <button
                  onClick={forceReaderCloudSync}
                  disabled={isForcingCloudSync}
                  className="inline-flex items-center gap-2 rounded-lg bg-violet-600 px-4 py-2 text-sm font-semibold text-white hover:bg-violet-700 disabled:bg-violet-300"
                >
                  <RotateCcw size={16} className={isForcingCloudSync ? 'animate-spin' : ''} />
                  {isForcingCloudSync ? '正在强制同步…' : '立即强制同步'}
                </button>
              </div>
            )}
            {!isHydrated ? (
              <div className="flex justify-center py-20 text-gray-400">
                <Loader2 className="animate-spin mr-2" size={20} />
                正在加载本地记录...
              </div>
            ) : (
              <>
                {appState === 'import' && renderImport()}
                {(appState === 'select' || appState === 'reading') && renderSelect()}
                {appState === 'study' && renderStudy()}
                {appState === 'flashcards' && renderFlashcards()}
                {appState === 'summary' && renderSummary()}
                {appState === 'print' && renderPrint()}
              </>
            )}
          </main>
          <audio ref={audioElementRef} preload="auto" playsInline aria-hidden="true" className="hidden" />

          <style dangerouslySetInnerHTML={{__html: `
            @keyframes shake {
              0%, 100% { transform: translateX(0); }
              25% { transform: translateX(-5px); }
              50% { transform: translateX(5px); }
              75% { transform: translateX(-5px); }
            }
            .animate-shake {
              animation: shake 0.4s ease-in-out;
            }
            @keyframes fadeIn {
              from { opacity: 0; transform: translateY(10px); }
              to { opacity: 1; transform: translateY(0); }
            }
            .animate-fade-in {
              animation: fadeIn 0.3s ease-out forwards;
            }

            /* 打印样式优化 */
            @media print {
              .animate-fade-in {
                animation: none !important;
                opacity: 1 !important;
              }
              @page {
                margin: 1cm;
                size: A4 portrait;
              }
              body {
                background-color: white !important;
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
              }
              .no-print {
                display: none !important;
              }
              .print-main-container {
                max-width: 100% !important;
                padding: 0 !important;
                margin: 0 !important;
              }
              .print-grid {
                grid-template-columns: repeat(3, 1fr) !important;
                align-items: start;
                gap: 1rem !important;
                padding-bottom: 0 !important;
              }
              .print-card {
                break-inside: avoid;
                page-break-inside: avoid;
                border-color: #000 !important;
              }
              .print-card > div:first-child,
              .print-card > div.bg-gray-50 {
                padding: .5rem;
              }
              .print-study-hint {
                font-size: .75rem;
                line-height: 1.5;
              }
              /* 防止阴影和圆角在旧打印机上变黑 */
              .shadow-xl, .shadow-md, .shadow-sm, .shadow {
                box-shadow: none !important;
              }
            }
          `}} />
        </div>
      );
    }

    createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
