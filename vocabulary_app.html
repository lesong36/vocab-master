          if (e.isComposing || e.altKey || e.ctrlKey || e.metaKey) return;
          if (e.key === ' ' || e.key === 'Enter') {
            e.preventDefault();
            setFlashcardFlipped(prev => !prev);
          } else if (e.key === 'ArrowRight') {
            e.preventDefault();
            setFlashcardIndex(prev => Math.min(prev + 1, flashcardList.length - 1));
            setFlashcardFlipped(false);
          } else if (e.key === 'ArrowLeft') {
            e.preventDefault();
            setFlashcardIndex(prev => Math.max(prev - 1, 0));
            setFlashcardFlipped(false);
          }
        };
        window.addEventListener('keydown', onKeyDown);
        return () => window.removeEventListener('keydown', onKeyDown);
      }, [appState, flashcardList.length]);

      useEffect(() => {
        const card = flashcardList[flashcardIndex];
        if (appState === 'flashcards' && card) {
          setCurrentPhonetic('');
          setCurrentAudioUrl('');
          fetchWordDataAndPlay(card.english_word, false);
        }
      }, [appState, flashcardIndex, flashcardList]);

      // Build 4-choice options for recognition-mode words
      useEffect(() => {
        if (appState !== 'study') return;
        const currentWord = studyList[currentIndex];
        if (!currentWord || !isRecognitionWord(currentWord)) {
          setRecognitionChoices([]);
          setSelectedChoiceKey(null);
          return;
        }
        setRecognitionChoices(buildRecognitionChoices(currentWord, wordsRef.current));
        setSelectedChoiceKey(null);
      }, [currentIndex, appState, studyList]);

      // Handle TTS Fallback
      const fallbackTTS = (text) => {
        if ('speechSynthesis' in window) {
          window.speechSynthesis.cancel();
          window.speechSynthesis.resume();
          const utterance = new SpeechSynthesisUtterance(text);
          utterance.lang = 'en-US';
          utterance.rate = 0.85; // 稍微放慢语速适合小学生
          
          const voices = window.speechSynthesis.getVoices();
          // 尽可能寻找标准的美国发音引擎 (优先 Google, 其次 Mac: Samantha, Win: Zira)
          const usVoice = voices.find(v => v.lang.startsWith('en-US') && v.name.includes('Google')) || 
                          voices.find(v => v.lang.startsWith('en-US') && (v.name.includes('Samantha') || v.name.includes('Zira') || v.name.includes('Salli'))) ||
                          voices.find(v => v.lang.startsWith('en-US'));
          
          if (usVoice) utterance.voice = usVoice;
          window.speechSynthesis.speak(utterance);
        }
      };

      // 词典接口偶尔不可用时，使用可跨域播放的在线朗读；浏览器 TTS 作为最后兜底。
      const getOnlineTTSUrl = (text) => (
        `https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl=en-US&q=${encodeURIComponent(text)}`
      );

      const getFallbackAudioUrl = (text) => (
        serverAvailableRef.current
          ? `/api/pronunciation?word=${encodeURIComponent(text)}`
          : getOnlineTTSUrl(text)
      );

      const isIOSDevice = () => (
        /iPad|iPhone|iPod/.test(navigator.userAgent)
        || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1)
      );

      const playWordAudio = (wordText, audioUrl = '') => {
        // iPad Safari 会拦截异步网络音频；点击当下直接调用系统朗读最可靠。
        if (isIOSDevice() && 'speechSynthesis' in window) {
          fallbackTTS(wordText);
          return;
        }
        const fallbackAudioUrl = getFallbackAudioUrl(wordText);
        const play = (url, canFallbackToOnline) => {
          if (audioPlayerRef.current) {
            audioPlayerRef.current.pause();
            audioPlayerRef.current.src = '';
          }
          const audio = new Audio(url);
          audio.preload = 'auto';
          audio.playsInline = true;
          audioPlayerRef.current = audio;
          let handled = false;
          const recover = () => {
            if (handled) return;
            handled = true;
            if (canFallbackToOnline) play(fallbackAudioUrl, false);
            else fallbackTTS(wordText);
          };
          // play() 有时会成功返回，但实际下载音频时才失败；两种情况都要兜底。
          audio.addEventListener('error', recover, { once: true });
          audio.addEventListener('stalled', recover, { once: true });
          audio.play().catch(recover);
        };
        play(audioUrl || fallbackAudioUrl, Boolean(audioUrl && audioUrl !== fallbackAudioUrl));
      };

      // Fetch real audio and phonetic from Dictionary API
      const fetchWordDataAndPlay = async (wordText, shouldPlay = true) => {
        const cleanWord = wordText.trim().toLowerCase();
        const isPhrase = cleanWord.includes(' ') || cleanWord.includes('-');
        const fallbackAudioUrl = getFallbackAudioUrl(wordText);
        const useLocalAudio = serverAvailableRef.current;

        // “开始学习”是一次用户点击：iPad 必须在这一同步时机发声，不能等 fetch 结束。
        if (shouldPlay && isIOSDevice() && 'speechSynthesis' in window) {
          setCurrentAudioUrl(fallbackAudioUrl);
          fallbackTTS(wordText);
          return;
        }

        // 本地服务可用时立即使用 Mac 英语语音，不等待外部词典接口。
        if (useLocalAudio) {
          setCurrentPhonetic('');
          setCurrentAudioUrl(fallbackAudioUrl);
          if (shouldPlay) playWordAudio(wordText, fallbackAudioUrl);
          return;
        }

        // 词典 API 不支持词组，如果是词组直接跳过请求，使用系统高质量 TTS
        if (!isPhrase) {
          try {
            const res = await fetch(`https://api.dictionaryapi.dev/api/v2/entries/en/${encodeURIComponent(cleanWord)}`);
            if (res.ok) {
              const data = await res.json();
              if (Array.isArray(data) && data.length > 0) {
                const entry = data[0];
                let phon = entry.phonetic || '';
                let aud = '';

                // 寻找带有音频和美式音标的数据
                if (entry.phonetics && entry.phonetics.length > 0) {
                  // 优先找美式发音的音频
                  const usAudioObj = entry.phonetics.find(p => p.audio && p.audio.includes('-us'));
                  aud = usAudioObj?.audio || entry.phonetics.find(p => p.audio)?.audio || '';

                  // 优先找美式音标文本
                  const textObjs = entry.phonetics.filter(p => p.text);
                  if (textObjs.length > 0) {
                    const usTextObj = textObjs.find(p => p.audio && p.audio.includes('-us'));
                    phon = usTextObj?.text || textObjs[0].text;
                  }
                }

                // 清理音标格式 (去掉自带的斜杠或括号，统一自己渲染)
                if (phon) {
                  phon = phon.replace(/[\/\[\]]/g, '');
                  // 修正维基词典中常见的不规范音标
                  phon = phon.replace('tʉː', 'tuː'); 
                }

                setCurrentPhonetic(phon);
                setCurrentAudioUrl(useLocalAudio ? fallbackAudioUrl : (aud || fallbackAudioUrl));

                if (shouldPlay && !useLocalAudio) {
                  playWordAudio(wordText, aud || fallbackAudioUrl);
                }
                return;
              }
            }
          } catch (error) {
            console.error("Dictionary API Error:", error);
          }
        }
        
        // 如果 API 失败、是词组、或找不到单词，保留在线朗读并使用浏览器 TTS 兜底。
        setCurrentPhonetic('');
        setCurrentAudioUrl(fallbackAudioUrl);
        if (shouldPlay && !useLocalAudio) playWordAudio(wordText, fallbackAudioUrl);
      };

      // --- AI Hint Logic (local fallback + optional server proxy) ---
      const buildLocalHint = (word) => {
        const en = word.english_word.trim();
        const cn = word.chinese_meaning.trim();
        const lower = en.toLowerCase();
        const lines = ['【联想记忆】'];

        if (lower.includes(' ')) {
          const parts = lower.split(/\s+/);
          lines.push(`「${en}」是词组，拆成 ${parts.map(p => `"${p}"`).join(' + ')} 来记，合在一起就是「${cn}」。`);
        } else if (lower.length <= 3) {
          lines.push(`短词 "${en}" 只有 ${lower.length} 个字母：${lower.split('').join(' · ').toUpperCase()} → ${cn}`);
        } else {
          const mid = Math.ceil(lower.length / 2);
          lines.push(`把 "${en}" 拆成 ${lower.slice(0, mid)} + ${lower.slice(mid)} 连读，联想「${cn}」。`);
        }

        if (lower.endsWith('ing')) lines.push('词尾 -ing 常表示「正在做某事」。');
        if (lower.endsWith('y') && lower.length > 3) lines.push('词尾 -y 常是形容词，描述「……的样子」。');
        if (lower.endsWith('ed')) lines.push('词尾 -ed 常表示「已经……了」。');

        lines.push('', '【例句】');
        lines.push(`I learn the word "${en}". It means ${cn}.`);
        lines.push(`我学习单词 "${en}"，它的意思是 ${cn}。`);
        lines.push('', '💡 本地助记（无需联网）。在 单词/ai_config.json 配置 API Key 后，重启服务可启用 AI 增强版。');
        return lines.join('\n');
      };

      const buildHintPrompt = (word) =>
        `你是一位超级有趣、富有想象力的小学英语老师。请给小学生设计一个非常生动、搞笑或奇妙的助记法（比如拆字联想、编小故事、谐音梗等，一定要符合儿童心理）来记住英文单词 "${word.english_word}" (中文意思: ${word.chinese_meaning})。然后再给出一个非常简单、小学生能看懂的英文例句及中文翻译。字数控制在150字以内。`;

      const fetchAIHintFromServer = async (prompt) => {
        const res = await fetch('/api/ai-hint', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ prompt }),
        });
        if (!res.ok) return null;
        const data = await res.json();
        return data.text?.trim() || null;
      };

      const generateHint = async (word) => {
        const prompt = buildHintPrompt(word);
        if (serverAvailableRef.current) {
          try {
            const aiText = await fetchAIHintFromServer(prompt);
            if (aiText) return { text: aiText, source: 'ai' };
          } catch {
            // fall through to local
          }
        }
        return { text: buildLocalHint(word), source: 'local' };
      };

      const handleAIHint = async () => {
        const currentWord = studyList[currentIndex];

        if (!showHint && feedback !== 'correct') {
          setShowHint(true);
          updateGlobalWordStats(currentWord.id, false);
          setSessionStats(prev => ({ ...prev, incorrect: prev.incorrect + 1 }));
        }

        setIsAILoading(true);
        setAiHintText('');
        setAiHintSource('');
        try {
          const { text, source } = await generateHint(currentWord);
          setAiHintText(text);
          setAiHintSource(source);
        } catch {
          setAiHintText(buildLocalHint(currentWord));
          setAiHintSource('local');
        } finally {
          setIsAILoading(false);
        }
      };
      // --- End AI Hint Logic ---

      // 1. Parser Logic for Markdown and CSV File
      const handleFileUpload = (e) => {
        setErrorMsg('');
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = (event) => {
          const text = event.target.result;
          const parsed = parseData(text);

          if (parsed.length > 0) {
            const merged = mergeWordStats(parsed, words);
            applyWordsToState(merged, file.name, selectedSections);
          } else {
            setErrorMsg('未能解析出有效的单词数据。请确保文件包含标准的 Markdown 表格或 CSV 格式，且列为: id, section, english_word, chinese_meaning, learning_requirement, pos（pos 可选）。');
          }
        };
        reader.readAsText(file);
        e.target.value = '';
      };

      // Handle JSON Learning Record Upload
      const handleJsonUpload = (e) => {
        setErrorMsg('');
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = (event) => {
          try {
            const parsed = JSON.parse(event.target.result);
            if (Array.isArray(parsed.entries)) {
              localStorage.setItem(READING_VOCAB_INBOX_KEY, JSON.stringify(parsed));
              setReadingInboxEntries(parsed.entries);
              setErrorMsg('已载入阅读生词本收件箱，请点击“导入阅读生词本”。');
              return;
            }
            if (Array.isArray(parsed) && parsed.length > 0 && parsed[0].hasOwnProperty('english_word') && parsed[0].hasOwnProperty('correctCount')) {
              applyWordsToState(parsed, file.name, selectedSections);
            } else {
              setErrorMsg('导入的 JSON 格式不符合要求，请确保是本软件导出的学习记录文件。');
            }
          } catch (err) {
            setErrorMsg('解析 JSON 文件失败，请检查文件是否损坏。');
          }
        };
        reader.readAsText(file);
        e.target.value = '';
      };

      // 2. Selection Logic
      const updateUserSelectionMeta = (patch) => {
        if (!currentUserId) return;
        setUsers(prev => ({
          ...prev,
          [currentUserId]: {
            ...prev[currentUserId],
            ...patch,
            updatedAt: new Date().toISOString(),
          },
        }));
      };

      const selectGrade = (grade) => {
        setSelectedGrade(grade);
        setErrorMsg('');
        updateUserSelectionMeta({ selectedGrade: grade });
      };

      const backToGradeList = () => {
        setSelectedGrade(null);
        setErrorMsg('');
        updateUserSelectionMeta({ selectedGrade: null });
      };

      const toggleSection = (section) => {
        const next = selectedSections.includes(section)
          ? selectedSections.filter(s => s !== section)
          : [...selectedSections, section];
        setSelectedSections(next);
        updateUserSelectionMeta({ selectedSections: next });
      };

      // Helper function to get the combined list of words selected
      const getWordsToStudy = () => {
        let filteredWords = [];
        const normalSections = selectedSections.filter(s => !isMistakeBookKey(s));

        if (normalSections.length > 0) {
          filteredWords = words.filter(w => normalSections.includes(w.section));
        }

        const existingIds = new Set(filteredWords.map(w => w.id));
        selectedSections.filter(isMistakeBookKey).forEach(key => {
          const grade = getMistakeBookGradeFromKey(key);
          getMistakeWords(words, grade).forEach(m => {
            if (!existingIds.has(m.id)) {
              filteredWords.push(m);
              existingIds.add(m.id);
            }
          });
        });
        return filteredWords;
      };

      const startStudy = () => {
        if (selectedSections.length === 0) {
          setErrorMsg('请至少选择一个 Section 或 错题本');
          return;
        }
        setErrorMsg('');
        
        const filteredWords = getWordsToStudy();

        // Optional: Shuffle the array for randomness
        const shuffled = [...filteredWords].sort(() => Math.random() - 0.5);
        setStudyList(shuffled);
        setCurrentIndex(0);
        setSessionStats({ correct: 0, incorrect: 0, mistakeWordIds: [] });
        setUserInput('');
        setFeedback(null);
        setShowHint(false);
        setSelectedChoiceKey(null);
        setRecognitionChoices([]);
        setCurrentPhonetic('');
        setCurrentAudioUrl('');
        setAppState('study');
        
        // Fetch and Auto-play first word pronunciation
        if (shuffled.length > 0) {
          fetchWordDataAndPlay(shuffled[0].english_word, true);
        }
      };

      const startPrintPreview = () => {
        if (selectedSections.length === 0) {
          setErrorMsg('请至少选择一个 Section 或 错题本以打印');
          return;
        }
        setErrorMsg('');
        const filteredWords = getWordsToStudy();
        setPrintList(filteredWords);
        setAppState('print');
      };

      const startFlashcards = () => {
        if (selectedSections.length === 0) {
          setErrorMsg('请至少选择一个 Section 或 错题本');
          return;
        }
        const cards = [...getWordsToStudy()].sort(() => Math.random() - 0.5);
        if (!cards.length) {
          setErrorMsg('所选词库暂时没有单词');
          return;
        }
        setErrorMsg('');
        setFlashcardList(cards);
        setFlashcardIndex(0);
        setFlashcardFlipped(false);
        setFlashcardKnownIds(cards.filter(card => card.flashcardKnown).map(card => card.id));
        setAppState('flashcards');
      };

      const moveFlashcard = (direction) => {
        setFlashcardIndex(prev => Math.max(0, Math.min(flashcardList.length - 1, prev + direction)));
        setFlashcardFlipped(false);
      };

      const toggleFlashcardKnown = () => {
        const card = flashcardList[flashcardIndex];
        if (!card) return;
        const nextKnown = !flashcardKnownIds.includes(card.id);
        setFlashcardKnownIds(prev => nextKnown ? [...prev, card.id] : prev.filter(id => id !== card.id));
        setWords(prevWords => prevWords.map(word => word.id === card.id
          ? { ...word, flashcardKnown: nextKnown, vocabMasterProgressUpdatedAt: new Date().toISOString() }
          : word));
      };

      const exitStudy = () => {
        if ('speechSynthesis' in window) {
          window.speechSynthesis.cancel();
        }
        setFeedback(null);
        setUserInput('');
        setShowHint(false);
        setAiHintText('');
        setAiHintSource('');
        setCurrentPhonetic('');
        setCurrentAudioUrl('');
        setAppState('select');
      };

      // 3. Study Logic
      const updateGlobalWordStats = (wordId, isCorrect) => {
        setWords(prevWords =>
          prevWords.map(w => {
            if (w.id !== wordId) return w;

            if (isCorrect) {
              const consecutiveCorrect = (w.consecutiveCorrect || 0) + 1;
              const hadMistakes = (w.incorrectCount || 0) > 0;
              const mistakeCleared = hadMistakes && !w.mistakeCleared && consecutiveCorrect >= MISTAKE_EXIT_STREAK
                ? true
                : (w.mistakeCleared || false);

              return {
                ...w,
                correctCount: (w.correctCount || 0) + 1,
                consecutiveCorrect,
                mistakeCleared,
                vocabMasterProgressUpdatedAt: new Date().toISOString(),
              };
            }

            return {
              ...w,
              incorrectCount: (w.incorrectCount || 0) + 1,
              consecutiveCorrect: 0,
              mistakeCleared: false,
              vocabMasterProgressUpdatedAt: new Date().toISOString(),
            };
          })
        );
      };

      const recordSessionMistake = (wordId) => {
        setSessionStats(prev => {
          if (prev.mistakeWordIds.includes(wordId)) return prev;
          return {
            ...prev,
            incorrect: prev.incorrect + 1,
            mistakeWordIds: [...prev.mistakeWordIds, wordId],
          };
        });
      };

      const handleCheck = (e) => {
        e.preventDefault();
        if (!userInput.trim() || showHint || feedback === 'correct') return;

        const currentWord = studyList[currentIndex];
        const isCorrect = userInput.trim().toLowerCase() === currentWord.english_word.trim().toLowerCase();

        if (isCorrect) {
          setFeedback('correct');
          updateGlobalWordStats(currentWord.id, true);
          setSessionStats(prev => ({ ...prev, correct: prev.correct + 1 }));

          const willGraduate = isInMistakeBook(currentWord)
            && (currentWord.consecutiveCorrect || 0) + 1 >= MISTAKE_EXIT_STREAK;
          const hasExamples = findLessonExamples(currentWord, lessonSentences).length > 0;

          // 有课文例句时留给孩子阅读，不再自动跳题
          if (!hasExamples) {
            setTimeout(() => {
              handleNext(willGraduate);
            }, willGraduate ? 1200 : 800);
          }
        } else if (feedback !== 'incorrect') {
          setFeedback('incorrect');
          updateGlobalWordStats(currentWord.id, false);
          recordSessionMistake(currentWord.id);
          // Let user try again or ask for hint
        }
      };

      const handleChoiceSelect = (choice) => {
        if (showHint || feedback === 'correct') return;
        if (selectedChoiceKey && feedback === 'incorrect') return;

        const currentWord = studyList[currentIndex];
        setSelectedChoiceKey(choice.key);

        if (choice.isCorrect) {
          setFeedback('correct');
          updateGlobalWordStats(currentWord.id, true);
          setSessionStats(prev => ({ ...prev, correct: prev.correct + 1 }));

          const willGraduate = isInMistakeBook(currentWord)
            && (currentWord.consecutiveCorrect || 0) + 1 >= MISTAKE_EXIT_STREAK;
          const hasExamples = findLessonExamples(currentWord, lessonSentences).length > 0;

          if (!hasExamples) {
            setTimeout(() => {
              handleNext(willGraduate);
            }, willGraduate ? 1200 : 900);
          }
        } else {
          setFeedback('incorrect');
          updateGlobalWordStats(currentWord.id, false);
          recordSessionMistake(currentWord.id);
        }
      };

      const handleNext = (graduatedFromMistakeBook = false) => {
        setFeedback(null);
        setUserInput('');
        setShowHint(false);
        setSelectedChoiceKey(null);
        setAiHintText('');
        setAiHintSource('');
        if (graduatedFromMistakeBook) {
          // brief pause already handled in handleCheck timeout
        }
        if (currentIndex < studyList.length - 1) {
          setCurrentIndex(currentIndex + 1);
          fetchWordDataAndPlay(studyList[currentIndex + 1].english_word, true);
        } else {
          setAppState('summary');
        }
      };

      const handleShowHint = () => {
        setShowHint(true);
        const currentWord = studyList[currentIndex];
        // 连续输错后再看提示，仍只记作这张卡的 1 次错词。
        if (feedback !== 'incorrect') {
          updateGlobalWordStats(currentWord.id, false);
          recordSessionMistake(currentWord.id);
        }
      };

      // 4. Export Logic
      const exportJSON = () => {
        const dataStr = JSON.stringify(words, null, 2);
        const dataUri = 'data:application/json;charset=utf-8,'+ encodeURIComponent(dataStr);
        const userLabel = currentUser?.name ? currentUser.name.replace(/\s+/g, '_') : 'user';
        const exportFileDefaultName = `vocabulary_${userLabel}_${new Date().toISOString().slice(0, 10)}.json`;

        const linkElement = document.createElement('a');
        linkElement.setAttribute('href', dataUri);
        linkElement.setAttribute('download', exportFileDefaultName);
        linkElement.click();
      };

      const exportAllUsersJSON = () => {
        const payload = {
          version: STORAGE_VERSION,
          exportedAt: new Date().toISOString(),
          currentUserId,
          users,
        };
        const dataStr = JSON.stringify(payload, null, 2);
        const dataUri = 'data:application/json;charset=utf-8,'+ encodeURIComponent(dataStr);
        const linkElement = document.createElement('a');
        linkElement.setAttribute('href', dataUri);
        linkElement.setAttribute('download', `vocabmaster_all_users_${new Date().toISOString().slice(0, 10)}.json`);
        linkElement.click();
      };

      const handleImportAllUsersJSON = (e) => {
        setErrorMsg('');
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = (event) => {
          try {
            const parsed = JSON.parse(event.target.result);
            if (parsed.users && typeof parsed.users === 'object') {
              setUsers(parsed.users);
              const uid = parsed.currentUserId && parsed.users[parsed.currentUserId]
                ? parsed.currentUserId
                : Object.keys(parsed.users)[0];
              switchUser(uid);
            } else {
              setErrorMsg('导入的用户备份格式不正确。');
            }
          } catch {
            setErrorMsg('解析用户备份 JSON 失败。');
          }
        };
        reader.readAsText(file);
        e.target.value = '';
      };

      const renderUserPanel = () => (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/40 no-print">
          <div className="bg-white rounded-2xl shadow-2xl border border-gray-100 w-full max-w-md p-6 animate-fade-in">
            <div className="flex items-center justify-between mb-6">
              <h3 className="text-lg font-bold text-gray-800 flex items-center gap-2">
                <User size={20} className="text-blue-600" />
                用户管理
              </h3>
              <button
                onClick={() => setShowUserPanel(false)}
                className="text-gray-400 hover:text-gray-600 p-1"
              >
                <X size={20} />
              </button>
            </div>

            <div className="space-y-2 mb-6 max-h-60 overflow-y-auto">
              {Object.values(users).map(user => (
                <div
                  key={user.id}
                  className={`flex items-center justify-between p-3 rounded-xl border-2 transition-all ${
                    user.id === currentUserId
                      ? 'border-blue-600 bg-blue-50'
                      : 'border-gray-200 bg-white hover:border-blue-200'
                  }`}
                >
                  <button
                    onClick={() => switchUser(user.id)}
                    className="flex-1 text-left"
                  >
                    <div className="font-semibold text-gray-800">{user.name}</div>
                    <div className="text-xs text-gray-500 mt-0.5">
                      {user.words?.length || 0} 词
                      {user.selectedGrade ? ` · ${user.selectedGrade}` : ''}
                      {user.selectedSections?.length ? ` · ${user.selectedSections.filter(s => !isMistakeBookKey(s)).length} Unit` : ''}
                      {user.selectedSections?.filter(isMistakeBookKey).length ? ` · ${user.selectedSections.filter(isMistakeBookKey).length} 错题本` : ''}
                    </div>
                  </button>
                  {Object.keys(users).length > 1 && (
                    <button
                      onClick={() => {
                        if (window.confirm(`确定删除用户「${user.name}」及其学习记录吗？`)) {
                          deleteUser(user.id);
                        }
                      }}
                      className="ml-2 p-2 text-red-400 hover:text-red-600 hover:bg-red-50 rounded-lg"
                      title="删除用户"
                    >
                      <Trash2 size={16} />
                    </button>
                  )}
                </div>
              ))}
            </div>

            <form
              onSubmit={(e) => {
                e.preventDefault();
                createUser(newUserName);
              }}
              className="flex gap-2 mb-4"
            >
              <input
                type="text"
                value={newUserName}
                onChange={(e) => setNewUserName(e.target.value)}
                placeholder="新用户名，如：小明"
                className="flex-1 px-4 py-2 border-2 border-gray-200 rounded-lg focus:outline-none focus:border-blue-500"
              />
              <button
                type="submit"
                className="bg-blue-600 hover:bg-blue-700 text-white font-semibold px-4 py-2 rounded-lg flex items-center gap-1"
              >
                <UserPlus size={18} />
                添加
              </button>
            </form>

            <p className="text-xs text-gray-500">
              每位用户独立保存词库、Section 选择与对错记录。使用 vocab_server.py 启动时，数据写入本地 {DATA_FILE_NAME}。
            </p>
          </div>
        </div>
      );

      // --- UI Components ---

      const renderImport = () => (
        <div className="flex flex-col items-center justify-center py-12 text-center animate-fade-in">
          <div className="bg-blue-50 p-6 rounded-full mb-6">
            <BookOpen size={48} className="text-blue-600" />
          </div>
          <h2 className="text-2xl font-bold text-gray-800 mb-4">开始背单词</h2>

          <div className={`w-full max-w-lg mb-6 p-4 rounded-xl border text-sm ${
            serverAvailable
              ? 'bg-green-50 border-green-200 text-green-800'
              : IS_FILE_PROTOCOL
                ? 'bg-red-50 border-red-200 text-red-800'
                : 'bg-amber-50 border-amber-200 text-amber-800'
          }`}>
            {serverAvailable ? (
              <p>
                本地文件模式已启用：学习记录自动写入
                <code className="mx-1 px-1.5 py-0.5 bg-white/70 rounded">{DATA_FILE_NAME}</code>
              </p>
            ) : IS_FILE_PROTOCOL ? (
              <div className="text-left space-y-2">
                <p className="font-semibold">当前是直接双击 HTML 打开的，浏览器不允许写入本地 JSON 文件。</p>
                <p>请改用同目录下的启动器（效果等同于「一键打开 app」）：</p>
                <p>
                  <code className="px-1.5 py-0.5 bg-white/70 rounded">启动单词.command</code>
                  <span className="text-red-700"> ← 双击这个文件</span>
                </p>
                <p className="text-xs opacity-80">启动后会自动打开浏览器，学习记录写入 {DATA_FILE_NAME}。现在只能暂存于浏览器缓存。</p>
              </div>
            ) : (
              <p>
                当前仅浏览器缓存。请在终端运行
                <code className="mx-1 px-1.5 py-0.5 bg-white/70 rounded">python3 vocab_server.py</code>
                后访问页面，才能自动保存到本地 JSON 文件。
              </p>
            )}
          </div>

          <p className="w-full max-w-lg mb-4 text-xs text-gray-500">
            阅读器云同步：{cloudReadingStatus}
            <a className="ml-2 text-blue-600 hover:underline" href="https://lesong36.github.io/reading/" target="_blank" rel="noreferrer">登录阅读器账号</a>
          </p>

          {pendingReadingEntries.length > 0 && (
            <div className="w-full max-w-lg mb-6 p-4 rounded-xl border border-emerald-200 bg-emerald-50 text-emerald-900">
              <p className="font-semibold">阅读器有 {pendingReadingEntries.length} 个生词等待导入</p>
              <p className="text-sm mt-1">导入后会进入独立的“阅读生词本”，练习只需见英选义。</p>
              <button
                onClick={importReadingInbox}
                disabled={!currentUserId}
                className="mt-3 bg-emerald-600 hover:bg-emerald-700 disabled:bg-emerald-300 text-white font-semibold py-2 px-4 rounded-lg transition-colors"
              >
                {currentUserId ? '导入阅读生词本' : '请先创建用户'}
              </button>
            </div>
          )}

          {!currentUserId ? (
            <div className="w-full max-w-md mb-8 p-6 bg-white rounded-xl border-2 border-blue-100 shadow-sm">
              <p className="text-gray-600 mb-4">请先创建用户，系统将自动保存你的 Section 选择与学习记录到本地 JSON。</p>
              <form
                onSubmit={(e) => {
                  e.preventDefault();
                  createUser(newUserName || '默认用户');
                }}
                className="flex gap-2"
              >
                <input
                  type="text"
                  value={newUserName}
                  onChange={(e) => setNewUserName(e.target.value)}
                  placeholder="输入用户名"
                  className="flex-1 px-4 py-3 border-2 border-gray-200 rounded-lg focus:outline-none focus:border-blue-500"
                />
                <button
                  type="submit"
                  className="bg-blue-600 hover:bg-blue-700 text-white font-semibold px-5 py-3 rounded-lg flex items-center gap-1"
                >
                  <UserPlus size={18} />
                  创建
                </button>
              </form>
            </div>
          ) : (
            <>
              <p className="text-gray-600 mb-2 max-w-md">
                当前用户：<span className="font-semibold text-blue-700">{currentUser?.name}</span>
                {currentUser?.vocabSource && (
                  <span className="text-gray-400"> · 词库来源：{currentUser.vocabSource}</span>
                )}
              </p>
              <p className="text-gray-600 mb-8 max-w-md">
                请导入词表，或通过 <code className="bg-gray-100 px-1 rounded text-sm">vocab_server.py</code> 启动后自动加载 <code className="bg-gray-100 px-1 rounded text-sm">词库.md</code>。<br/>
                数据需包含至少5列：<br/>
                <code className="bg-gray-100 px-2 py-1 rounded text-sm text-pink-600 mt-2 inline-block">id, section, english_word, chinese_meaning, learning_requirement, pos</code>
              </p>

              <div className="flex flex-col sm:flex-row gap-4 mb-6">
                <label className="cursor-pointer bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 px-8 rounded-lg shadow-md transition-colors flex items-center gap-2">
                  <Upload size={20} />
                  导入新词表 (.md / .csv / .txt)
                  <input type="file" accept=".md,.csv,.txt" className="hidden" onChange={handleFileUpload} />
                </label>

                <label className="cursor-pointer bg-green-600 hover:bg-green-700 text-white font-semibold py-3 px-8 rounded-lg shadow-md transition-colors flex items-center gap-2">
                  <History size={20} />
                  恢复学习记录 (.json)
                  <input type="file" accept=".json" className="hidden" onChange={handleJsonUpload} />
                </label>
              </div>

              <div className="flex flex-col sm:flex-row gap-3 text-sm">
                <label className="cursor-pointer text-gray-600 hover:text-blue-600 flex items-center justify-center gap-1">
                  <Download size={16} />
                  导入全部用户备份
                  <input type="file" accept=".json" className="hidden" onChange={handleImportAllUsersJSON} />
                </label>
                {Object.keys(users).length > 0 && (
                  <button
                    onClick={exportAllUsersJSON}
                    className="text-gray-600 hover:text-blue-600 flex items-center justify-center gap-1"
                  >
                    <FileJson size={16} />
                    导出全部用户备份
                  </button>
                )}
              </div>
            </>
          )}

          {errorMsg && (
            <div className="mt-6 p-4 bg-red-50 text-red-600 rounded-lg max-w-md border border-red-200 w-full">
              {errorMsg}
            </div>
          )}
        </div>
      );

      const renderSelect = () => {
        const allMistakeStats = countMistakeByLevel(words);
        const gradeMistakeStats = selectedGrade ? countMistakeByLevel(words, selectedGrade) : null;
        const selectedWordCount = getWordsToStudy().length;
        const grades = getGradesFromSections(sections);
        const gradeSections = selectedGrade ? getSectionsForGrade(sections, selectedGrade) : [];
        const selectedUnitCount = selectedGrade
          ? gradeSections.filter(s => selectedSections.includes(s)).length
          : 0;
        const selectedMistakeCount = selectedSections.filter(isMistakeBookKey).length;

        const renderMistakeLevelBadges = (stats) => (
          <div className="flex flex-wrap gap-1 mt-2">
            {stats.level1 > 0 && (
              <span className="text-xs px-1.5 py-0.5 rounded bg-orange-100 text-orange-700">偶错 {stats.level1}</span>
            )}
            {stats.level2 > 0 && (
              <span className="text-xs px-1.5 py-0.5 rounded bg-amber-100 text-amber-700">需巩固 {stats.level2}</span>
            )}
            {stats.level3 > 0 && (
              <span className="text-xs px-1.5 py-0.5 rounded bg-red-100 text-red-700">重点 {stats.level3}</span>
            )}
          </div>
        );

        const renderMistakeBookCard = (grade = null) => {
          const stats = grade ? countMistakeByLevel(words, grade) : allMistakeStats;
          if (stats.total === 0) return null;

          const key = getMistakeBookKey(grade);
          const isSelected = selectedSections.includes(key);
          const title = grade ? `${grade} 错题本` : '全部错题本';

          return (
            <button
              key={key}
              onClick={() => toggleSection(key)}
              className={`p-4 rounded-xl border-2 text-left transition-all ${
                isSelected
                  ? 'border-red-600 bg-red-50 text-red-800 font-semibold shadow-sm'
                  : 'border-red-200 bg-white text-red-600 hover:border-red-300'
              }`}
            >
              <div className="flex justify-between items-center">
                <span className="font-bold">⚠️ {title}</span>
                {isSelected && <Check size={18} className="text-red-600" />}
              </div>

        const justGraduated = feedback === 'correct' && liveWord.mistakeCleared && (liveWord.incorrectCount || 0) > 0;

          ? recognitionChoices

          : [];

          if (showHint && choice.isCorrect) {
            return 'border-green-500 bg-green-50 text-green-800 ring-2 ring-green-200';

            return 'border-green-500 bg-green-50 text-green-800';
          }

            return 'border-red-500 bg-red-50 text-red-800 animate-shake';

          if (feedback === 'incorrect' && choice.isCorrect) {
            return 'border-green-500 bg-green-50 text-green-800';

            return 'border-blue-500 bg-blue-50 text-blue-800';

                      <div className="text-xl text-gray-500 mb-4 font-mono font-medium tracking-wide">

                    {showHint && (

                    {/* Feedback Icons inside input */}
                    {feedback === 'correct' && <Check className="absolute right-4 top-1/2 -translate-y-1/2 text-green-500" size={28} />}
                    {feedback === 'incorrect' && <X className="absolute right-4 top-1/2 -translate-y-1/2 text-red-500" size={28} />}
                  </form>
                </>
              )}

              {justGraduated && (
                <p className="text-sm text-green-600 font-medium mt-3">已连续答对 {MISTAKE_EXIT_STREAK} 次，已从错题本移出</p>
              )}

              {/* 课文例句：答对 / 答错 / 看提示后显示 */}
              {showAnswered && lessonExamples.length > 0 && (
                <div className="mt-5 text-left animate-fade-in">
                  <div className="rounded-xl border border-sky-200 bg-sky-50 p-4 shadow-sm">
                    <h4 className="text-sky-800 font-bold mb-3 flex items-center gap-2">
                      <BookOpen size={18} />
                      课文例句
                      {lessonExamples[0]?.source && (
                        <span className="text-xs font-medium px-1.5 py-0.5 rounded bg-sky-200 text-sky-900">
                          {lessonExamples[0].source}
                        </span>
                      )}
                    </h4>
                    <ul className="space-y-3">
                      {lessonExamples.map((ex, idx) => (
                        <li key={`${ex.en}-${idx}`} className="leading-relaxed">
                          <p
                            className="text-gray-800 font-medium"
                            dangerouslySetInnerHTML={{
                              __html: highlightLessonWord(ex.en, currentWord.english_word),
                            }}
                          />
                          {ex.zh && (
                            <p className="text-sm text-gray-500 mt-1">{ex.zh}</p>
                          )}
                        </li>
                      ))}
                    </ul>
                  </div>
                </div>
              )}

              {/* Action Buttons */}
              <div className="mt-6 flex gap-3 justify-center w-full">
                {!recognitionMode && !showHint && feedback !== 'correct' ? (
                  <>
                    <button 
                      onClick={handleCheck}
                      className="flex-1 bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-lg shadow transition-colors"
                    >
                      提交答案 (Enter)
                    </button>
                    <button 
                      onClick={handleShowHint}
                      type="button"
                      className="px-6 bg-gray-100 hover:bg-gray-200 text-gray-700 font-bold py-3 rounded-lg transition-colors"
                    >
                      不会 / 提示
                    </button>
                  </>
                ) : recognitionMode && !showHint && feedback !== 'correct' ? (
                  <>
                    <button
                      onClick={handleNext}
                      type="button"
                      disabled={!feedback && !showHint}
                      className={`flex-1 font-bold py-3 rounded-lg shadow transition-colors ${
                        feedback === 'incorrect'
                          ? 'bg-green-600 hover:bg-green-700 text-white'
                          : 'bg-gray-100 text-gray-400 cursor-not-allowed'
                      }`}
                    >
                      下一个 (Enter) <ArrowRight size={20} className="inline ml-1" />
                    </button>
                    <button 
                      onClick={handleShowHint}
                      type="button"
                      className="px-6 bg-gray-100 hover:bg-gray-200 text-gray-700 font-bold py-3 rounded-lg transition-colors"
                    >
                      不会 / 提示
                    </button>
                  </>
                ) : (
                  <button 
                    onClick={handleNext}
                    type="button"
                    autoFocus
                    className="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-3 rounded-lg shadow transition-colors flex justify-center items-center gap-2"
                  >
                    下一个 (Enter) <ArrowRight size={20} />
                  </button>
                )}
              </div>
              
              {/* AI Hint Section */}
              <div className="mt-6">
                {!aiHintText && !isAILoading ? (
                  <button
                    onClick={handleAIHint}
                    className="w-full py-4 bg-purple-50 text-purple-700 hover:bg-purple-100 rounded-xl border border-purple-200 flex justify-center items-center gap-2 transition-colors font-semibold shadow-sm"
                  >
                    <Sparkles size={20} />
                    对这个词不熟悉？点击获取 AI 专属助记
                  </button>
                ) : (
                  <div className="bg-purple-50 border border-purple-200 rounded-xl p-6 text-left animate-fade-in relative shadow-sm">
                    <Sparkles className="absolute top-4 right-4 text-purple-300" size={24} />
                    <h4 className="text-purple-800 font-bold mb-2 flex items-center gap-2">
                      {isAILoading ? <Loader2 className="animate-spin" size={18}/> : <Sparkles size={18}/>}
                      智能助记
                      {!isAILoading && aiHintSource === 'ai' && (
                        <span className="text-xs font-normal px-1.5 py-0.5 rounded bg-purple-200 text-purple-800">AI</span>
                      )}
                      {!isAILoading && aiHintSource === 'local' && (
                        <span className="text-xs font-normal px-1.5 py-0.5 rounded bg-gray-200 text-gray-600">本地</span>
                      )}
                    </h4>
                    <p className="text-gray-700 leading-relaxed whitespace-pre-line">
                      {isAILoading ? '正在生成助记内容...' : aiHintText}
                    </p>
                  </div>
                )}
              </div>
            </div>
            
            {/* Live Stats */}
            <div className="mt-6 flex justify-center gap-6 text-sm text-gray-500">
              <span className="flex items-center gap-1"><Check size={16} className="text-green-500"/> 本次答对: {sessionStats.correct}</span>
              <span className="flex items-center gap-1"><X size={16} className="text-red-500"/> 本次错词: {sessionStats.incorrect}</span>
            </div>
          </div>
        );
      };

      const renderSummary = () => (
        <div className="max-w-2xl mx-auto text-center animate-fade-in">
          <div className="bg-white rounded-2xl shadow-xl border border-gray-100 p-10">
            <div className="w-20 h-20 bg-green-100 rounded-full flex items-center justify-center mx-auto mb-6">
              <Check size={40} className="text-green-600" />
            </div>
            <h2 className="text-3xl font-bold text-gray-800 mb-2">学习完成！</h2>
            <p className="text-gray-600 mb-8">你已经完成了本次选择的所有单词。学习记录已自动保存{serverAvailable ? `到 ${DATA_FILE_NAME}` : '到浏览器缓存'}。</p>
            
            <div className="grid grid-cols-2 gap-6 mb-10">
              <div className="bg-green-50 rounded-xl p-6 border border-green-100">
                <div className="text-green-800 text-sm font-bold mb-1">答对</div>
                <div className="text-4xl font-black text-green-600">{sessionStats.correct}</div>
              </div>
              <div className="bg-red-50 rounded-xl p-6 border border-red-100">
                <div className="text-red-800 text-sm font-bold mb-1">错词数</div>
                <div className="text-4xl font-black text-red-600">{sessionStats.incorrect}</div>
              </div>
            </div>

            <div className="flex flex-col sm:flex-row gap-4 justify-center">
              <button 
                onClick={() => setAppState('select')}
                className="flex-1 bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-6 rounded-lg shadow transition-colors flex justify-center items-center gap-2"
              >
                <RotateCcw size={20} />
                继续选择 Unit / 年级
              </button>
              <button 
                onClick={exportJSON}
                className="flex-1 bg-gray-800 hover:bg-gray-900 text-white font-bold py-3 px-6 rounded-lg shadow transition-colors flex justify-center items-center gap-2"
              >
                <FileJson size={20} />
                导出学习记录 (JSON)
              </button>
            </div>
          </div>
        </div>
      );

      return (
        <div className="min-h-screen bg-gray-50 text-gray-800 font-sans">
          {showUserPanel && renderUserPanel()}
          {showReaderLogin && renderReaderLoginPanel()}

          <header className="bg-white border-b border-gray-200 shadow-sm px-6 py-4 mb-8 no-print">
            <div className="max-w-4xl mx-auto flex items-center justify-between gap-4">
              <h1 className="text-xl font-bold text-blue-700 flex items-center gap-2">
                <BookOpen size={24} />
                VocabMaster 单词达人
              </h1>

              <div className="flex items-center gap-3 flex-wrap justify-end">
                {serverAvailable && (
                  <span className="text-xs text-green-700 bg-green-50 border border-green-200 px-2 py-1 rounded-full">
                    {DATA_FILE_NAME}
                  </span>
                )}
                {saveStatus === 'saving' && (
                  <span className="text-xs text-gray-400 flex items-center gap-1">
                    <Loader2 size={14} className="animate-spin" /> 保存中
                  </span>
                )}
                {saveStatus === 'saved-file' && (
                  <span className="text-xs text-green-600 flex items-center gap-1">
                    <Save size={14} /> 已写入 {DATA_FILE_NAME}
                  </span>
                )}
                {saveStatus === 'saved-browser' && (
                  <span className="text-xs text-amber-600 flex items-center gap-1">
                    <Save size={14} /> 已缓存到浏览器
                  </span>
                )}

                <button
                  onClick={() => setShowReaderLogin(true)}
                  className={`text-sm flex items-center gap-1.5 px-3 py-1.5 rounded-lg border transition-colors ${readerCloudUser ? 'border-emerald-300 bg-emerald-50 text-emerald-700' : 'border-blue-300 bg-blue-50 text-blue-700 hover:bg-blue-100'}`}
                  title={readerCloudUser ? cloudReadingStatus : '登录阅读器账号以同步阅读生词'}
                >
                  <BookOpen size={16} />
                  {readerCloudUser ? `阅读器：${readerCloudUser.email}` : '连接阅读器账号'}
                </button>

                {pendingReadingEntries.length > 0 && (
                  <button onClick={importReadingInbox} className="text-sm px-3 py-1.5 rounded-lg bg-emerald-600 text-white hover:bg-emerald-700 transition-colors">
                    导入阅读生词本 ({pendingReadingEntries.length})
                  </button>
                )}

                <button
                  onClick={() => setShowUserPanel(true)}
                  className="text-sm flex items-center gap-1.5 px-3 py-1.5 rounded-lg border border-gray-200 hover:border-blue-300 hover:bg-blue-50 text-gray-700 transition-colors"
                  title="切换用户"
                >
                  <User size={16} />
                  {currentUser?.name || '选择学习者'}
                </button>

                {appState !== 'import' && appState !== 'print' && words.length > 0 && (
                  <button 
                    onClick={exportJSON}
                    className="text-sm flex items-center gap-1 text-gray-600 hover:text-blue-600 transition-colors"
                    title="导出当前用户学习记录 JSON"
                  >
                    <Download size={16} />
                    导出记录
                  </button>
                )}
              </div>
            </div>
          </header>

          <main className={`max-w-4xl mx-auto px-4 pb-12 ${appState === 'print' ? 'max-w-none print-main-container' : ''}`}>
            {!isHydrated ? (
              <div className="flex justify-center py-20 text-gray-400">
                <Loader2 className="animate-spin mr-2" size={20} />
                正在加载本地记录...
              </div>
            ) : (
              <>
                {appState === 'import' && renderImport()}
                {appState === 'select' && renderSelect()}
                {appState === 'study' && renderStudy()}
                {appState === 'flashcards' && renderFlashcards()}
                {appState === 'summary' && renderSummary()}
                {appState === 'print' && renderPrint()}
              </>
            )}
          </main>

          <style dangerouslySetInnerHTML={{__html: `
            @keyframes shake {
              0%, 100% { transform: translateX(0); }
              25% { transform: translateX(-5px); }
              50% { transform: translateX(5px); }
              75% { transform: translateX(-5px); }
            }
            .animate-shake {
              animation: shake 0.4s ease-in-out;
            }
            @keyframes fadeIn {
              from { opacity: 0; transform: translateY(10px); }
              to { opacity: 1; transform: translateY(0); }
            }
            .animate-fade-in {
              animation: fadeIn 0.3s ease-out forwards;
            }

            /* 打印样式优化 */
            @media print {
              @page {
                margin: 1cm;
                size: A4 portrait;
              }
              body {
                background-color: white !important;
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
              }
              .no-print {
                display: none !important;
              }
              .print-main-container {
                max-width: 100% !important;
                padding: 0 !important;
                margin: 0 !important;
              }
              .print-grid {
                grid-template-columns: repeat(3, 1fr) !important;
                gap: 1rem !important;
                padding-bottom: 0 !important;
              }
              .print-card {
                break-inside: avoid;
                page-break-inside: avoid;
                border-color: #000 !important;
              }
              /* 防止阴影和圆角在旧打印机上变黑 */
              .shadow-xl, .shadow-md, .shadow-sm, .shadow {
                box-shadow: none !important;
              }
            }
          `}} />
        </div>
      );
    }

    createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
