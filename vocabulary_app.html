<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VocabMaster 单词达人</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    html, body, #root {
      min-height: 100%;
    }
    body {
      margin: 0;
      background: #f9fafb;
    }

</head>
<body>
  <div id="root"></div>

  <script type="text/babel" data-type="module">
    import React, { useState, useEffect, useMemo, useRef } from 'https://esm.sh/react@18.2.0';
    import { createRoot } from 'https://esm.sh/react-dom@18.2.0/client?deps=react@18.2.0';
    import { createClient } from 'https://esm.sh/@supabase/supabase-js@2?bundle';
    import { Upload, Play, Check, X, Download, BookOpen, Volume2, ArrowRight, RotateCcw, FileJson, Sparkles, Loader2, History, Printer, User, Save, ChevronLeft, GraduationCap, Layers, Eye, EyeOff, KeyRound, LogOut } from 'https://esm.sh/lucide-react@0.468.0?deps=react@18.2.0';

    const STORAGE_KEY = 'vocabmaster_app_data';
    const STORAGE_VERSION = 1;
    const DATA_API = '/api/vocab-data';
    const DATA_FILE_NAME = 'vocab_data.json';
    const READING_VOCAB_INBOX_KEY = 'vocabmaster_reader_inbox_v1';
    const READING_VOCAB_SECTION = '阅读生词本';
    const READER_SUPABASE_URL = 'https://faeixgpjhnwpfzfkgjsu.supabase.co';
    const READER_SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_vg-bfePJ4OSgoOOiMEJeCg_7YxdAdkx';
    const readerSupabase = createClient(READER_SUPABASE_URL, READER_SUPABASE_PUBLISHABLE_KEY, {
      auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true }
    });
    const SYNC_VAULT_VERSION = 1;
    const textEncoder = new TextEncoder();
    const textDecoder = new TextDecoder();
    const base64ToBytes = (value) => Uint8Array.from(atob(value), char => char.charCodeAt(0));
    const deriveSyncVaultKey = async (passphrase, salt) => {
      const material = await crypto.subtle.importKey('raw', textEncoder.encode(passphrase), 'PBKDF2', false, ['deriveKey']);
      return crypto.subtle.deriveKey(
        { name: 'PBKDF2', salt, iterations: 310000, hash: 'SHA-256' },
        material,
        { name: 'AES-GCM', length: 256 },
        false,
        ['decrypt']
      );
    };
    const decryptFromSyncVault = async (payload, passphrase) => {
      if (!payload || payload.v !== SYNC_VAULT_VERSION) throw new Error('不支持的加密数据版本');
      const key = await deriveSyncVaultKey(passphrase, base64ToBytes(payload.salt));
      const plaintext = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: base64ToBytes(payload.iv) }, key, base64ToBytes(payload.ciphertext));
      return textDecoder.decode(plaintext);
    };
    const IS_FILE_PROTOCOL = window.location.protocol === 'file:';
    const GRADE_ORDER = ['三上', '三下', '四上', '四下', '五上', '五下', 'KET', '音乐', 'RFD1', 'RFD2', 'RFD3', 'RFD4', 'RFD5', 'RFD6'];
    const HIDDEN_GRADES = new Set(['KET', '音乐', 'RFD1', 'RFD2', 'RFD3', 'RFD4', 'RFD5', 'RFD6']);
    const isHiddenGrade = (grade) => HIDDEN_GRADES.has(grade);
    const LESSON_TEXT_FILES = ['./四上英语课文.md', './四上英语课文_英文.md'];
    const MNEMONIC_FILES = ['./mnemonics/grade3.json', './mnemonics/grade4.json', './mnemonics/grade5.json'];
    const MAX_LESSON_EXAMPLES = 3;
    const mnemonicKey = (section, word) => `${section}\u0000${word.trim().toLowerCase()}`;

    const normalizeLessonText = (text) =>
      (text || '')
        .replace(/[\u2018\u2019]/g, "'")
        .replace(/[\u201C\u201D]/g, '"')
        .replace(/\u2026/g, '...')
        .toLowerCase();

    const hasChinese = (text) => /[\u4e00-\u9fff]/.test(text || '');

    const parseLessonText = (raw) => {
      const lines = (raw || '').split(/\r?\n/).map(line => line.trim());
      const sentences = [];
      let unit = '';
      let lesson = '';
      let lessonTitle = '';

      for (let i = 0; i < lines.length; i++) {
        const line = lines[i];
        if (!line) continue;

        const unitMatch = line.match(/^#\s*(U\d+)\b(.*)$/i);
        if (unitMatch) {
          unit = unitMatch[1].toUpperCase();
          lesson = '';
          lessonTitle = '';
          continue;
        }

        const lessonMatch = line.match(/^##\s*(L\d+)\b\s*(.*)$/i);
        if (lessonMatch) {
          lesson = lessonMatch[1].toUpperCase();
          lessonTitle = (lessonMatch[2] || '').trim();
          continue;
        }

        if (line.startsWith('#')) continue;
        if (hasChinese(line)) continue;

        let zh = '';
        if (i + 1 < lines.length && hasChinese(lines[i + 1])) {
          zh = lines[i + 1];
          i += 1;
        }

        sentences.push({
          en: line,
          zh,
          unit,
          lesson,
          lessonTitle,
          source: [unit, lesson].filter(Boolean).join(' '),
        });
      }

      return sentences;
    };

    const getPreferredLessonUnit = (section) => {
      const match = (section || '').match(/Unit\s*(\d+)/i);
      return match ? `U${match[1]}` : '';
    };

    const sentenceContainsWord = (sentence, wordText) => {
      const word = normalizeLessonText(wordText).trim();
      const hay = normalizeLessonText(sentence);
      if (!word || !hay) return false;

      if (word.includes(' ')) {
        const phrase = word.replace(/\s+/g, '\\s+');
        return new RegExp(phrase, 'i').test(hay);
      }

      const escaped = word.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
      const pattern = new RegExp(
        `(^|[^a-z0-9])${escaped}(?:'s|s|es|ed|ing|er|est)?(?![a-z0-9])`,
        'i'
      );
      return pattern.test(hay);
    };

    const findLessonExamples = (word, lessonSentences, limit = MAX_LESSON_EXAMPLES) => {
      // 阅读生词独立于课文词库，同形词不应附带课文例句并阻断自动跳题。
      if (!word || word.source === 'reading' || word.section === READING_VOCAB_SECTION || !lessonSentences?.length) return [];
      const preferredUnit = getPreferredLessonUnit(word.section);
      const matched = lessonSentences.filter(s => sentenceContainsWord(s.en, word.english_word));
      const sameUnit = preferredUnit
        ? matched.filter(s => (s.unit || '').toUpperCase() === preferredUnit)
        : [];
      const ranked = (sameUnit.length ? sameUnit : matched);
      const seen = new Set();
      const unique = [];
      for (const item of ranked) {
        const key = normalizeLessonText(item.en);
        if (seen.has(key)) continue;
        seen.add(key);
        unique.push(item);
        if (unique.length >= limit) break;
      }
      return unique;
    };

    const highlightLessonWord = (sentence, wordText) => {
      const word = (wordText || '').trim();
      if (!sentence || !word) return sentence;

      if (word.includes(' ')) {
        const parts = word.split(/\s+/).map(p => p.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'));
        const re = new RegExp(`(${parts.join('\\s+')})`, 'ig');
        return String(sentence).replace(re, '<mark class="bg-amber-200 text-amber-900 px-0.5 rounded">$1</mark>');
      }

      const escaped = word.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
      const re = new RegExp(`\\b(${escaped}(?:'s|s|es|ed|ing|er|est)?)\\b`, 'ig');
      return String(sentence).replace(re, '<mark class="bg-amber-200 text-amber-900 px-0.5 rounded">$1</mark>');
    };

    const parseSectionMeta = (section) => {
      const match = section.match(/^(.+?)(Unit .+)$/);
      if (match) {
        return { grade: match[1].trim(), unitLabel: match[2], full: section };
      }
      return { grade: section, unitLabel: '全部', full: section };
    };

    const isRecognitionWord = (word) => (
      (word?.learning_requirement || '').includes('见到英文') ||
      (word?.learning_requirement || '').includes('见英文')
    );

    const hasAuditedRecognitionChoices = (word) => {
      const choices = word?.recognition_choices;
      return Array.isArray(choices)
        && choices.length === 4
        && choices.filter(choice => choice?.isCorrect === true).length === 1
        && choices.every(choice => typeof choice?.text === 'string' && choice.text.trim());
    };

    const normalizeMeaning = (text) => (text || '').trim();

    const POS_CANON = {
      'n.': 'n', noun: 'n',
      'v.': 'v', verb: 'v',
      'adj.': 'adj', adjective: 'adj',
      'adv.': 'adv', adverb: 'adv',
      'det.': 'det', determiner: 'det',
      'pron.': 'pron', pronoun: 'pron',
      'prep.': 'prep', preposition: 'prep',
      'conj.': 'conj', conjunction: 'conj',
      'num.': 'num', number: 'num',
      'phr.': 'phr', phrase: 'phr',
    };

    const getWordPos = (word) => {
      const raw = (word?.pos || '').trim().toLowerCase();
      if (!raw) return '';
      return POS_CANON[raw] || raw.replace(/\.$/, '');
    };

    const POS_LABEL_ZH = {
      n: '名词', v: '动词', adj: '形容词', adv: '副词',
      det: '限定词', pron: '代词', prep: '介词', conj: '连词',
      num: '数词', phr: '短语',
    };

    const buildCardStudyTip = (word, reviewedCard = null) => {
      if (reviewedCard?.hint) return reviewedCard.hint;
      return '尚无专属线索。先听标准读音，指着字母跟读；收起答案，试着读和写，再核对漏写或写错的字母。';
    };

    const getMnemonicLetterParts = (word, focus = []) => {
      const cues = [...new Set(focus.filter(cue => cue && word.includes(cue)))].sort((a, b) => b.length - a.length);
      const parts = [];
      for (let index = 0; index < word.length;) {
        const cue = cues.find(item => word.startsWith(item, index));
        const text = cue || word[index];
        const highlighted = Boolean(cue);
        const last = parts[parts.length - 1];
        if (last && last.focus === highlighted) last.text += text;
        else parts.push({ text, focus: highlighted });
        index += text.length;
      }
      return parts;
    };

    const hasMnemonicPicture = (card) => Boolean(card?.dimensions?.visual?.diagram)
      || ['in', 'on', 'under', 'behind', 'next to', 'sorry', 'would', 'dessert', 'meatball'].includes(card?.word?.toLowerCase());

    const hasMnemonicMorphology = (card) => Boolean(card?.dimensions?.morphology
      && card.dimensions.morphology.kind !== 'none' && card.dimensions.morphology.parts.length);

    const hasMnemonicSemantic = (card) => Boolean(card?.dimensions?.semantic?.trim());

    const MnemonicPicture = ({ card, compact = false }) => {
      if (!hasMnemonicPicture(card)) return null;
      const visual = card.dimensions.visual;
      const word = card.word.toLowerCase();
      const spatial = ['in', 'on', 'under', 'behind', 'next to'].includes(word);
      const specialPicture = spatial || ['sorry', 'would', 'dessert', 'meatball'].includes(word);
      return (
        <figure className={`m-0 rounded-xl border border-amber-200 bg-amber-50 ${compact ? 'p-3' : 'p-5'}`}>
          <p className="mb-3 text-xs font-semibold text-amber-900">{visual.diagram ? ({ spelling: '跟着读音，记字母顺序', combine: '找组成', compare: '辨一辨', change: '看变化', sequence: '看先后', parts: '找组成', position: '找位置', count: '数一数、找顺序', colour: '看颜色', body: '认部位', clock: '读钟面', family: '认亲属关系', measure: '比一比', reference: '看对象与关系', deixis: '近远与单复数', motion: '看起点和去向', frequency: '看发生次数', timeline: '在时间线上找位置', selection: '看选中范围', shape: '只比较轮廓', category: '找同一类的例子', partition: '从整体看部分', feature: '看结构和作用' })[visual.diagram.kind] : '看具体图解'}</p>
          {visual.diagram ? (
            <MnemonicGraphic diagram={visual.diagram} card={card} compact={compact} />
          ) : specialPicture ? (
            <svg role="img" aria-label={`${card.word} 的视觉线索`} viewBox="0 0 320 130" className={`mx-auto w-full ${compact ? 'max-w-[200px]' : 'max-w-xs'}`}>
              {word === 'in' && <>
                <rect x="78" y="24" width="164" height="88" rx="8" fill="#fce3ae" stroke="#9a5b2a" strokeWidth="3" />
                <text x="160" y="88" textAnchor="middle" fontSize="48">✏️</text>
              </>}
              {(word === 'on' || word === 'under') && <>
                {word === 'on' && <text x="160" y="60" textAnchor="middle" fontSize="44">📚</text>}
                <path d={`M70 ${word === 'on' ? 64 : 36} H250 M85 ${word === 'on' ? 64 : 36} V118 M235 ${word === 'on' ? 64 : 36} V118`} fill="none" stroke="#9a5b2a" strokeWidth="6" strokeLinecap="round" />
                {word === 'under' && <text x="160" y="106" textAnchor="middle" fontSize="46">🐈</text>}
              </>}
              {word === 'behind' && <>
                <text x="160" y="67" textAnchor="middle" fontSize="56">🧸</text>
                <rect x="98" y="46" width="124" height="69" rx="6" fill="#f5c779" stroke="#9a5b2a" strokeWidth="3" />
                <path d="M98 69 H222 M160 46 V69" stroke="#9a5b2a" strokeWidth="2" />
              </>}
              {word === 'next to' && <>
                {[106, 194].map(x => <g key={x}>
                  <text x={x} y="74" textAnchor="middle" fontSize="48">🧒</text>
                  <path d={`M${x - 31} 83 H${x + 31} M${x - 24} 83 V117 M${x + 24} 83 V117`} stroke="#9a5b2a" strokeWidth="4" fill="none" />
                </g>)}
              </>}
              {word === 'sorry' && <>
                {[90, 200].map(x => <g key={x} transform={`translate(${x},12)`}>
                  <circle cx="30" cy="15" r="11" fill="#f5c779" />
                  <path d="M14 46 L43 32 L62 47" fill="none" stroke="#9a5b2a" strokeWidth="5" strokeLinecap="round" />
                  <text x="3" y="101" fill="#9a5b2a" fontSize="85" fontFamily="Georgia, serif" fontWeight="bold">r</text>
                </g>)}
              </>}
              {word === 'would' && <>
                {['w', 'ou', 'l', 'd'].map((text, index) => <g key={text}>
                  <rect x={12 + index * 78} y="34" width="62" height="65" rx="12" fill={text === 'l' ? '#fff' : '#fce3ae'} stroke="#9a5b2a" strokeDasharray={text === 'l' ? '5 4' : undefined} />
                  <text x={43 + index * 78} y="80" textAnchor="middle" fill="#784621" fontSize="34" fontFamily="Georgia, serif">{text}</text>
                  {text === 'l' && <text x="199" y="23" textAnchor="middle" fill="#784621" fontSize="16">不发音</text>}
                </g>)}
              </>}
              {word === 'dessert' && <>
                {[70, 195].map(x => <g key={x} transform={`translate(${x},15)`}>
                  <path d="M4 55 Q-4 33 17 30 Q16 8 38 13 Q59 8 58 30 Q78 34 71 55 Z" fill="#edb7a5" stroke="#9a5b2a" strokeWidth="2" />
                  <path d="M8 55 L18 105 H58 L68 55 Z" fill="#f5c779" stroke="#9a5b2a" strokeWidth="2" />
                  <text x="38" y="92" textAnchor="middle" fill="#784621" fontSize="40" fontFamily="Georgia, serif">s</text>
                </g>)}
              </>}
              {word === 'meatball' && <>
                <path d="M30 47 Q38 21 80 31 Q126 35 104 79 Q70 108 36 84 Z" fill="#edb7a5" stroke="#9a5b2a" strokeWidth="3" />
                <path d="M45 53 Q70 35 91 49 M47 72 Q68 57 84 72" fill="none" stroke="#fff4e3" strokeWidth="5" />
                <path d="M138 62 H185 L176 54 M185 62 L176 70" fill="none" stroke="#9a5b2a" strokeWidth="3" />
                <circle cx="249" cy="60" r="35" fill="#b67b4b" stroke="#784621" strokeWidth="3" />
                <circle cx="239" cy="50" r="4" fill="#784621" /><circle cx="259" cy="69" r="4" fill="#784621" />
                <text x="72" y="121" textAnchor="middle" fill="#784621" fontSize="16">肉</text>
                <text x="249" y="121" textAnchor="middle" fill="#784621" fontSize="16">搓成球</text>
              </>}
            </svg>
          ) : null}
          {!visual.diagram && visual.focus.length > 0 && <p aria-label="字形线索" className={`mt-2 whitespace-pre-wrap text-center font-mono font-bold text-stone-800 ${compact ? 'text-xl' : 'text-3xl'}`}>
            {getMnemonicLetterParts(card.word, visual.focus).map((part, index) => part.focus
              ? <mark key={index} className="rounded bg-amber-200 px-0.5 text-amber-950 underline decoration-amber-600 decoration-2 underline-offset-4">{part.text}</mark>
              : <span key={index}>{part.text}</span>)}
          </p>}
          <figcaption className={`mt-3 text-stone-700 ${compact ? 'text-xs leading-5' : 'text-sm leading-6'}`}>{visual.caption}</figcaption>
        </figure>
      );
    };

    const MnemonicGraphic = ({ diagram, card, compact }) => {
      const { kind } = diagram;
      const svgClass = `mx-auto w-full ${compact ? 'max-w-[190px]' : 'max-w-xs'}`;
      let content;
      if (kind === 'spelling') {
        const rows = compact && diagram.segments.some(segment => segment.text.trim().length >= 5 || segment.sound.length >= 7);
        content = <div aria-label="读音与字母分段" className={`grid gap-2 ${rows ? 'grid-cols-1' : diagram.segments.length === 2 ? 'grid-cols-2' : diagram.segments.length === 4 ? 'grid-cols-2 sm:grid-cols-4' : 'grid-cols-3'}`}>
          {diagram.segments.map((segment, index) => <div key={index} className={`min-w-0 rounded-lg border ${rows ? 'grid grid-cols-2 gap-x-1 px-2 py-1' : 'px-1 py-2'} text-center ${segment.stressed ? 'border-amber-500 bg-amber-100' : 'border-amber-200 bg-white'}`}>
            <p className={`font-mono font-bold text-stone-800 ${compact ? rows ? 'text-sm' : 'text-base' : 'text-xl sm:text-2xl'}`}>
              {getMnemonicLetterParts(segment.text, segment.focus || []).map((part, item) => part.focus
                ? <mark key={item} className="rounded bg-amber-300 text-amber-950 underline decoration-amber-700 underline-offset-4">{part.text}</mark>
                : <span key={item}>{part.text}</span>)}
            </p>
            <p className={`${rows ? 'self-center break-all' : 'mt-2'} font-mono text-xs text-stone-700`}>{segment.sound}</p>
            <p className={`${rows ? 'col-span-2' : 'mt-1'} text-xs leading-5 text-stone-600`}>{segment.note}</p>
          </div>)}
        </div>;
      } else if (diagram.panels) {
        const linear = ['sequence', 'parts'].includes(kind);
        const longLabel = diagram.panels.some(panel => panel.label.length > 6);
        const stacked = linear || diagram.panels.some(panel => panel.label.split(/\s+/).some(token => token.length > 12)) || (compact && (kind !== 'combine' || longLabel));
        const responsive = !stacked && longLabel;
        const cols = stacked ? 'grid-cols-1' : responsive ? 'grid-cols-1 sm:grid-cols-[minmax(0,1fr)_auto_minmax(0,1fr)]' : 'grid-cols-[minmax(0,1fr)_auto_minmax(0,1fr)]';
        const connector = kind === 'combine' || kind === 'parts' ? '＋' : kind === 'compare' ? '／' : '→';
        content = <>
          {kind === 'parts' && <p className={`mb-3 break-words text-center font-mono font-bold ${compact ? 'text-base' : 'text-xl'}`}>{diagram.result}</p>}
          <div className={`grid ${cols} items-center gap-x-2 ${compact ? 'gap-y-1' : 'gap-y-3'}`}>
            {diagram.panels.map((panel, index) => {
              const textPanel = panel.symbols.some(symbol => /[A-Za-z0-9\u4e00-\u9fff]/.test(symbol) && Array.from(symbol).length > 2);
              const inlinePanel = compact && stacked && !textPanel && panel.label.split(/\s+/).every(token => token.length <= 10);
              return <React.Fragment key={index}>
              {index > 0 && <span aria-hidden="true" className={`${kind === 'combine' && index === 2 && !stacked ? 'col-span-3' : ''} text-center ${compact ? 'text-base' : 'text-xl'} font-semibold text-amber-800 ${connector === '→' ? stacked ? 'rotate-90' : responsive ? 'rotate-90 sm:rotate-0' : '' : ''}`}>{kind === 'combine' && index === 2 ? '＝' : connector}</span>}
              <div className={`${kind === 'combine' && index === 2 && !stacked ? 'col-span-3' : ''} min-w-0 rounded-lg border ${panel.tag === '本课词义' ? 'border-amber-500 bg-amber-100' : 'border-amber-200 bg-white/70'} px-2 ${compact ? 'py-1' : 'py-3'} text-center`}>
                {panel.tag && <p className="mb-2 text-xs font-semibold text-stone-600">{panel.tag}</p>}
                <div className={inlinePanel ? 'flex items-center gap-2 text-left' : ''}>
                <div aria-hidden="true" className={`flex flex-wrap ${textPanel ? 'flex-col items-start' : 'justify-center'} gap-1 ${textPanel ? compact ? 'text-sm' : 'text-lg' : inlinePanel ? 'w-12 shrink-0 text-xl' : compact ? 'text-2xl' : 'text-4xl'} leading-normal`}>{panel.symbols.map((symbol, item) => <span key={item}>{symbol}</span>)}</div>
                <div className="min-w-0">
                <p className={`${inlinePanel ? '' : 'mt-2'} whitespace-normal break-normal font-mono font-bold text-stone-800 ${compact ? 'text-sm' : 'text-xl'}`}>
                  {(panel.focusSuffix ? [{ text: panel.label.slice(0, -panel.focusSuffix.length), focus: false }, { text: panel.focusSuffix, focus: true }] : getMnemonicLetterParts(panel.label, panel.focus || [])).map((part, item) => part.focus
                    ? <mark key={item} className="rounded bg-amber-200 px-0.5 text-amber-950 underline decoration-amber-600 underline-offset-4">{part.text}</mark>
                    : <span key={item}>{part.text}</span>)}
                </p>
                <p className="mt-1 text-xs leading-5 text-stone-600">{panel.meaning}</p>
                </div></div>
              </div>
            </React.Fragment>; })}
          </div>
        </>;
      } else if (kind === 'reference') {
        const { left, right, focus, link, sentence, relation } = diagram;
        content = <>
          <svg role="img" aria-label={`${card.word} 的对象与关系`} viewBox="0 0 320 150" className={svgClass}>
            {[left, right].map((node, index) => <g key={index} data-reference-node={index === 0 ? 'left' : 'right'}>
              <rect x={index === 0 ? 10 : 211} y="15" width="99" height="117" rx="10" fill={focus === (index === 0 ? 'left' : 'right') || focus === 'both' ? '#fce3ae' : '#fff'} stroke="#9a5b2a" strokeWidth="2" />
              <text x={index === 0 ? 59 : 260} y="67" textAnchor="middle" fontSize="32">{node.symbol}</text>
              <text x={index === 0 ? 59 : 260} y="98" textAnchor="middle" fontSize="12" fill="#784621">{node.label}</text>
            </g>)}
            <path data-reference-link={relation} d={relation === 'reflexive' ? 'M79 34 C148 -2 157 108 96 109' : 'M116 75 H201'} fill="none" stroke="#9a5b2a" strokeWidth="3" />

          {active === 'semantic' && <><h5 className="mb-2 font-semibold">分清词义</h5><p className="leading-7">{semantic}</p></>}
          {active === 'context' && <><h5 className="mb-2 font-semibold">什么时候会用到？</h5><p className="leading-7">{context.scene}</p><p className="mt-4 whitespace-pre-line border-t border-stone-200 pt-4 leading-7">{card.example}</p><p className="mt-4 rounded-lg bg-amber-50 p-3 text-sm leading-6"><strong>换个情境想一想：</strong>{context.question}</p></>}
          {active === 'morphology' && <>
            <h5 className="mb-3 font-semibold">看看组成和变化</h5>
            {morphology.parts.length > 0 && <div className="mb-4 flex flex-wrap items-center gap-2">{morphology.parts.map((part, index) => <React.Fragment key={index}>
              {index > 0 && <span aria-hidden="true" className="text-stone-500">＋</span>}
              <div className="rounded-lg border border-emerald-200 bg-emerald-50 px-3 py-2"><p className="font-mono text-xl font-bold text-emerald-950">{part.text}</p><p className="mt-1 text-xs text-emerald-900">{part.meaning}</p></div>
            </React.Fragment>)}</div>}
            <p className="leading-7">{morphology.note}</p>
          </>}
          {active === 'phonics' && <>
            <h5 className="mb-3 font-semibold">读一读 · 记易错处 · 收起写</h5>
            {spellingGuide ? <>
              <MnemonicSpellingGuide card={card} />
              <details className="mt-3 text-sm text-stone-600"><summary className="cursor-pointer">完整读写提示</summary><p className="mt-2 whitespace-pre-line leading-7">{card.hint}</p></details>
            </> : <p className="whitespace-pre-line leading-7">{card.hint}</p>}
            {(onHear || onSpellPractice) && <div className="mt-4 flex flex-wrap gap-2">
              {onHear && <button type="button" onClick={onHear} className="rounded-lg border border-stone-300 px-3 py-2 text-sm font-semibold">听读音，指着字母读一遍</button>}
              {onSpellPractice && <button type="button" onClick={onSpellPractice} className="rounded-lg bg-emerald-700 px-3 py-2 text-sm font-semibold text-white">收起提示，写完整词</button>}
            </div>}
          </>}
        </div>
      </section>;
    };

    const matchesSpelling = (input, target) => {
      const answer = input.trim().toLowerCase().replace(/\s+/g, ' ');
      const expected = target.trim().toLowerCase().replace(/\s+/g, ' ');
      if (answer === expected) return true;
      const groupedForms = {
        'life (pl. lives)': ['life', 'lives'],
      };
      if (groupedForms[expected]) return groupedForms[expected].includes(answer);
      if (expected === 'take ... lesson') return /^take (?:[a-z]+ )+lessons?$/.test(answer);
      return false;
    };

    const levenshtein = (a, b) => {
      const m = a.length;
      const n = b.length;
      if (m === 0) return n;
      if (n === 0) return m;
      const dp = Array.from({ length: m + 1 }, () => new Array(n + 1).fill(0));
      for (let i = 0; i <= m; i++) dp[i][0] = i;
      for (let j = 0; j <= n; j++) dp[0][j] = j;
      for (let i = 1; i <= m; i++) {
        for (let j = 1; j <= n; j++) {
          const cost = a[i - 1] === b[j - 1] ? 0 : 1;
          dp[i][j] = Math.min(dp[i - 1][j] + 1, dp[i][j - 1] + 1, dp[i - 1][j - 1] + cost);
        }
      }
      return dp[m][n];
    };

    const spellingDifferences = (input, target) => {
      if (matchesSpelling(input, target)) return [];
      const typed = input.trim().toLowerCase().replace(/\s+/g, ' ');
      const alternatives = {
        'hello/hi': ['hello', 'hi'], 'a/an': ['a', 'an'],
        'life (pl. lives)': ['life', 'lives'],
        'take ... lesson': ['take a swimming lesson'],
      };
      const choices = alternatives[target.toLowerCase()] || [target.toLowerCase()];
      const expected = [...choices].sort((a, b) => levenshtein(typed, a) - levenshtein(typed, b))[0];
      const table = Array.from({ length: typed.length + 1 }, () => Array(expected.length + 1).fill(0));
      for (let i = 0; i <= typed.length; i++) table[i][0] = i;
      for (let j = 0; j <= expected.length; j++) table[0][j] = j;
      for (let i = 1; i <= typed.length; i++) {
        for (let j = 1; j <= expected.length; j++) {
          table[i][j] = Math.min(table[i - 1][j] + 1, table[i][j - 1] + 1, table[i - 1][j - 1] + (typed[i - 1] === expected[j - 1] ? 0 : 1));
        }
      }
      const label = char => char === ' ' ? '空格' : char;
      const changes = [];
      let i = typed.length, j = expected.length;
      while (i || j) {
        if (i && j && typed[i - 1] === expected[j - 1]) { i--; j--; }
        else if (i && j && table[i][j] === table[i - 1][j - 1] + 1) {
          changes.unshift(`${label(typed[i - 1])} 改为 ${label(expected[j - 1])}`); i--; j--;
        } else if (j && table[i][j] === table[i][j - 1] + 1) {
          changes.unshift(`漏写 ${label(expected[j - 1])}`); j--;
        } else {
          changes.unshift(`多写 ${label(typed[i - 1])}`); i--;
        }
      }
      return changes;
    };

    const getSpellingSimilarity = (targetWord, candidateWord) => {
      const a = (targetWord.english_word || '').toLowerCase().trim();
      const b = (candidateWord.english_word || '').toLowerCase().trim();
      if (!a || !b || a === b) return 0;
      const maxLen = Math.max(a.length, b.length);
      const ratio = 1 - levenshtein(a, b) / maxLen;
      let prefix = 0;
      for (let i = 0; i < Math.min(a.length, b.length); i++) {
        if (a[i] === b[i]) prefix += 1;
        else break;
      }
      const prefixBoost = prefix >= 3 ? 0.12 : (prefix >= 2 && maxLen >= 5 ? 0.08 : 0);
      return Math.min(1, ratio + prefixBoost);
    };

    const isSpellingSimilar = (target, candidate, threshold = 0.5) => (
      getSpellingSimilarity(target, candidate) >= threshold
    );

    const isSamePos = (target, candidate) => {
      const p1 = getWordPos(target);
      const p2 = getWordPos(candidate);
      return Boolean(p1 && p2 && p1 === p2);
    };

    // 用中文释义本身判断选项是否会互相“抢意思”。忽略括号说明和泛化的
    // 解释词，只把有实际含义的连续中文片段拿来比较。
    const meaningChunks = (meaning) => normalizeMeaning(meaning)
      .replace(/[（(][^）)]*[）)]/g, '')
      .split(/[；;、，,。/／/]/)
      .map(part => part.replace(/(表示|某个|某物|一个|东西|可以|用来|的人|的地方|的部分|的事)/g, '').trim())
      .filter(part => part.length >= 2);

    // 不同写法也可能同时成立；例如 order 的「订购」不能与「买；购买」同题。
    const purchaseMeaningPattern = /(?:买|购买|采购|订购|订货|下单|点餐|订餐)/;

    const hasMeaningOverlap = (first, second) => {
      const left = meaningChunks(first);
      const right = meaningChunks(second);
      return (purchaseMeaningPattern.test(normalizeMeaning(first)) &&
        purchaseMeaningPattern.test(normalizeMeaning(second))) || left.some(a => right.some(b => (
        a === b || a.includes(b) || b.includes(a)
      )));
    };

    // AI 的返回也必须经过本地硬校验：只有一个正确项，正确释义保持词库原文，
    // 三个干扰项彼此及与正确项均不得重义。这样模型偶尔的格式/语义失误不会进入题目。
    const normalizeAuditedChoices = (word, choices) => {
      const correct = normalizeMeaning(word?.chinese_meaning);
      if (!Array.isArray(choices) || choices.length !== 4 || !correct) return null;
      const normalized = choices.map((choice, index) => ({
        key: choice?.key || `${word.id}:audit:${index}`,
        text: normalizeMeaning(choice?.text),
        isCorrect: choice?.isCorrect === true,
      }));
      if (normalized.filter(choice => choice.isCorrect).length !== 1) return null;
      const answer = normalized.find(choice => choice.isCorrect);
      if (answer.text !== correct) return null;
      const seen = new Set();
      for (const choice of normalized) {
        if (!choice.text || seen.has(choice.text)) return null;
        seen.add(choice.text);
        if (!choice.isCorrect && (hasMeaningOverlap(correct, choice.text) || isExplanationLikeMeaning(choice.text))) return null;
      }
      const distractors = normalized.filter(choice => !choice.isCorrect);
      for (let i = 0; i < distractors.length; i++) {
        for (let j = i + 1; j < distractors.length; j++) {
          if (hasMeaningOverlap(distractors[i].text, distractors[j].text)) return null;
        }
      }
      return normalized;
    };

    const shuffleRecognitionChoices = (choices) => {
      const shuffled = [...choices];
      for (let i = shuffled.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
      }
      return shuffled;
    };

    // 释义是整句解释而不是简洁词义时，放入四选一会显得不自然；只作为最后兜底。
    const isExplanationLikeMeaning = (meaning) => (
      /某物|一个可以|表示|用来|东西|的人|的地方|的部分/.test(normalizeMeaning(meaning))
    );

    const scoreDistractor = (target, candidate) => {
      const targetMeaning = normalizeMeaning(target.chinese_meaning);
      const candidateMeaning = normalizeMeaning(candidate.chinese_meaning);
      // 词性一致能保持题目难度；拼写相似不再加分，避免把形近词误当作语义干扰。
      return Math.random()
        + (isSamePos(target, candidate) ? 20 : 0)
        + (isExplanationLikeMeaning(candidateMeaning) ? -30 : 0)
        + Math.min(candidateMeaning.length, 8) / 100
        + (hasMeaningOverlap(targetMeaning, candidateMeaning) ? -1000 : 0);
    };

    // 见英选义：错误选项必须与正确释义明确不同。优先同词性、简洁释义，
    // 词性缺失时从全库取义项清楚的词，最后才使用解释型释义兜底。
    const buildRecognitionChoices = (currentWord, allWords, choiceCount = 4) => {
      // KET 的识义题只能使用逐题审核后的固定选项；审核未通过的词不拼题。
      if (currentWord.source === 'ket') {
        return hasAuditedRecognitionChoices(currentWord)
          ? currentWord.recognition_choices
          : [];
      }

      const cachedAudit = normalizeAuditedChoices(currentWord, currentWord.recognitionChoiceAudit?.choices);
      if (cachedAudit) return cachedAudit;

      const correct = normalizeMeaning(currentWord.chinese_meaning);
      const pool = allWords.filter(w =>
        w.id !== currentWord.id &&
        normalizeMeaning(w.chinese_meaning) !== correct &&
        normalizeMeaning(w.chinese_meaning).length > 0 &&
        !hasMeaningOverlap(correct, normalizeMeaning(w.chinese_meaning))
      );

      const need = choiceCount - 1;
      const picked = [];
      const usedIds = new Set();
      const usedMeanings = new Set([correct]);

      const addFromTier = ({ samePos = false, allowExplanation = false }) => {
        const ranked = pool
          .filter(w => !usedIds.has(w.id))
          .filter(w => !samePos || isSamePos(currentWord, w))
          .filter(w => allowExplanation || !isExplanationLikeMeaning(w.chinese_meaning))
          .sort((a, b) => scoreDistractor(currentWord, b) - scoreDistractor(currentWord, a));

        for (const w of ranked) {
          const meaning = normalizeMeaning(w.chinese_meaning);
          if (usedMeanings.has(meaning)) continue;
          picked.push(w);
          usedIds.add(w.id);
          usedMeanings.add(meaning);
          if (picked.length >= need) break;
        }
      };

      const tiers = [
        { samePos: true, allowExplanation: false },
        { samePos: false, allowExplanation: false },
        { samePos: true, allowExplanation: true },
        { samePos: false, allowExplanation: true },
      ];

      for (const opts of tiers) {
        if (picked.length >= need) break;
        addFromTier(opts);
      }

      return [
        { key: String(currentWord.id), text: correct, isCorrect: true },
        ...picked.map(w => ({
          key: String(w.id),
          text: normalizeMeaning(w.chinese_meaning),
          isCorrect: false,
        })),
      ];
    };

    const sortGrades = (grades) => (
      [...grades].sort((a, b) => {
        const ia = GRADE_ORDER.indexOf(a);
        const ib = GRADE_ORDER.indexOf(b);
        if (ia === -1 && ib === -1) return a.localeCompare(b, 'zh-CN');
        if (ia === -1) return 1;
        if (ib === -1) return -1;
        return ia - ib;
      })
    );

    // 阅读生词本是独立的文章词库，不应被误当成一个年级 / Unit。
    const getGradesFromSections = (sectionList) => (
      sortGrades([...new Set(
        sectionList
          .filter(section => section !== READING_VOCAB_SECTION)
          .map(section => parseSectionMeta(section).grade)
          .filter(grade => !isHiddenGrade(grade))
      )])
    );

    const getSectionsForGrade = (sectionList, grade) => (
      sectionList
        .filter(s => parseSectionMeta(s).grade === grade && !isHiddenGrade(grade))
        .sort((a, b) => {
          const na = parseInt(a.match(/Unit (\d+)/)?.[1] || '0', 10);
          const nb = parseInt(b.match(/Unit (\d+)/)?.[1] || '0', 10);
          return na - nb;
        })
    );

    const MISTAKE_BOOK_ALL = '⚠️ 错题本';
    const MISTAKE_EXIT_STREAK = 2;
    const READING_DAILY_LIMIT = 50;
    const READING_WARMUP_NEW_LIMIT = 30;
    const READING_DEFAULT_NEW_LIMIT = 15;
    const READING_MASTERED_SAMPLE_LIMIT = 5;
    const READING_FILTER_BATCH_SIZE = 24;
    const PHONICS_BATCH_SIZE = 8;
    const PHONICS_MAGIC_BOOK_URL = 'https://lesong36.github.io/phonics-magic-book/';

    const normalizeReadingWord = (value) => String(value || '').trim().toLowerCase().replace(/\s+/g, ' ');

    // This is deliberately only a hint for AI/review, never a destructive rule.
    // It catches common classroom variants such as play/played/playing and book/books.
    const getReadingVariantStem = (value) => {
      const word = normalizeReadingWord(value);
      if (!/^[a-z]+$/.test(word) || word.length < 5) return word;
      if (word.endsWith('ies') && word.length > 5) return `${word.slice(0, -3)}y`;
      if (word.endsWith('ied') && word.length > 5) return `${word.slice(0, -3)}y`;
      if (word.endsWith('ing') && word.length > 6) {
        let stem = word.slice(0, -3);
        if (stem.length >= 2 && stem.at(-1) === stem.at(-2)) stem = stem.slice(0, -1);
        return stem;
      }
      if (word.endsWith('ed') && word.length > 5) return word.slice(0, -2);
      if (word.endsWith('es') && word.length > 5) return word.slice(0, -2);
      if (word.endsWith('s') && word.length > 4) return word.slice(0, -1);
      return word;
    };

    const buildPhonicsBatchPrompt = (entries) => `你是严谨的小学英语自然拼读老师。请为每个词生成一条 80 字以内的具体声音与字母线索。核对本课词义与实际读音，再说明最多两个具体字母难点（双写、不发音字母、弱读字母或实际词尾变化）。不靠词形猜读音，不把拼写分块称作词根或音节数量，不编口形、双物品、字母标签的牵强联想。不确定读音时说明尚无可靠声音线索，改给准确字母顺序核对点；不能只输出“例外，以音标和听读为准”或“整体记”等空提醒。\n\n只返回严格 JSON，不要 Markdown：{"items":[{"id":"原 id","text":"助记卡"}]}。每个输入必须恰好出现一次。\n\n${entries.map(entry => `- id=${entry.id}; word=${entry.english_word}; meaning=${entry.chinese_meaning}`).join('\n')}`;

    const getReadingDate = (word) => {
      const value = word.sourceArticleDate || word.addedAt || word.importedAt || word.createdAt || '';
      const match = String(value).match(/^\d{4}-\d{2}-\d{2}/);
      return match ? match[0] : '未记录日期';
    };

    const getReadingArticle = (word) => (
      (word.sourceArticleTitle || '').trim() || '未归档文章'
    );

    // 阅读词按表现分层：难词优先，避免曾多次答错的词被“已会”状态掩盖。
    const getReadingLevel = (word) => {
      if (word.readingDeferred) {
        return { key: 'deferred', label: '暂缓', className: 'text-slate-700 bg-slate-100 border-slate-200' };
      }
      const correct = word.correctCount || 0;
      const incorrect = word.incorrectCount || 0;
      if (incorrect >= 2 || (incorrect > 0 && incorrect >= correct)) {
        return { key: 'hard', label: '难词', className: 'text-red-700 bg-red-100 border-red-200' };
      }
      if (word.readingMasteredAt || word.flashcardKnown || (correct >= 2 && (word.consecutiveCorrect || 0) >= 2)) {
        return { key: 'mastered', label: '已掌握', className: 'text-emerald-700 bg-emerald-100 border-emerald-200' };
      }
      return { key: 'new', label: '生词', className: 'text-amber-700 bg-amber-100 border-amber-200' };
    };

    const getMistakeBookKey = (grade = null) => (
      grade ? `${MISTAKE_BOOK_ALL}·${grade}` : MISTAKE_BOOK_ALL
    );

    const isMistakeBookKey = (key) => (
      key === MISTAKE_BOOK_ALL || key.startsWith(`${MISTAKE_BOOK_ALL}·`)
    );

    const getMistakeBookGradeFromKey = (key) => {
      if (key === MISTAKE_BOOK_ALL) return null;
      if (key.startsWith(`${MISTAKE_BOOK_ALL}·`)) {
        return key.slice(MISTAKE_BOOK_ALL.length + 1);
      }
      return null;
    };

    const isInMistakeBook = (word) => (
      (word.incorrectCount || 0) > 0 && !word.mistakeCleared
    );

    const getMistakeLevel = (word) => {
      const n = word.incorrectCount || 0;
      if (n >= 4) {
        return { level: 3, label: '重点', className: 'text-red-700 bg-red-100 border-red-200' };
      }
      if (n >= 2) {
        return { level: 2, label: '需巩固', className: 'text-amber-700 bg-amber-100 border-amber-200' };
      }
      return { level: 1, label: '偶错', className: 'text-orange-700 bg-orange-100 border-orange-200' };
    };

    const getMistakeWords = (wordList, grade = null) => {
      let list = (wordList || []).filter(word => isInMistakeBook(word) && !isHiddenGrade(parseSectionMeta(word.section).grade));
      if (grade) {
        list = list.filter(w => parseSectionMeta(w.section).grade === grade);
      }
      return list;
    };

    const countMistakeByLevel = (wordList, grade = null) => {
      const mistakes = getMistakeWords(wordList, grade);
      return {
        total: mistakes.length,
        level1: mistakes.filter(w => getMistakeLevel(w).level === 1).length,
        level2: mistakes.filter(w => getMistakeLevel(w).level === 2).length,
        level3: mistakes.filter(w => getMistakeLevel(w).level === 3).length,
      };
    };

    const normalizeWordStats = (word) => ({
      ...word,
      correctCount: word.correctCount || 0,
      incorrectCount: word.incorrectCount || 0,
      consecutiveCorrect: word.consecutiveCorrect || 0,
      mistakeCleared: word.mistakeCleared || false,
      ...(word.source === 'reading' ? {
        readingIntroducedAt: word.readingIntroducedAt || '',
        readingNextDueAt: word.readingNextDueAt || '',
        readingMasteredAt: word.readingMasteredAt || '',
        readingReviewStage: Number.isFinite(word.readingReviewStage) ? word.readingReviewStage : 0,
      } : {}),
    });


    const MAX_STUDY_EVENTS = Infinity; // Backward-compatible helper marker; history is never truncated.

    const getAnswerReward = (streak, isCorrect, retried = false) => {
      if (!isCorrect) return { points: 0, bonus: 0, streak: 0, kind: 'incorrect', message: '慢慢来，看看线索，再试一次。积分不会减少。' };
      if (retried) return { points: 5, bonus: 0, streak: 0, kind: 'retry', message: '你找到并改对了！坚持尝试也值得奖励。' };
      const nextStreak = streak + 1;
      const bonus = nextStreak % 3 === 0 ? 5 : 0;
      return { points: 10 + bonus, bonus, streak: nextStreak, kind: bonus ? 'streak' : 'correct', message: bonus ? `连续答对 ${nextStreak} 题！额外奖励 5 分。` : '答对了！你记住了这个词。' };
    };

    // 独立保留奖励流水；完整学习事件不再按条数截断。
    // 两端按同一个答题事件编号合并，重复同步不会重复加分。
    const normalizeRewardLedger = (ledger) => Object.fromEntries(
      Object.entries(ledger && typeof ledger === 'object' && !Array.isArray(ledger) ? ledger : {})
        .filter(([id, points]) => id && Number.isSafeInteger(points) && points > 0 && points <= 15)
    );
    const mergeRewardLedgers = (...ledgers) => {
      const merged = new Map();
      ledgers.forEach(ledger => Object.entries(normalizeRewardLedger(ledger)).forEach(([id, points]) => merged.set(id, Math.max(merged.get(id) || 0, points))));
      return Object.fromEntries(merged);
    };
    const getRewardTotal = (ledger) => Object.values(normalizeRewardLedger(ledger)).reduce((sum, points) => sum + points, 0);

    const FEEDBACK_SOUND_KEY = 'vocabmaster_feedback_sound';
    const createEncouragementPlayer = () => {
      let context;
      let nodes = [];
      let generation = 0;
      const stop = () => {
        generation += 1;
        nodes.forEach(({ oscillator, gain }) => {
          try { oscillator.stop(); } catch {}
          oscillator.disconnect();
          gain.disconnect();
        });
        nodes = [];
      };
      const play = async (kind) => {
        stop();
        const request = generation;
        try {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (!AudioContext) return false;
          if (!context || context.state === 'closed') context = new AudioContext();
          // 在孩子点击或提交答案时解锁声音，兼容移动浏览器的播放限制。
          if (context.state !== 'running') await context.resume();
          if (request !== generation || context.state !== 'running') return false;
          const notes = kind === 'streak' ? [523.25, 659.25, 783.99, 1046.50]
            : kind === 'incorrect' ? [392, 440]
            : kind === 'retry' ? [523.25, 783.99] : [659.25, 880];
          notes.forEach((frequency, index) => {
            const oscillator = context.createOscillator();
            const gain = context.createGain();
            const start = context.currentTime + index * 0.11;
            oscillator.type = 'sine';
            oscillator.frequency.setValueAtTime(frequency, start);
            gain.gain.setValueAtTime(0, start);
            gain.gain.linearRampToValueAtTime(kind === 'incorrect' ? 0.035 : 0.06, start + 0.015);
            gain.gain.exponentialRampToValueAtTime(0.001, start + 0.16);
            oscillator.connect(gain);
            gain.connect(context.destination);
            const node = { oscillator, gain };
            nodes.push(node);
            oscillator.onended = () => {
              oscillator.disconnect();
              gain.disconnect();
              nodes = nodes.filter(item => item !== node);
            };
            oscillator.start(start);
            oscillator.stop(start + 0.18);
          });
          return true;
        } catch {
          stop();
          return false; // 声音不可用时，文字反馈和答题保存照常继续。
        }
      };
      return { play, stop, close: () => { stop(); if (context) context.close().catch(() => {}); } };
    };

    const normalizeStudyEvents = (events) => (
      Array.isArray(events)
        ? events.filter(event => event && event.id && event.at && event.wordId && (event.result === 'correct' || event.result === 'incorrect'))
        : []
    );

    const mergeStudyEvents = (remoteEvents = [], localEvents = []) => {
      const byId = new Map();
      [...normalizeStudyEvents(remoteEvents), ...normalizeStudyEvents(localEvents)].forEach(event => { if (!byId.has(event.id)) byId.set(event.id, event); });
      return [...byId.values()].sort((a, b) => a.at.localeCompare(b.at));
    };

    const getLocalDateKey = (value) => {
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return '';
      const offsetDate = new Date(date.getTime() - date.getTimezoneOffset() * 60000);
      return offsetDate.toISOString().slice(0, 10);
    };

    const addLocalDays = (value, days) => {
      const date = new Date(value);
      date.setHours(12, 0, 0, 0);
      date.setDate(date.getDate() + days);
      return getLocalDateKey(date);
    };

    const getTodayStudySummary = (events) => {
      const today = getLocalDateKey(new Date());
      const todayEvents = normalizeStudyEvents(events).filter(event => getLocalDateKey(event.at) === today);
      const words = [...new Map(todayEvents.map(event => [event.wordId, event])).values()];
      const correct = todayEvents.filter(event => event.result === 'correct').length;
      const incorrect = todayEvents.filter(event => event.result === 'incorrect').length;
      return { words, correct, incorrect, total: correct + incorrect };
    };

    const getWeeklyStudySummaries = (events, weeks = 4, now = new Date()) => {
      const today = new Date(now);
      today.setHours(0, 0, 0, 0);
      const monday = new Date(today);
      monday.setDate(today.getDate() - ((today.getDay() + 6) % 7));
      const normalized = normalizeStudyEvents(events);

      return Array.from({ length: weeks }, (_, index) => {
        const weeksAgo = weeks - index - 1;
        const start = new Date(monday);
        start.setDate(monday.getDate() - weeksAgo * 7);
        const end = new Date(start);
        end.setDate(start.getDate() + 7);
        const weekEvents = normalized.filter(event => {
          const eventDate = new Date(event.at);
          return !Number.isNaN(eventDate.getTime()) && eventDate >= start && eventDate < end;
        });
        const correct = weekEvents.filter(event => event.result === 'correct').length;
        const incorrect = weekEvents.length - correct;
        const words = new Set(weekEvents.map(event => event.wordId));
        const days = new Set(weekEvents.map(event => getLocalDateKey(event.at)).filter(Boolean));
        const weekEnd = new Date(end);
        weekEnd.setDate(end.getDate() - 1);
        const dailySummaries = Array.from({ length: 7 }, (_, dayIndex) => {
          const date = new Date(start);
          date.setDate(start.getDate() + dayIndex);
          const dateKey = getLocalDateKey(date);
          const dayEvents = weekEvents.filter(event => getLocalDateKey(event.at) === dateKey);
          const dayCorrect = dayEvents.filter(event => event.result === 'correct').length;
          const wordStats = new Map();
          dayEvents.forEach(event => {
            const current = wordStats.get(event.wordId) || { word: event.englishWord || '未命名单词', correct: 0, incorrect: 0 };
            current.correct += event.result === 'correct' ? 1 : 0;
            current.incorrect += event.result === 'incorrect' ? 1 : 0;
            wordStats.set(event.wordId, current);
          });
          return {
            dateKey,
            label: `${date.getMonth() + 1}/${date.getDate()}`,
            weekday: ['日', '一', '二', '三', '四', '五', '六'][date.getDay()],
            total: dayEvents.length,
            correct: dayCorrect,
            incorrect: dayEvents.length - dayCorrect,
            accuracy: dayEvents.length ? Math.round((dayCorrect / dayEvents.length) * 100) : null,
            words: [...wordStats.values()],
          };
        });
        return {
          startKey: getLocalDateKey(start),
          label: weeksAgo === 0 ? '本周' : `${weeksAgo} 周前`,
          dateRange: `${start.getMonth() + 1}/${start.getDate()}–${weekEnd.getMonth() + 1}/${weekEnd.getDate()}`,
          correct,
          incorrect,
          total: weekEvents.length,
          wordCount: words.size,
          dayCount: days.size,
          accuracy: weekEvents.length ? Math.round((correct / weekEvents.length) * 100) : null,
          days: dailySummaries,
        };
      });
    };

    // 词库曾将四上 Unit 2/3/5/6/7 误标为四下（id 176-278），加载时自动纠正
    const MISPLACED_ID_RANGE = [176, 278];
    const MISPLACED_SECTION_MAP = {
      '四下Unit 2': '四上Unit 2',
      '四下Unit 3': '四上Unit 3',
      '四下Unit 5': '四上Unit 5',
      '四下Unit 6': '四上Unit 6',
      '四下Unit 7': '四上Unit 7',
    };

    const isMisplacedWordId = (id) => {
      const n = parseInt(id, 10);
      return !Number.isNaN(n) && n >= MISPLACED_ID_RANGE[0] && n <= MISPLACED_ID_RANGE[1];
    };

    const migrateMislabeledWords = (wordList) => (
      (wordList || []).map(w => {
        if (isMisplacedWordId(w.id) && MISPLACED_SECTION_MAP[w.section]) {
          return { ...w, section: MISPLACED_SECTION_MAP[w.section] };
        }
        return w;
      })
    );

    const migrateSelectedSections = (sections, wordList) => {
      const list = sections || [];
      const words = wordList || [];
      return list.map(section => {
        if (!MISPLACED_SECTION_MAP[section]) return section;
        const hasMisplaced = words.some(w => w.section === section && isMisplacedWordId(w.id));
        const hasReal = words.some(w => w.section === section && !isMisplacedWordId(w.id));
        if (hasMisplaced && !hasReal) return MISPLACED_SECTION_MAP[section];
        return section;
      });
    };

    // 三下词库原把 Lesson 编号误标为 Unit，按北京版（2024）教材映射为真正 Unit
    const SANXIA_LESSON_TO_UNIT = {
      1: 1, 2: 1, 3: 1, 4: 1,
      5: 2, 6: 2, 7: 2, 8: 2,
      9: 3, 10: 3, 11: 3, 12: 3,
      13: 4, 14: 4,
      15: 5, 16: 5, 17: 5, 18: 5,
      19: 6, 20: 6, 21: 6, 22: 6,
      23: 7, 24: 7, 25: 7, 26: 7,
      27: 8, 28: 8,
    };

    const normalizeSanxiaSection = (section) => {
      const match = section.match(/^三下Unit (\d+)$/);
      if (!match) return section;
      const lesson = parseInt(match[1], 10);
      const unit = SANXIA_LESSON_TO_UNIT[lesson];
      return unit ? `三下Unit ${unit}` : section;
    };

    const hasLegacySanxiaLessons = (wordList) => (wordList || []).some(word => {
      const match = String(word.section || '').match(/^三下Unit (\d+)$/);
      return match && Number(match[1]) > 8;
    });

    const migrateSanxiaWords = (wordList) => {
      const needsMigration = hasLegacySanxiaLessons(wordList);
      return (wordList || []).map(w => ({
        ...w,
        // 已转换的 Unit 1–8 不能在每次加载、合并时再次当作 Lesson 转换。
        section: needsMigration ? normalizeSanxiaSection(w.section) : w.section,
      }));
    };

    const migrateSanxiaSelectedSections = (sections, wordList) => {
      const mapped = hasLegacySanxiaLessons(wordList)
        ? (sections || []).map(normalizeSanxiaSection)
        : (sections || []);
      return [...new Set(mapped)];
    };

    // 合并词条的旧进度留在原编号上，新拆出的词从未练习开始，避免凭空标为已掌握。
    const splitAlternativeWords = (wordList) => {
      const alternatives = {
        'hello/hi': [
          { english_word: 'hello', chinese_meaning: '你好（问候语）', pos: 'int.' },
          { english_word: 'hi', chinese_meaning: '你好（问候语）', pos: 'int.' },
        ],
        'a/an': [
          { english_word: 'a', chinese_meaning: '一个（用于辅音音素前）', pos: 'det.' },
          { english_word: 'an', chinese_meaning: '一个（用于元音音素前）', pos: 'det.' },
        ],
      };
      const existingIds = new Set((wordList || []).map(word => String(word.id)));
      return (wordList || []).flatMap(word => {
        const forms = alternatives[String(word.english_word || '').trim().toLowerCase()];
        if (!forms) return [word];
        const { pronunciation, audioUrl, phonicsMnemonic, phonicsMnemonicAddedAt, printableHint, printableHintSource, ...original } = word;
        return forms.flatMap((form, index) => {
          if (index === 0) return [{ ...original, ...form }];
          const id = `${word.id}:${form.english_word}`;
          if (existingIds.has(id)) return [];
          return [normalizeWordStats({
            id, section: word.section, learning_requirement: word.learning_requirement,
            ...(word.source ? { source: word.source } : {}), ...form,
          })];
        });
      });
    };

    const pronunciationKey = (wordText) => String(wordText || '').trim().toLowerCase().replace(/\s*\(pl\..*\)\s*$/, '');
    const formatIPA = (value) => {
      const text = String(value || '').trim().replace(/^[\/\[]+|[\/\]]+$/g, '');
      return text ? `/${text}/` : '';
    };

    const migrateUserRecord = (user) => {
      if (!user) return user;
      let words = migrateMislabeledWords(user.words);
      words = splitAlternativeWords(migrateSanxiaWords(words)).map(normalizeWordStats);
      const studyEvents = normalizeStudyEvents(user.studyEvents);
      const readingEvents = new Map();
      studyEvents.forEach(event => {
        if (event.section !== READING_VOCAB_SECTION) return;
        const history = readingEvents.get(event.wordId) || [];
        history.push(event);
        readingEvents.set(event.wordId, history);
      });
      words = words.map(word => {
        const history = word.source === 'reading' ? readingEvents.get(word.id) : null;
        if (!history?.length || word.readingIntroducedAt) return word;
        history.sort((a, b) => a.at.localeCompare(b.at));
        const correct = history.filter(event => event.result === 'correct').length;
        const incorrect = history.length - correct;
        return {
          ...word,
          readingIntroducedAt: history[0].at,
          readingNextDueAt: word.readingNextDueAt || addLocalDays(history.at(-1).at, 1),
          correctCount: Math.max(word.correctCount || 0, correct),
          incorrectCount: Math.max(word.incorrectCount || 0, incorrect),
          vocabMasterProgressUpdatedAt: new Date().toISOString(),
        };
      });
      let selectedSections = migrateSelectedSections(user.selectedSections, words);
      selectedSections = migrateSanxiaSelectedSections(selectedSections, user.words);
      selectedSections = selectedSections.filter(section => !isHiddenGrade(parseSectionMeta(section).grade));
      return {
        ...user,
        words,
        readingQueueCursor: normalizeReadingQueueCursor(user.readingQueueCursor),
        selectedGrade: isHiddenGrade(user.selectedGrade) ? null : user.selectedGrade,
        selectedSections,
        studyEvents,
        rewardLedger: normalizeRewardLedger(user.rewardLedger),
      };
    };

    const buildPayload = (currentUserId, users) => ({
      version: STORAGE_VERSION,
      currentUserId,
      users,
      savedAt: new Date().toISOString(),
    });

    const isValidAppData = (data) =>
      data && data.version === STORAGE_VERSION && data.users && typeof data.users === 'object';

    const mergeCloudWord = (remote = {}, local = {}) => {
      const remoteUpdatedAt = remote.vocabMasterProgressUpdatedAt || remote.updatedAt || '';
      const localUpdatedAt = local.vocabMasterProgressUpdatedAt || local.updatedAt || '';
      const remoteTime = Date.parse(remoteUpdatedAt);
      const localTime = Date.parse(localUpdatedAt);
      const localIsNewer = Number.isFinite(localTime) && Number.isFinite(remoteTime)
        ? localTime >= remoteTime
        : localUpdatedAt >= remoteUpdatedAt;
      const newest = localIsNewer ? local : remote;
      return normalizeWordStats({
        ...remote,
        ...local,
        ...newest,
        correctCount: Math.max(remote.correctCount || 0, local.correctCount || 0),
        incorrectCount: Math.max(remote.incorrectCount || 0, local.incorrectCount || 0),
        consecutiveCorrect: Math.max(remote.consecutiveCorrect || 0, local.consecutiveCorrect || 0),
        // 错题状态不是单调值：后一次答错必须能把已移出的词重新放回错题本。
        // 因此跟随最新记录，不能用 OR 把旧的“已掌握”永久保留下来。
        mistakeCleared: Boolean(newest.mistakeCleared),
        flashcardKnown: Boolean(remote.flashcardKnown || local.flashcardKnown),
        vocabMasterProgressUpdatedAt: localIsNewer ? localUpdatedAt : remoteUpdatedAt,
      });
    };

    const mergeCloudAppState = (remote = null, local = null) => {
      if (!isValidAppData(remote)) return local;
      if (!isValidAppData(local)) return remote;
      // 先拆分两端的旧词条，避免合并时把组合音标和助记重新带回独立单词。
      remote = { ...remote, users: Object.fromEntries(Object.entries(remote.users).map(([id, user]) => [id, migrateUserRecord(user)])) };
      local = { ...local, users: Object.fromEntries(Object.entries(local.users).map(([id, user]) => [id, migrateUserRecord(user)])) };
      const users = { ...remote.users };
      const remoteUserIdByName = new Map(Object.entries(remote.users).map(([id, user]) => [String(user.name || '').trim().toLowerCase(), id]));
        const localUserIdMap = new Map();
        Object.entries(local.users).forEach(([id, localUser]) => {
        const matchingRemoteId = users[id] ? id : remoteUserIdByName.get(String(localUser.name || '').trim().toLowerCase());
        localUserIdMap.set(id, matchingRemoteId || id);
        const remoteUser = matchingRemoteId ? users[matchingRemoteId] : null;
        if (!remoteUser) { users[id] = localUser; return; }
        const ignoredReadingWordIds = [...new Set([
          ...(remoteUser.ignoredReadingWordIds || []),
          ...(localUser.ignoredReadingWordIds || []),
        ])];
        const ignored = new Set(ignoredReadingWordIds);
        const words = new Map((remoteUser.words || []).map(word => [word.id, word]));
        (localUser.words || []).forEach(word => words.set(word.id, mergeCloudWord(words.get(word.id), word)));
        const remoteIsNewer = (remoteUser.updatedAt || '') > (localUser.updatedAt || '');
        users[matchingRemoteId] = {
          ...(remoteIsNewer ? localUser : remoteUser),
          ...(remoteIsNewer ? remoteUser : localUser),
          // 删除阅读词是跨设备的墓碑操作，不能被另一台设备的旧副本重新合并回来。
          words: [...words.values()].filter(word => !ignored.has(word.id)),
          studyEvents: mergeStudyEvents(remoteUser.studyEvents, localUser.studyEvents),
          rewardLedger: mergeRewardLedgers(remoteUser.rewardLedger, localUser.rewardLedger),
          ignoredReadingWordIds,
          updatedAt: remoteIsNewer ? remoteUser.updatedAt : localUser.updatedAt,
        };
      });
      const remoteIsNewer = (remote.savedAt || '') > (local.savedAt || '');
      return {
        version: STORAGE_VERSION,
        users,
        currentUserId: remoteIsNewer ? remote.currentUserId : (localUserIdMap.get(local.currentUserId) || local.currentUserId),
        savedAt: remoteIsNewer ? remote.savedAt : local.savedAt,
      };
    };

    // 阅读器账号是唯一的学习身份。旧版本允许在同一设备创建多个名字，
    // 这里将这些历史档案的词汇和答题记录合并到该阅读器账号下。
    const collapseToReaderAccount = (state, readerUser) => {
      if (!isValidAppData(state) || !readerUser?.id) return state;
      const accountId = `reader_${readerUser.id}`;
      const records = Object.entries(state.users || {})
        .filter(([id]) => id === accountId || !id.startsWith('reader_'))
        .map(([, user]) => migrateUserRecord(user));
      if (records.length === 0) {
        const user = createEmptyUser(readerUser.email || '阅读器学习档案');
        user.id = accountId;
        return buildPayload(accountId, { [accountId]: user });
      }
      const newest = records.reduce((latest, user) =>
        !latest || (user.updatedAt || '') > (latest.updatedAt || '') ? user : latest, null);
      const ignoredReadingWordIds = [...new Set(records.flatMap(user => user.ignoredReadingWordIds || []))];
      const ignored = new Set(ignoredReadingWordIds);
      const words = new Map();
      records.forEach(user => (user.words || []).forEach(word =>
        !ignored.has(word.id) && words.set(word.id, mergeCloudWord(words.get(word.id), word))
      ));
      const merged = {
        ...newest,
        id: accountId,
        name: readerUser.email || newest.name || '阅读器学习档案',
        words: [...words.values()],
        // 选择跟随最新档案；空数组表示已取消，不能用历史选择的并集恢复。
        selectedSections: newest.selectedSections || [],
        studyEvents: records.reduce((events, user) => mergeStudyEvents(events, user.studyEvents), []),
        rewardLedger: mergeRewardLedgers(...records.map(user => user.rewardLedger)),
        ignoredReadingWordIds,
        updatedAt: records.reduce((latest, user) => (user.updatedAt || '') > latest ? (user.updatedAt || '') : latest, ''),
      };
      return { ...buildPayload(accountId, { [accountId]: merged }), savedAt: state.savedAt || merged.updatedAt };
    };

    // Durable answers are independent of the replaceable UI snapshot, scoped to the signed-in account.
    const LEARNING_OUTBOX_PREFIX = 'vocabmaster_learning_outbox_v3:';
    const normalizeReadingQueueCursor = (cursor) => {
      if (!cursor) return null;
      if (typeof cursor === 'string') {
        const [importedAt, wordId] = cursor.split('\u0000');
        return wordId ? { importedAt, wordId } : null;
      }
      return typeof cursor.importedAt === 'string' && typeof cursor.wordId === 'string'
        ? { importedAt: cursor.importedAt, wordId: cursor.wordId } : null;
    };
    const readingCursorOrderKey = (cursor) => {
      const normalized = normalizeReadingQueueCursor(cursor);
      return normalized ? `${normalized.importedAt}\u0000${normalized.wordId}` : '';
    };
    const sanitizeLearningPayload = (value) => {
      const clean = (item, key = '') => {
        if (key === 'readingQueueCursor') item = normalizeReadingQueueCursor(item);
        if (typeof item === 'string' && item.includes('\u0000')) throw Object.assign(new Error('学习记录包含无法同步的空字符，请导出备份后修复。'), { syncHealthCode: 'invalid_payload' });
        if (Array.isArray(item)) return item.map(entry => clean(entry));
        if (item && typeof item === 'object') return Object.fromEntries(Object.entries(item).map(([name, entry]) => {
          if (name.includes('\u0000')) throw Object.assign(new Error('学习记录字段包含空字符。'), { syncHealthCode: 'invalid_payload' });
          return [name, clean(entry, name)];
        }));
        return item;
      };
      return clean(value);
    };
    const learningSnapshotKey = (value) => JSON.stringify(value, (_key, item) =>
      item && typeof item === 'object' && !Array.isArray(item)
        ? Object.fromEntries(Object.keys(item).sort().map(key => [key, item[key]])) : item);
    const learningMutationId = () => crypto.randomUUID();
    const learningAccountKey = (id) => String(id || '').replace(/^reader_/, '');
    const learningEventPrefix = (accountId) => `${LEARNING_OUTBOX_PREFIX}${learningAccountKey(accountId)}:event:`;
    const readLearningOutbox = (accountId) => {
      const raw = localStorage.getItem(LEARNING_OUTBOX_PREFIX + learningAccountKey(accountId));
      const box = raw ? JSON.parse(raw) : { version: 3, epoch: null, revision: 0, events: [] };
      if (!Array.isArray(box.events)) throw new Error('待同步答题备份损坏；请保留备份，不要继续答题。');
      const events = new Map(box.events.map(event => [event.id, event]));
      const prefix = learningEventPrefix(accountId);
      for (let index = 0; index < localStorage.length; index++) {
        const key = localStorage.key(index);
        if (key?.startsWith(prefix)) {
          const event = JSON.parse(localStorage.getItem(key));
          if (!event?.id) throw new Error('待同步答题备份损坏。');
          events.set(event.id, event);
        }
      }
      return { ...box, events: [...events.values()] };
    };
    const enqueueLearningEvent = (accountId, event) => {
      const key = learningEventPrefix(accountId) + event.id;
      // One immutable key per answer: another tab cannot replace this answer by saving an older queue.
      if (!localStorage.getItem(key)) {
        const raw = JSON.stringify(sanitizeLearningPayload(event));
        localStorage.setItem(key, raw);
        if (localStorage.getItem(key) !== raw) throw new Error('答题记录未能保存到本机。');
      }
      return event;
    };
    const writeLearningOutbox = (accountId, box) => {
      const existing = readLearningOutbox(accountId);
      for (const event of [...existing.events, ...box.events]) enqueueLearningEvent(accountId, event);
      const raw = JSON.stringify(sanitizeLearningPayload({ ...box, events: [] }));
      localStorage.setItem(LEARNING_OUTBOX_PREFIX + learningAccountKey(accountId), raw);
    };
    const acknowledgeLearningEvents = (accountId, ids, metadata) => {
      // Migrate legacy arrays before clearing them, then remove only individually confirmed events.
      writeLearningOutbox(accountId, { ...readLearningOutbox(accountId), ...metadata });
      for (const id of ids) localStorage.removeItem(learningEventPrefix(accountId) + id);
      return readLearningOutbox(accountId);
    };
    // Health metadata uses a separate request so failed learning writes can still raise an alert.
    const learningSyncHealthStates = new Map();
    const learningSyncDeviceIds = new Map();
    const learningSyncErrorCode = (error) => {
      const safe = ['invalid_payload', 'receipt_invalid', 'database_rejected', 'storage_failed', 'sync_failed'];
      if (safe.includes(error?.syncHealthCode)) return error.syncHealthCode;
      if (error?.name === 'QuotaExceededError' || /quota|storage|本机|备份损坏/i.test(error?.message || '')) return 'storage_failed';
      if (/^(22|23|P000)/.test(String(error?.code || ''))) return 'database_rejected';
      return 'sync_failed';
    };
    const reportLearningSyncHealth = async ({ accountId, rpc, healthy, error }) => {
      if (!accountId) return;
      let state = learningSyncHealthStates.get(accountId);
      if (!state) {
        state = { healthy: false, errorCode: null, lastReportedAt: 0, reportedSignature: null, inFlight: false };
        learningSyncHealthStates.set(accountId, state);
      }
      if (typeof healthy === 'boolean') {
        state.healthy = healthy;
        state.errorCode = healthy ? null : learningSyncErrorCode(error);
      }
      // A heartbeat never upgrades an unresolved failure to healthy.
      if (!state.healthy && !state.errorCode) return;
      let pending = [];
      try { pending = readLearningOutbox(accountId).events; }
      catch (error) { state.healthy = false; state.errorCode = 'storage_failed'; }
      const signature = `${state.healthy}:${state.errorCode}`;
      const now = Date.now();
      if (state.inFlight || (state.reportedSignature === signature && now - state.lastReportedAt < 60000)) return;
      try {
        let learningSyncDeviceId = learningSyncDeviceIds.get(accountId);
        if (!learningSyncDeviceId) {
          const key = `vocabmaster_sync_device_v1:${accountId}`;
          const readDevice = (storage) => {
            const stored = storage.getItem(key);
            const id = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(stored || '') ? stored : learningMutationId();
            storage.setItem(key, id);
            return id;
          };
          // All tabs share the same durable outbox; reopening must resolve the same server incident.
          try { learningSyncDeviceId = readDevice(localStorage); }
          catch {
            try { learningSyncDeviceId = readDevice(sessionStorage); }
            catch { learningSyncDeviceId = learningMutationId(); }
          }
          learningSyncDeviceIds.set(accountId, learningSyncDeviceId);
        }
        const dates = pending.map(event => Date.parse(event.at)).filter(Number.isFinite);
        state.inFlight = true;
        const { error: reportError } = await rpc('report_vocab_sync_health_v1', {
          p_device_id: learningSyncDeviceId, p_pending_count: pending.length,
          p_oldest_pending_at: dates.length ? new Date(dates.reduce((oldest, date) => Math.min(oldest, date), Infinity)).toISOString() : null,
          p_error_code: state.errorCode, p_healthy: state.healthy,
        });
        if (!reportError) { state.lastReportedAt = now; state.reportedSignature = signature; }
      } catch { /* Keep the last failure for the existing retry loop; telemetry must never block an answer. */ }
      finally { state.inFlight = false; }
    };
    const reconcileLearningState = (remote, local, accountId) => {
      const id = `reader_${accountId}`;
      const server = remote.users[id];
      const browser = local?.users?.[id];
      if (!server || !browser) return remote;
      const protectedStats = ['correctCount', 'incorrectCount', 'consecutiveCorrect', 'mistakeCleared'];
      const localWords = new Map((browser.words || []).map(word => [String(word.id), word]));
      const ignored = new Set([...(server.ignoredReadingWordIds || []), ...(browser.ignoredReadingWordIds || [])]);
      const words = (server.words || []).filter(word => !ignored.has(word.id)).map(word => {
        const pending = localWords.get(String(word.id));
        localWords.delete(String(word.id));
        if (!pending || (pending.vocabMasterProgressUpdatedAt || '') <= (word.vocabMasterProgressUpdatedAt || '')) return word;
        return { ...word, ...pending, ...Object.fromEntries(protectedStats.map(key => [key, word[key]])) };
      });
      for (const word of localWords.values()) {
        if (!ignored.has(word.id)) words.push({ ...word, correctCount: 0, incorrectCount: 0, consecutiveCorrect: 0, mistakeCleared: false });
      }
      const metadata = (browser.updatedAt || '') > (server.updatedAt || '') ? browser : server;
      return { ...remote, users: { [id]: { ...server, ...metadata, words, studyEvents: server.studyEvents,
        rewardLedger: server.rewardLedger, ignoredReadingWordIds: [...ignored] } } };
    };
    const replayPendingLearningEvents = (state, accountId, pending) => {
      if (!isValidAppData(state)) throw new Error('云端未返回完整学习档案。');
      const userId = `reader_${accountId}`;
      const user = state.users[userId];
      if (!user) throw new Error('云端返回的学习账号不匹配。');
      const seen = new Set((user.studyEvents || []).map(event => event.id));
      const events = pending.filter(event => !seen.has(event.id)).sort((a, b) => a.at.localeCompare(b.at));
      const words = new Map((user.words || []).map(word => [String(word.id), { ...word }]));
      for (const event of events) {
        let word = words.get(String(event.wordId));
        if (!word && event.wordDefinition) {
          word = { ...event.wordDefinition, correctCount: 0, incorrectCount: 0, consecutiveCorrect: 0, mistakeCleared: false };
          words.set(String(event.wordId), word);
        }
        if (!word) throw new Error('待同步答题缺少单词定义，请保留备份。');
        const correct = event.result === 'correct';
        const streak = correct ? (word.consecutiveCorrect || 0) + 1 : 0;
        Object.assign(word, {
          correctCount: (word.correctCount || 0) + (correct ? 1 : 0),
          incorrectCount: (word.incorrectCount || 0) + (correct ? 0 : 1),
          consecutiveCorrect: streak,
          mistakeCleared: correct ? Boolean(word.mistakeCleared || ((word.incorrectCount || 0) > 0 && streak >= MISTAKE_EXIT_STREAK)) : false,
          ...Object.fromEntries(Object.entries(event.wordState || {}).filter(([key]) => ['readingIntroducedAt', 'readingNextDueAt', 'readingMasteredAt', 'readingReviewStage'].includes(key))),
          vocabMasterProgressUpdatedAt: event.at,
        });
      }
      return { ...state, users: { ...state.users, [userId]: {
        ...user, words: [...words.values()], studyEvents: mergeStudyEvents(user.studyEvents, events),
        rewardLedger: { ...normalizeRewardLedger(user.rewardLedger), ...Object.fromEntries(events.filter(event => event.rewardPoints > 0).map(event => [event.id, event.rewardPoints])) },
        updatedAt: events.at(-1)?.at || user.updatedAt,
      } } };

    const syncLearningOutbox = async ({ accountId, master, rpc, isCurrentAccount = () => true }) => {
      const box = readLearningOutbox(accountId);
      const submitted = sanitizeLearningPayload(master);
      if (submitted.appState?.users?.[`reader_${accountId}`]) submitted.appState = replayPendingLearningEvents(submitted.appState, accountId, box.events);
      let { data, error } = await rpc('sync_vocab_master_v3', {
        p_master: submitted, p_mutation_id: learningMutationId(), p_expected_epoch: box.epoch,
      });
      if (error && (error.details === 'VMEPOCH' || error.detail === 'VMEPOCH' || String(error.code).includes('409') || /epoch/i.test(error.message || ''))) {
        const bootstrap = await rpc('sync_vocab_master_v3', {
          p_master: { version: 3, appState: { version: STORAGE_VERSION, currentUserId: `reader_${accountId}`, users: {} } },
          p_mutation_id: learningMutationId(), p_expected_epoch: null,
        });
        if (bootstrap.error) throw bootstrap.error;
        const fresh = Array.isArray(bootstrap.data) ? bootstrap.data[0] : bootstrap.data;
        if (!fresh?.master?.appState || !fresh.epoch) throw Object.assign(new Error('云端档案版本读取失败。'), { syncHealthCode: 'receipt_invalid' });
        if (!isCurrentAccount()) return null;
        const pending = readLearningOutbox(accountId);
        const rebased = replayPendingLearningEvents(reconcileLearningState(fresh.master.appState, submitted.appState, accountId), accountId, pending.events);
        ({ data, error } = await rpc('sync_vocab_master_v3', {
          p_master: sanitizeLearningPayload({ ...fresh.master, appState: rebased }),
          p_mutation_id: learningMutationId(), p_expected_epoch: fresh.epoch,
        }));
      }
      if (error) throw error;
      const response = Array.isArray(data) ? data[0] : data;
      if (!response?.master?.appState || !Array.isArray(response.acknowledgedEventIds) || !response.epoch || !Number.isInteger(response.revision)) throw Object.assign(new Error('云端未确认答题记录，稍后将继续重试。'), { syncHealthCode: 'receipt_invalid' });
      if (!isCurrentAccount()) return null;
      const latest = readLearningOutbox(accountId);
      const ack = new Set(response.acknowledgedEventIds);
      const returnedIds = new Set(Object.values(response.master.appState.users || {}).flatMap(user => (user.studyEvents || []).map(event => event.id)));
      // Never clear an event merely because the request succeeded: require both its receipt and its returned history.
      const events = latest.events.filter(event => !(ack.has(event.id) && returnedIds.has(event.id)));
      const remaining = acknowledgeLearningEvents(accountId, latest.events.filter(event => ack.has(event.id) && returnedIds.has(event.id)).map(event => event.id), { epoch: response.epoch, revision: response.revision });
      return { ...response, healthErrorCode: box.events.some(event => !ack.has(event.id) || !returnedIds.has(event.id)) ? 'receipt_invalid' : null, pendingCount: remaining.events.length, appState: replayPendingLearningEvents(reconcileLearningState(response.master.appState, submitted.appState, accountId), accountId, remaining.events) };

          incorrectCount: w.incorrectCount || 0,

        }])
      );
      return splitAlternativeWords(incomingWords).map(w => {
        const prev = statsById.get(w.id);
        return normalizeWordStats({
          ...prev,
          ...w,
          correctCount: prev?.correctCount ?? w.correctCount ?? 0,
          incorrectCount: prev?.incorrectCount ?? w.incorrectCount ?? 0,

      const lines = text.split('\n');
      const parsedWords = [];

      lines.forEach(line => {
        let parts = [];

        if (line.includes('|')) {
          parts = line.split('|').map(s => s.trim());
          if (parts[0] === '') parts.shift();
          if (parts[parts.length - 1] === '') parts.pop();
        } else if (line.includes(',')) {
          parts = line.split(',').map(s => s.trim());
        } else {
          return;
        }

        if (parts.length >= 5 && !parts[0].match(/^[-:]+$/) && parts[0].toLowerCase() !== 'id') {
          parsedWords.push(normalizeWordStats({
            id: parts[0],
            section: parts[1],
            english_word: parts[2],
            chinese_meaning: parts[3],
            learning_requirement: parts[4],
            pos: parts[5] || '',
            correctCount: 0,
            incorrectCount: 0,
            consecutiveCorrect: 0,
            mistakeCleared: false,
          }));
        }
      });
      return splitAlternativeWords(parsedWords);
